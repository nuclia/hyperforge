name: Progress FORGE

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "hyperforge/**"
      - "HYPERFORGE.Dockerfile"
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "hyperforge/**"
      - "HYPERFORGE.Dockerfile"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  PYTHON_ARTIFACT_REGISTRY: europe-west4-python.pkg.dev/nuclia-internal/nuclia-internal-python/simple/
  GCP_WORKLOAD_IDENTITY_PROVIDER: "projects/224545243904/locations/global/workloadIdentityPools/gh-nuclia/providers/gh-nuclia-provider"
  GCP_SERVICE_ACCOUNT: "github-actions@nuclia-internal.iam.gserviceaccount.com"

jobs:
  test:
    name: Testing
    runs-on: learning-simple-arc-runners
    permissions:
      id-token: write # google-github-actions/auth (OIDC)
      contents: read # actions/checkout ×2
      pull-requests: write # orgoro/coverage
    outputs:
      component: ${{ steps.param.outputs.component }}
      hash: ${{ steps.param.outputs.hash }}
      branch: ${{ steps.param.outputs.branch }}
      component-version: ${{ steps.param.outputs.component-version }}
      img-version: ${{ steps.param.outputs.img-version }}
      chart-version: ${{ steps.param.outputs.chart-version }}

    steps:
      - name: Generate a token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.GHAPP_ID_NUCLIABOT }}
          private-key: ${{ secrets.PK_GHAPP_NUCLIABOT }}
          owner: nuclia
          repositories: tooling
          permission-contents: read

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Checkout tooling repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: nuclia/tooling
          ref: main
          path: tooling
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Parameter generator
        uses: ./tooling/.github/actions/parameter-generator
        id: param
        with:
          component: forge
          folder: "forge"
          helm-separator: "-ref"

      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: "${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ env.GCP_SERVICE_ACCOUNT }}"
          token_format: access_token

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install package
        run: make install
        env:
          PYTHONUNBUFFERED: 1
          UV_INDEX_NUCLIA_USERNAME: oauth2accesstoken
          UV_INDEX_NUCLIA_PASSWORD: ${{ steps.gcp-auth.outputs.access_token }}
          UV_CACHE_DIR: /home/runner/_work/.uv-cache

      - name: Lint package
        run: |
          make lint

      - name: Test package
        run: |
          make test

      - name: Get Cover
        uses: orgoro/coverage@ca0c362dc1a4f100447309405e6dfea47e251495 # v3.3.1
        if: github.event_name == 'pull_request'
        with:
          coverageFile: forge_cov.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          thresholdAll: 0.45

      - name: Generate openapi docs
        if: github.event_name == 'push'
        env:
          API_VERSION: "1"
          DOCS_FILE: "${GITHUB_WORKSPACE}/openapi.forge.json"
          HASH: ${{ steps.param.outputs.hash }}
        run: |
          make extract-openai

      - name: Save openapi docs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push'
        with:
          name: openapi.forge.json
          path: openapi.forge.json

      - name: Git clean up before building
        run: |
          git clean -fdx

      - name: Authenticate to Google Cloud
        id: gcp-auth-registry
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: "${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ env.GCP_SERVICE_ACCOUNT }}"
          token_format: access_token

      - name: Login to Google Artifact Registry
        if: github.event_name == 'push'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: europe-west4-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth-registry.outputs.access_token }}

      - name: Push image to registries
        uses: ./tooling/.github/actions/build-img-regcache
        with:
          file: RAO.Dockerfile
          image-name: ${{ steps.param.outputs.component }}
          image-version: ${{ steps.param.outputs.img-version }}
          aws-ecr-role: ${{ secrets.AWS_ECR_ROLE }}
          push: true
          with-pypi-secret: true
          pypi-registry-key: https://oauth2accesstoken:${{ steps.gcp-auth-registry.outputs.access_token }}@${{ env.PYTHON_ARTIFACT_REGISTRY }}
          ghapp-nuclia-service-bot-id: ${{ vars.GHAPP_NUCLIA_SERVICE_BOT_ID }}
          ghapp-nuclia-service-bot-pk: ${{ secrets.GHAPP_NUCLIA_SERVICE_BOT_PK }}
          github-container-name: "rao"
        if: github.event_name == 'push'

      - name: Build and push helm chart
        uses: ./tooling/.github/actions/build-helm-chart
        with:
          component: ${{ steps.param.outputs.component }}
          chart-version: ${{ steps.param.outputs.chart-version }}
          image-name: ${{ steps.param.outputs.component }}
          image-version: ${{ steps.param.outputs.img-version }}
          hash: ${{ steps.param.outputs.hash }}
          helm-chart-url: ${{ secrets.HELM_CHART_URL }}
          chart-dir: "./charts/${{ steps.param.outputs.component }}"
          helm-version: v3.15.3
          push-to-artifact-registry: true
          set-only-tag: true # Skips the standard method of setting the image, and just set the tag value.
        if: github.event_name == 'push'

      - name: Push OpenApi docs
        uses: ./.github/actions/push-docs
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          component: ${{ steps.param.outputs.component }}
          docs-name: forge
          ghapp-nuclia-service-bot-id: ${{ vars.GHAPP_NUCLIA_SERVICE_BOT_ID }}
          ghapp-nuclia-service-bot-pk: ${{ secrets.GHAPP_NUCLIA_SERVICE_BOT_PK }}
          api-branch: nua

  send-notification-fail:
    needs: test
    if: (failure() || cancelled()) && github.event_name == 'push'
    runs-on: nuclia-base
    permissions: {} # slackapi/slack-github-action uses webhook secret, not GITHUB_TOKEN
    steps:
      - name: Build failed slack message
        id: build_message
        run: |
          SLACK_MESSAGE="Testing for component ${NEEDS_TEST_OUTPUTS_COMPONENT} in main/master has failed for SHA ${{ github.sha }}. Promotion can't be executed if a component is not passing tests."
          COLOR="danger"

          echo "color=$COLOR" >> $GITHUB_OUTPUT
          echo "message=$SLACK_MESSAGE" >> $GITHUB_OUTPUT

        shell: bash
        env:
          NEEDS_TEST_OUTPUTS_COMPONENT: ${{ needs.test.outputs.component }}

      - name: Slack notification
        id: slack
        uses: slackapi/slack-github-action@af78098f536edbc4de71162a307590698245be95 # v3.0.1
        env:
          SLACK_SUBTEAM: S06B50DM2FL
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_PROMOTIONS }}
          webhook-type: incoming-webhook
          payload: |
            {
              "channel": "C07NA5DH06M",
              "text": "Promotions notifications - Learning Team",
              "attachments": [
                {
                  "color": "${{ steps.build_message.outputs.color }}",
                  "text": "${{ steps.build_message.outputs.message }} \n \nRun #${{ github.run_number }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n<!subteam^${{ env.SLACK_SUBTEAM }}>"
                }
              ]
            }

  build_wheels:
    name: Build wheels
    runs-on: ubuntu-24.04
    if: github.event_name == 'push'
    needs:
      - test
    permissions:
      contents: read # actions/checkout
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: 3.14.2

      - name: Setup env
        run: |
          pip install wheel
          pip install -U twine

      - name: Set dependency versions in requirements
        run: |
          python bump.py --build=${{github.run_number}}

      # Install all packages we are going to release
      - name: Install all packages
        run: |
          pip install -e ./hyperforge

      - name: Build wheels
        run: pip wheel --no-deps -w dist ./hyperforge

      - name: Upload to pypi
        # zizmor: ignore[use-trusted-publishing] -- migrating to OIDC trusted publishing is tracked separately; PYPI_TOKEN is a scoped API token
        run: twine upload --verbose dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

  send-to-promotion-queue:
    runs-on: nuclia-base
    needs: [test]
    if: |
      !failure() && !cancelled() && github.event_name == 'push'
    permissions: {} # all API calls use GitHub App token, not GITHUB_TOKEN
    steps:
      - name: Generate a token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ vars.GHAPP_NUCLIA_SERVICE_BOT_ID }}
          private-key: ${{ secrets.GHAPP_NUCLIA_SERVICE_BOT_PK }}
          owner: nuclia
          repositories: core-apps
          permission-contents: write

      - name: Create components promotion summary. Trigger1
        env:
          SKIP_QUEUE: ${{ contains(github.event.pull_request.labels.*.name, 'skip-promo-queue') }}
          SKIP_ARGO_HEALTH: false
          ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'stage' || 'dev' }}
          PROMO_PRODUCTION: ${{ env.PROMO_PRODUCTION }}
          TEAM: "learning"
          SLACK_TEAM: "S06B50DM2FL"
          COMPONENT: ${{ needs.test.outputs.component }}
          CHART_VERSION: ${{ needs.test.outputs.chart-version }}
        run: |
          MERGED_JSON=$(jq -cs \
            --arg environment "$ENVIRONMENT" \
            --arg skip_queue "$SKIP_QUEUE" \
            --arg skip_argo_health "$SKIP_ARGO_HEALTH" \
            --arg team "$TEAM" \
            --arg slack_team "$SLACK_TEAM" \
            --arg promo_production "$PROMO_PRODUCTION" \
            --arg commit_sha "${{ github.sha }}" \
            --arg component "$COMPONENT" \
            --arg chart_version "$CHART_VERSION" \
            '{
              components: map(.components) | add
            } + {
              skip_promo_queue: ($skip_queue == "true")
            } + {
              skip_argo_health: ($skip_argo_health == "true")
            } + {
              environment: $environment
            } + {
              promo_production: ($promo_production == "true")
            } + {
              team: $team
            } + {
              slack_team: $slack_team
            } + {
              tests: {
                "run-e2e": true,
                "run-nuclia-e2e": true
              }
            } + {
              "commit-sha": $commit_sha
            } + {
              "components": [
                {
                  "component": $component,
                  "chart-version": $chart_version,
                  "component-type": "regional"
                }
              ]
            }'
          )

          echo "JSON_PROMO_SUMMARY=$MERGED_JSON" >> $GITHUB_ENV

      - name: Send to promotion queue
        id: send-to-promo
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: nuclia/core-apps
          event-type: promotions
          client-payload: "${{ env.JSON_PROMO_SUMMARY }}"
