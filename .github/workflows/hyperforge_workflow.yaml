name: Hyperforge Main Agents Tests

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "hyperforge/**"
      - "hyperforge.mk"
      - ".github/workflows/hyperforge_workflow.yaml"
      - ".github/workflows/hyperforge_agent_package_workflow.yaml"
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "hyperforge/**"
      - "hyperforge.mk"
      - ".github/workflows/hyperforge_workflow.yaml"
      - ".github/workflows/hyperforge_agent_package_workflow.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test hyperforge
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false
          python-version: "3.12"

      - name: Install package dependencies with uv
        run: uv sync --group dev

      - name: Run tests
        working-directory: hyperforge
        run: make test
        env: # Or as an environment variable
          NUA_KEY: ${{ secrets.NUA_KEY }}

  build_wheels:
    name: Build wheels
    runs-on: ubuntu-24.04
    if: github.event_name == 'push'
    needs:
      - test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false
          python-version: "3.12"

      - name: Setup env
        run: |
          uv tool install twine

      - name: Set dependency versions in requirements
        run: |
          python bump.py --package=${INPUTS_PACKAGE} --build=${{ github.run_number }}
        env:
          INPUTS_PACKAGE: hyperforge

      - name: Install package
        run: |
          uv sync

      - name: Build wheels
        run: uv build ./${INPUTS_PACKAGE}
        env:
          INPUTS_PACKAGE: hyperforge

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0

  build_and_push_docker_image:
    name: Build and push Docker image
    runs-on: ubuntu-24.04
    if: github.event_name == 'push'
    needs:
      - build_wheels
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build Docker image
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          IMAGE_SHA_TAG: ${{ github.sha }}
          IMAGE_REF_TAG: ${{ github.ref_name }}
        run: docker build -f HYPERFORGE.Dockerfile -t "ghcr.io/$REPOSITORY_OWNER/hyperforge:$IMAGE_SHA_TAG" -t "ghcr.io/$REPOSITORY_OWNER/hyperforge:$IMAGE_REF_TAG" .

      - name: Push Docker image
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          IMAGE_SHA_TAG: ${{ github.sha }}
          IMAGE_REF_TAG: ${{ github.ref_name }}
        run: |
          docker push "ghcr.io/$REPOSITORY_OWNER/hyperforge:$IMAGE_SHA_TAG"
          docker push "ghcr.io/$REPOSITORY_OWNER/hyperforge:$IMAGE_REF_TAG"
