name: Hyperforge Main Agents Tests

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "hyperforge/**"
      - "hyperforge.mk"
      - ".github/workflows/hyperforge_workflow.yaml"
      - ".github/workflows/hyperforge_agent_package_workflow.yaml"
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "hyperforge/**"
      - "hyperforge.mk"
      - ".github/workflows/hyperforge_workflow.yaml"
      - ".github/workflows/hyperforge_agent_package_workflow.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test hyperforge
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false
          python-version: "3.12"

      - name: Install package dependencies with uv
        run: uv sync --group dev

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: hyperforge/frontend/package-lock.json

      - name: Audit and build frontend
        working-directory: hyperforge/frontend
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm run build

      - name: Lint
        working-directory: hyperforge
        run: make lint

      - name: Run tests
        working-directory: hyperforge
        run: make test
        env: # Or as an environment variable
          NUA_KEY: ${{ secrets.NUA_KEY }}

  build_wheels:
    name: Build wheels
    runs-on: ubuntu-24.04
    if: github.event_name == 'push'
    needs:
      - test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false
          python-version: "3.12"

      - name: Setup env
        run: |
          uv tool install twine

      - name: Set dependency versions in requirements
        run: |
          python bump.py --package=${INPUTS_PACKAGE} --build=${{ github.run_number }}
        env:
          INPUTS_PACKAGE: hyperforge

      - name: Install package
        run: |
          uv sync

      - name: Build wheels
        run: uv build ./${INPUTS_PACKAGE}
        env:
          INPUTS_PACKAGE: hyperforge

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  build_and_push_docker_image:
    name: Build and push Docker image
    runs-on: ubuntu-24.04
    if: github.event_name == 'push'
    needs:
      - build_wheels
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build Docker image
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          IMAGE_SHA_TAG: ${{ github.sha }}
          IMAGE_REF_TAG: ${{ github.ref_name }}
        run: docker build -f HYPERFORGE.Dockerfile -t "ghcr.io/$REPOSITORY_OWNER/hyperforge:$IMAGE_SHA_TAG" -t "ghcr.io/$REPOSITORY_OWNER/hyperforge:$IMAGE_REF_TAG" .

      - name: Push Docker image
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          IMAGE_SHA_TAG: ${{ github.sha }}
          IMAGE_REF_TAG: ${{ github.ref_name }}
        run: |
          docker push "ghcr.io/$REPOSITORY_OWNER/hyperforge:$IMAGE_SHA_TAG"
          docker push "ghcr.io/$REPOSITORY_OWNER/hyperforge:$IMAGE_REF_TAG"

  notify-teams-fail:
    name: Notify Teams on failure
    needs:
      - test
      - build_wheels
      - build_and_push_docker_image
    if: (failure() || cancelled()) && github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      # nuclia/tooling is private, and a public repository can only use its actions
      # from a checkout.
      - name: Generate a token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.NUCLIA_EXTERNAL_GHAPP_ID }}
          private-key: ${{ secrets.NUCLIA_EXTERNAL_GHAPP_PK }}
          owner: nuclia
          repositories: tooling
          permission-contents: read

      - name: Checkout tooling repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nuclia/tooling
          ref: main
          path: tooling
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Send Teams notification
        uses: ./tooling/.github/actions/notify-microsoft-teams
        with:
          client-secret: ${{ secrets.PDPBOT_CLIENT_SECRET }}
          channel-id: ${{ vars.MS_TEAMS_CHANNEL_HYPERFORGE_CI }}
          title: "Hyperforge CI failed on ${{ github.ref_name }}"
          message: "Run #${{ github.run_number }} failed for commit ${{ github.sha }}."
