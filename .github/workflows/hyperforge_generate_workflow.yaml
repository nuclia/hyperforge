name: Generate Agents Tests

on:
    push:
        branches:
            - main
            - dev
        paths:
            - "agents/generate/**"
            - "hyperforge.mk"
            - ".github/workflows/hyperforge_generate_workflow.yaml"
            - ".github/workflows/hyperforge_agent_package_workflow.yaml"
    pull_request:
        branches:
            - main
            - dev
        paths:
            - "agents/generate/**"
            - "hyperforge.mk"
            - ".github/workflows/hyperforge_generate_workflow.yaml"
            - ".github/workflows/hyperforge_agent_package_workflow.yaml"

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
    cancel-in-progress: true

permissions:
    id-token: write

jobs:
    package:
        uses: ./.github/workflows/hyperforge_agent_package_workflow.yaml
        with:
            package: agents/generate
        secrets:
            PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
