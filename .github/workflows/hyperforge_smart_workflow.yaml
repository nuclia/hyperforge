name: Smart Agents Tests

on:
    push:
        branches:
            - main
            - dev
        paths:
            - "agents/smart/**"
            - "hyperforge.mk"
            - ".github/workflows/hyperforge_smart_workflow.yaml"
            - ".github/workflows/hyperforge_agent_package_workflow.yaml"
    pull_request:
        branches:
            - main
            - dev
        paths:
            - "agents/smart/**"
            - "hyperforge.mk"
            - ".github/workflows/hyperforge_smart_workflow.yaml"
            - ".github/workflows/hyperforge_agent_package_workflow.yaml"

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    test:
        name: Test agents/smart
        runs-on: ubuntu-24.04

        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
              with:
                  enable-cache: false
                  python-version: "3.12"

            - name: Install package dependencies with uv
              run: uv sync --group dev

            - name: Lint
              working-directory: agents/smart
              run: make lint

            - name: Run tests
              working-directory: agents/smart
              run: make test

    build_wheels:
        name: Build wheels
        runs-on: ubuntu-24.04
        if: github.event_name == 'push'
        needs:
            - test
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
              with:
                  enable-cache: false
                  python-version: "3.12"

            - name: Set dependency versions in requirements
              run: |
                  python bump.py --package=${INPUTS_PACKAGE} --build=${{ github.run_number }}
              env:
                  INPUTS_PACKAGE: agents/smart

            - name: Build wheels
              run: uv build ./${INPUTS_PACKAGE}
              env:
                  INPUTS_PACKAGE: agents/smart

            - name: Publish package to PyPI
              uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
