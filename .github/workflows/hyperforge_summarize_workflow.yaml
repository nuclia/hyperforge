name: Summarize Agents Tests

on:
    push:
        branches:
            - main
            - dev
        paths:
            - "agents/summarize/**"
            - "hyperforge.mk"
            - ".github/workflows/hyperforge_summarize_workflow.yaml"
            - ".github/workflows/hyperforge_agent_package_workflow.yaml"
    pull_request:
        branches:
            - main
            - dev
        paths:
            - "agents/summarize/**"
            - "hyperforge.mk"
            - ".github/workflows/hyperforge_summarize_workflow.yaml"
            - ".github/workflows/hyperforge_agent_package_workflow.yaml"

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    test:
        name: Test agents/summarize
        runs-on: ubuntu-24.04

        steps:
            - name: Checkout repository
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
              with:
                  enable-cache: false
                  python-version: "3.12"

            - name: Install package dependencies with uv
              run: uv sync --group dev

            - name: Lint
              working-directory: agents/summarize
              run: make lint

            - name: Run tests
              working-directory: agents/summarize
              run: make test

    build_wheels:
        name: Build wheels
        runs-on: ubuntu-24.04
        if: github.event_name == 'push'
        needs:
            - test
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
              with:
                  enable-cache: false
                  python-version: "3.12"

            - name: Set dependency versions in requirements
              run: |
                  python bump.py --package=${INPUTS_PACKAGE} --build=${{ github.run_number }}
              env:
                  INPUTS_PACKAGE: agents/summarize

            - name: Build wheels
              run: uv build ./${INPUTS_PACKAGE}
              env:
                  INPUTS_PACKAGE: agents/summarize

            - name: Publish package to PyPI
              uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
