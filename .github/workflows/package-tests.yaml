name: Package Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed packages
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}
          persist-credentials: false

      - id: changed-files
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47.0.0
        with:
          json: true

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false
          python-version: "3.12"

      - id: packages
        shell: bash
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          packages="$(uv run --with pyyaml python <<'PYTHON'
          import json
          import os

          import yaml

          with open(".github/packages.yaml") as manifest:
              config = yaml.safe_load(manifest)

          changed = json.loads(os.environ["CHANGED_FILES"])
          shared_changed = any(
              path.startswith(entry) if entry.endswith("/") else path == entry
              for path in changed
              for entry in config["shared"]
          )
          selected = config["packages"] if shared_changed else [
              package
              for package in config["packages"]
              if any(path.startswith(f"{package}/") for path in changed)
          ]
          print(json.dumps(selected, separators=(",", ":")))
          PYTHON
          )"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  test:
    name: Test ${{ matrix.package }}
    if: needs.changes.outputs.packages != '[]'
    needs: changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false
          python-version: "3.12"

      - name: Install package dependencies with uv
        run: uv sync --group dev

      - name: Lint
        working-directory: ${{ matrix.package }}
        run: make lint

      - name: Run tests
        working-directory: ${{ matrix.package }}
        run: make test
        env:
          NUA_KEY: ${{ secrets.NUA_KEY }}
          KB_DF8B4C24_2807_4888_AD6C_AE97357A638B: ${{ secrets.KB_DF8B4C24_2807_4888_AD6C_AE97357A638B }}
          KB_DE48CFAA_3209_4041_BB64_8604AFF061FB: ${{ secrets.KB_DE48CFAA_3209_4041_BB64_8604AFF061FB }}

      - name: Set dependency versions in requirements
        if: github.event_name == 'push'
        env:
          PACKAGE: ${{ matrix.package }}
        run: python bump.py --package="$PACKAGE" --build="${{ github.run_number }}"

      - name: Build wheels
        if: github.event_name == 'push'
        env:
          PACKAGE: ${{ matrix.package }}
        run: uv build "$PACKAGE"

      - name: Publish package to PyPI
        if: github.event_name == 'push'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0

  docker:
    name: Build and push Docker image
    if: always() && github.event_name == 'push' && contains(fromJSON(needs.changes.outputs.packages), 'hyperforge') && needs.test.result == 'success'
    needs: [changes, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build Docker image
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          IMAGE_SHA_TAG: ${{ github.sha }}
          IMAGE_REF_TAG: ${{ github.ref_name }}
        run: docker build -f HYPERFORGE.Dockerfile -t "ghcr.io/$REPOSITORY_OWNER/hyperforge:$IMAGE_SHA_TAG" -t "ghcr.io/$REPOSITORY_OWNER/hyperforge:$IMAGE_REF_TAG" .

      - name: Push Docker image
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          IMAGE_SHA_TAG: ${{ github.sha }}
          IMAGE_REF_TAG: ${{ github.ref_name }}
        run: |
          docker push "ghcr.io/$REPOSITORY_OWNER/hyperforge:$IMAGE_SHA_TAG"
          docker push "ghcr.io/$REPOSITORY_OWNER/hyperforge:$IMAGE_REF_TAG"

  package-tests:
    name: Package tests
    if: always()
    needs: [changes, test]
    runs-on: ubuntu-24.04
    steps:
      - name: Verify package tests
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [[ "$TEST_RESULT" != success && "$TEST_RESULT" != skipped ]]; then
            exit 1
          fi
          echo "All selected package tests completed successfully."

  notify-teams-fail:
    name: Notify Teams on failure
    needs: [test, docker, package-tests]
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Send Teams notification
        env:
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d "{
              \"@type\": \"MessageCard\",
              \"@context\": \"http://schema.org/extensions\",
              \"themeColor\": \"FF0000\",
              \"summary\": \"Package CI failed\",
              \"sections\": [{
                \"activityTitle\": \"**Package CI failed on \`${REF_NAME}\`**\",
                \"activityText\": \"Run [#${RUN_NUMBER}](${RUN_URL}) failed for commit \`${COMMIT_SHA}\`.\"
              }]
            }" \
            "$TEAMS_WEBHOOK_URL"
