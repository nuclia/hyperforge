name: Restricted Agents Tests

on:
    push:
        branches:
            - main
            - dev
        paths:
            - "agents/restricted/**"
            - "hyperforge.mk"
            - ".github/workflows/hyperforge_restricted_workflow.yaml"
            - ".github/workflows/hyperforge_agent_package_workflow.yaml"
    pull_request:
        branches:
            - main
            - dev
        paths:
            - "agents/restricted/**"
            - "hyperforge.mk"
            - ".github/workflows/hyperforge_restricted_workflow.yaml"
            - ".github/workflows/hyperforge_agent_package_workflow.yaml"

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    package:
        uses: ./.github/workflows/hyperforge_agent_package_workflow.yaml
        with:
            package: agents/restricted
        secrets:
            PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
