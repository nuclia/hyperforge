        Agentic RAG is an API able to index and process any kind of data, including
        audio and video files, to boost applications with powerful search & RAG capability.
        \\n Indexing page contents automatically \\n The Agentic RAG Dashboard is
        an easy way to index files or web pages by yourself. That's nice for testing
        purpose, but it is definitely better to index your Next.js pages automatically.
        \\n\",\"id\":\"c1d73c95e26d44eea84e63919a836289/t/page/837-1226\",\"labels\":[\"/k/text\"],\"position\":{\"page_number\":0,\"index\":0,\"start\":837,\"end\":1226,\"start_seconds\":[],\"end_seconds\":[]},\"fuzzy_result\":false,\"page_with_visual\":false,\"is_a_table\":false},\"c1d73c95e26d44eea84e63919a836289/t/page/1666-2203\":{\"score\":0.5552845597267151,\"score_type\":\"RERANKER\",\"order\":10,\"text\":\"
