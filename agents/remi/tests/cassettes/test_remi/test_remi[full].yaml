    body: '{"user_id": "arag_evaluate", "question": null, "answer": "Progress Agentic
      RAG is an API designed to enhance applications with advanced search capabilities
      by indexing and processing various types of data, including audio and video
      files. It employs natural language processing and machine learning to comprehend
      the searcher''s intent and deliver relevant results. Key features include automatic
      indexing of page contents and integration with various AI models to generate
      answers and insights from unstructured data.", "contexts": ["## docs > ingestion
      > how to > integrate strapi\n\n Agentic RAG is the best search API to do it!
      \n Agentic RAG is an API able to index and process any kind of data, including
      audio and video files, to boost applications with powerful search capability,
      using natural language processing and machine learning to understand the searcher''s
      intent and return results that are more relevant to the searcher''s needs. \n\n\n",
      "## docs > ingestion > how to > integrate nextjs\n\n Agentic RAG is an API able
      to index and process any kind of data, including audio and video files, to boost
      applications with powerful search & RAG capability. \n Indexing page contents
      automatically \n The Agentic RAG Dashboard is an easy way to index files or
      web pages by yourself. That''s nice for testing purpose, but it is definitely
      better to index your Next.js pages automatically. \n\n\n", "## docs > develop
      > dotnet sdk > index\n\nProgress.Nuclia .NET SDK \n A comprehensive .NET SDK
      for Progress Agentic RAG''s NucliaDb, providing RAG (Retrieval-Augmented Generation)
      capabilities with knowledge base management, AI-powered search, and resource
      operations. \n\n\n", "## docs > rag > advanced > connect gemini keys\n\n Prerequisites
      \n \n You have an active Google account with access to Google AI Studio (https://aistudio.google.com/)
      \n You have access to Progress Agentic RAG. \n \n Generate & Locate Your API
      Key \n \n Navigate to Google AI Studio (https://aistudio.google.com/) \n Click
      on Get API key in the left sidebar at the bottom. \n\n\n", "## docs > ingestion
      > how to > extract strategies\n\n Apart from cutting-edge table and text extraction
      capabilities, \ud83d\udc15 pagehound-v1 is capable of extracting embedded images
      from full page scans, making it possible to apply Progress'' Agentic RAG image
      processing pipeline to them, enabling search capabilities. \n\n\n", "## docs
      > rag > advanced > bring your own anthropic acct\n\n Prerequisites \n \n You
      have an active Anthropic account (https://console.anthropic.com/) \n Billing
      is enabled in your Anthropic console. \n You have access to Progress Agentic
      RAG. \n \n Generate & Locate Your API Key \n \n Expand the sidebar on the top
      left hand corner. \n\n\n", "## docs > ingestion > how to > integrate nextjs\n\n
      ```js \n const { Nuclia } = require( @nuclia/core ); \n require( localstorage-polyfill
      ); \n require( isomorphic-unfetch ); \n const nuclia = new Nuclia({ \n backend:
      https://accounts.progress.cloud/api , \n zone: europe-1 , \n knowledgeBox: ,
      \n apiKey: , \n }); \n // code to push data to Agentic RAG (detailed later)
      \n ``` \n As you can see, you need to provide a Agentic RAG API key. An API
      key is necessary when adding or modifying contents in a knowledge box. You can
      get your API key in the Agentic RAG Dashboard, in the API keys section: \n\n\n",
      "## docs > develop > nua\n\n \n id: nua \n title: Nuclia Understanding API \n
      \n Using the Nuclia Understanding API \n The Nuclia Understanding API (NUA)
      allows you to process data outside of a Knowledge Box. It is a set of endpoints
      that allow you to send data to the Progress Agentic RAG platform for processing,
      or to make calls to models to generate text, summaries, or other outputs. The
      information is stored temporarily for the duration of the processing, nothing
      remains in the ProgressAgentic RAG cloud infrastructure. \n\n\n", "## docs >
      rag > advanced > connect your own azure openai acct\n\n 6. Configure Azure OpenAI
      in Progress Agentic RAG \n This step connects your deployed model to Progress
      Agentic RAG. \n Required Configuration Values \n | Field | Source | \n | ---------------
      | ------- | \n | API Key | Foundry | \n | Endpoint URL | Foundry | \n | Deployment
      Name | Foundry | \n | Model Name | Foundry | \n Steps \n \n\n\n", "## docs >
      rag > advanced > connect gemini keys\n\n \n Finalize Connection \n \n Navigate
      to the Progress Agentic RAG dashboard. \n When selecting an LLM in AI models
      or Agent , toggle on Use your Google Gemini Key . \n Enter your API key. \n
      Save configuration. \n\n\n", "## docs > develop > nua\n\n Click on NUA keys
      . \n Click on the Create new Progress Agentic RAG Understanding API key button.
      \n \n Fill out the form and submit it. \n \n \n Using the Nuclia API /api/v1/account/{your_account}/nua_client
      endpoint (see Reference). \n\n\n"]}'
