        \\n id: agentic-retrieval \\n title: Agentic retrieval with the Smart agent
        \\n \\n Agentic retrieval with the Smart agent \\n The Smart agent is a powerful
        tool that enhances the capabilities of traditional retrieval-augmented generation
        (RAG) systems. Regular RAG's fixed search-then-generate process is limiting
        for complex questions that need intermediary steps and reasoning. \\n\",\"labels\":[],\"start_seconds\":null,\"end_seconds\":null,\"position\":{\"page_number\":0,\"index\":0,\"start\":0,\"end\":373},\"fuzzy_result\":false},{\"score\":0.0,\"rid\":\"b28e388104644fc5bba68c0cd44e01d4\",\"field_type\":\"t\",\"field\":\"page\",\"text\":\"
        \\n Different models can be chosen for different tasks: \\n \\n Context validation
        happens when the Prune context option is enabled (recommended), we recommend
        using a fast model - planning or the execution model (depending on the planning
        mode you have selected): we recommend using a more powerful model. \\n\",\"labels\":[],\"start_seconds\":null,\"end_seconds\":null,\"position\":{\"page_number\":0,\"index\":5,\"start\":1640,\"end\":1943},\"fuzzy_result\":false},{\"score\":0.0,\"rid\":\"b28e388104644fc5bba68c0cd44e01d4\",\"field_type\":\"t\",\"field\":\"page\",\"text\":\"
        \\n Note: the rephrasing model is only used in more complex workflow, it can
        be ignored in the present case. \\n Finally, add a Summarize agent in the
        Generation step to generate a final answer from the retrieved information.
        \\n\",\"labels\":[],\"start_seconds\":null,\"end_seconds\":null,\"position\":{\"page_number\":0,\"index\":6,\"start\":1943,\"end\":2167},\"fuzzy_result\":false},{\"score\":0.0,\"rid\":\"b28e388104644fc5bba68c0cd44e01d4\",\"field_type\":\"t\",\"field\":\"page\",\"text\":\"
        The Smart Agent plans the answer: picks the most appropriate sources, splits
        the question into sub-questions, evaluates relevancy, and iterates autonomously
        until the information is sufficient. \\n Basic usage \\n To set up a Smart
        Agent, declare all the sources you want to use (Knowledge Boxes, Perplexity,
        etc.) in the Sources section of the left menu. Then, create a new workflow
        in the Workflows section and add a Smart Agent in the Retrieval step. \\n\",\"labels\":[],\"start_seconds\":null,\"end_seconds\":null,\"position\":{\"page_number\":0,\"index\":1,\"start\":373,\"end\":825},\"fuzzy_result\":false},{\"score\":0.0,\"rid\":\"b28e388104644fc5bba68c0cd44e01d4\",\"field_type\":\"t\",\"field\":\"page\",\"text\":\"
        Chat mode \\n If you want to use the Smart Agent in a chat interface, you
        need the following: \\n \\n Enable the Session history option in the Smart
        Agent configuration. This will allow the Smart Agent to take into account
        the previous conversation when planning its next steps. \\n\",\"labels\":[],\"start_seconds\":null,\"end_seconds\":null,\"position\":{\"page_number\":0,\"index\":7,\"start\":2167,\"end\":2442},\"fuzzy_result\":false},{\"score\":0.0,\"rid\":\"b28e388104644fc5bba68c0cd44e01d4\",\"field_type\":\"t\",\"field\":\"page\",\"text\":\"
        Then connect your sources as Registered Agents to the Smart Agent. It is very
        important that you provide an extensive description of each registered agent,
        so that the Smart Agent can understand what each source is about and when
        to use it. \\n\",\"labels\":[],\"start_seconds\":null,\"end_seconds\":null,\"position\":{\"page_number\":0,\"index\":2,\"start\":825,\"end\":1068},\"fuzzy_result\":false},{\"score\":0.0,\"rid\":\"b28e388104644fc5bba68c0cd44e01d4\",\"field_type\":\"t\",\"field\":\"page\",\"text\":\"
        \\n reactive: The Smart Agent will decide what to do first, and will plan
        the next steps based on the information it retrieves. It is expected to be
        faster. \\n plan_execute: The Smart Agent will plan all the steps in advance,
        and will execute them. It will be slower but more accurate when processing
        complex questions. \\n\",\"labels\":[],\"start_seconds\":null,\"end_seconds\":null,\"position\":{\"page_number\":0,\"index\":4,\"start\":1321,\"end\":1640},\"fuzzy_result\":false},{\"score\":0.0,\"rid\":\"b28e388104644fc5bba68c0cd44e01d4\",\"field_type\":\"t\",\"field\":\"page\",\"text\":\"
        Also select the proper function for each registered agent, depending on the
        type of source (MCP agents will not need one, the functions are provided dynamically
        by the MCP server). \\n In the Smart Agent configuration, you can select the
        planning mode: \\n\",\"labels\":[],\"start_seconds\":null,\"end_seconds\":null,\"position\":{\"page_number\":0,\"index\":3,\"start\":1068,\"end\":1321},\"fuzzy_result\":false},{\"score\":0.0,\"rid\":\"b28e388104644fc5bba68c0cd44e01d4\",\"field_type\":\"t\",\"field\":\"page\",\"text\":\"
        In the Summarize Agent, enable the Conversational mode. This will allow the
        Summarize Agent to generate a final answer that will not repeat the information
        already provided in the previous conversation, and will be more natural for
        a chat interface. \\n\",\"labels\":[],\"start_seconds\":null,\"end_seconds\":null,\"position\":{\"page_number\":0,\"index\":8,\"start\":2442,\"end\":2694},\"fuzzy_result\":false},{\"score\":0.0,\"rid\":\"2a0d73029ad24c599d6dc1e117a41897\",\"field_type\":\"t\",\"field\":\"page\",\"text\":\"
        Custom frontend \\n You can also create a custom frontend for your Retrieval
        Agent. This allows you to have full control over the user interface and user
        experience. \\n You can directly implement the API calls to your Retrieval
