      Connect your own Azure OpenAI Model \n \n Deploying an Azure OpenAI Model and
      Connecting It to Progress Agentic RAG \n Summary Flow \n \n Create Azure account
      and subscription \n Create Azure OpenAI resource \n Open Microsoft Foundry from
      the resource overview \n Deploy a model via the Model Catalog \n Retrieve API
      key and endpoint from Foundry UI \n Configure Azure OpenAI in Progress Agentic
      RAG \n \n \n\n\n", "## docs > rag > advanced > connect vertex ai acct\n\n Troubleshooting
      \n If you encounter issues during the integration process: \n \n Authentication
      errors: Verify that the JSON credentials file is correctly formatted and contains
      valid credentials \n Permission errors: Ensure the service account has the necessary
      Vertex AI permissions \n Region errors: Confirm that the region specified in
      Progress Agentic RAG matches your Vertex AI configuration \n No response: Check
      your Google Cloud billing account status and API quota limits \n \n \n\n\n",
      "## docs > develop > dotnet sdk > index\n\nProgress.Nuclia .NET SDK \n A comprehensive
      .NET SDK for Progress Agentic RAG''s NucliaDb, providing RAG (Retrieval-Augmented
      Generation) capabilities with knowledge base management, AI-powered search,
      and resource operations. \n\n\n", "## docs > rag > advanced > connect gemini
      keys\n\n Prerequisites \n \n You have an active Google account with access to
      Google AI Studio (https://aistudio.google.com/) \n You have access to Progress
      Agentic RAG. \n \n Generate & Locate Your API Key \n \n Navigate to Google AI
      Studio (https://aistudio.google.com/) \n Click on Get API key in the left sidebar
      at the bottom. \n\n\n", "## docs > rag > advanced > bring your own anthropic
      acct\n\n Prerequisites \n \n You have an active Anthropic account (https://console.anthropic.com/)
      \n Billing is enabled in your Anthropic console. \n You have access to Progress
      Agentic RAG. \n \n Generate & Locate Your API Key \n \n Expand the sidebar on
      the top left hand corner. \n\n\n", "## docs > rag > advanced > connect your
      own azure openai acct\n\n 6. Configure Azure OpenAI in Progress Agentic RAG
      \n This step connects your deployed model to Progress Agentic RAG. \n Required
      Configuration Values \n | Field | Source | \n | --------------- | ------- |
      \n | API Key | Foundry | \n | Endpoint URL | Foundry | \n | Deployment Name
      | Foundry | \n | Model Name | Foundry | \n Steps \n \n\n\n", "## docs > ingestion
      > how to > extract strategies\n\n Apart from cutting-edge table and text extraction
      capabilities, \ud83d\udc15 pagehound-v1 is capable of extracting embedded images
      from full page scans, making it possible to apply Progress'' Agentic RAG image
      processing pipeline to them, enabling search capabilities. \n\n\n", "## docs
      > ingestion > how to > integrate nextjs\n\n ```js \n const { Nuclia } = require(
      @nuclia/core ); \n require( localstorage-polyfill ); \n require( isomorphic-unfetch
      ); \n const nuclia = new Nuclia({ \n backend: https://accounts.progress.cloud/api
      , \n zone: europe-1 , \n knowledgeBox: , \n apiKey: , \n }); \n // code to push
      data to Agentic RAG (detailed later) \n ``` \n As you can see, you need to provide
      a Agentic RAG API key. An API key is necessary when adding or modifying contents
      in a knowledge box. You can get your API key in the Agentic RAG Dashboard, in
      the API keys section: \n\n\n", "## docs > rag > advanced > connect gemini keys\n\n
      \n Finalize Connection \n \n Navigate to the Progress Agentic RAG dashboard.
      \n When selecting an LLM in AI models or Agent , toggle on Use your Google Gemini
      Key . \n Enter your API key. \n Save configuration. \n\n\n"]}'
