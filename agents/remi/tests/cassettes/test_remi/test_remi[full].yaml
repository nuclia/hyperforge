        Custom frontend \\n You can also create a custom frontend for your Retrieval
        Agent. This allows you to have full control over the user interface and user
        experience. \\n You can directly implement the API calls to your Retrieval
        Agent in your frontend code (see the Websocket API section for more details),
        or you can use the JavaScript SDK provided by Agentic to simplify the integration.
        \\n\",\"labels\":[],\"start_seconds\":null,\"end_seconds\":null,\"position\":{\"page_number\":0,\"index\":2,\"start\":617,\"end\":1005},\"fuzzy_result\":false},{\"score\":0.0,\"rid\":\"2a0d73029ad24c599d6dc1e117a41897\",\"field_type\":\"t\",\"field\":\"page\",\"text\":\"
