        \\n id: nua \\n title: Nuclia Understanding API \\n \\n Using the Nuclia Understanding
        API \\n The Nuclia Understanding API (NUA) allows you to process data outside
        of a Knowledge Box. It is a set of endpoints that allow you to send data to
        the Progress Agentic RAG platform for processing, or to make calls to models
        to generate text, summaries, or other outputs. The information is stored temporarily
        for the duration of the processing, nothing remains in the ProgressAgentic
        RAG cloud infrastructure. \\n\",\"id\":\"7c9e318a8fcc4c9485b8639fdbe93b38/t/page/0-496\",\"labels\":[],\"position\":{\"page_number\":0,\"index\":0,\"start\":0,\"end\":496,\"start_seconds\":[],\"end_seconds\":[]},\"fuzzy_result\":false,\"page_with_visual\":false,\"is_a_table\":false},\"7c9e318a8fcc4c9485b8639fdbe93b38/t/page/934-1170\":{\"score\":0.5865820646286011,\"score_type\":\"RERANKER\",\"order\":9,\"text\":\"
        \\n \\n Once you have the API key, you can use it in the NUA endpoints by
        setting the header X-NUCLIA-NUAKEY in each request. \\n The primary usage
        of a NUA key is to allow running data processing jobs on the Progress Agentic
        RAG platform. \\n\",\"id\":\"7c9e318a8fcc4c9485b8639fdbe93b38/t/page/934-1170\",\"labels\":[],\"position\":{\"page_number\":0,\"index\":0,\"start\":934,\"end\":1170,\"start_seconds\":[],\"end_seconds\":[]},\"fuzzy_result\":false,\"page_with_visual\":false,\"is_a_table\":false},\"7c9e318a8fcc4c9485b8639fdbe93b38/t/page/703-934\":{\"score\":0.31205546855926514,\"score_type\":\"RERANKER\",\"order\":19,\"text\":\"
        Click on NUA keys . \\n Click on the Create new Progress Agentic RAG Understanding
        API key button. \\n \\n Fill out the form and submit it. \\n \\n \\n Using
        the Nuclia API /api/v1/account/{your_account}/nua_client endpoint (see Reference).
        \\n\",\"id\":\"7c9e318a8fcc4c9485b8639fdbe93b38/t/page/703-934\",\"labels\":[],\"position\":{\"page_number\":0,\"index\":0,\"start\":703,\"end\":934,\"start_seconds\":[],\"end_seconds\":[]},\"fuzzy_result\":false,\"page_with_visual\":false,\"is_a_table\":false}}}}},\"252561e259d84800889a576b1e8a35c9\":{\"id\":\"252561e259d84800889a576b1e8a35c9\",\"slug\":\"docs-rag-advanced-connect-vertex-ai-acct-md\",\"title\":\"docs
