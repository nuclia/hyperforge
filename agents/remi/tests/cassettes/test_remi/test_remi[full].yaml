      and generative answers on unstructured data, supporting multiple languages and
      data sources.", "contexts": ["## docs > ingestion > how to > integrate nextjs\n\n
      Agentic RAG is an API able to index and process any kind of data, including
      audio and video files, to boost applications with powerful search & RAG capability.
      \n Indexing page contents automatically \n The Agentic RAG Dashboard is an easy
      way to index files or web pages by yourself. That''s nice for testing purpose,
      but it is definitely better to index your Next.js pages automatically. \n\n\n",
      "## docs > ingestion > how to > integrate strapi\n\n Agentic RAG is the best
      search API to do it! \n Agentic RAG is an API able to index and process any
      kind of data, including audio and video files, to boost applications with powerful
      search capability, using natural language processing and machine learning to
      understand the searcher''s intent and return results that are more relevant
      to the searcher''s needs. \n\n\n", "## docs > rag > advanced > connect your
