        ::: \\n Processing \\n Push a file \\n Processing data works in 2 steps: \\n
        \\n First you will upload the file with /processing/upload, which returns
        an upload token. \\n Then you will put this token in the processing queue
        with /processing/push so the file is processed. \\n\",\"labels\":[],\"start_seconds\":null,\"end_seconds\":null,\"position\":{\"page_number\":0,\"index\":6,\"start\":1627,\"end\":1890},\"fuzzy_result\":false},{\"score\":0.0,\"rid\":\"7c9e318a8fcc4c9485b8639fdbe93b38\",\"field_type\":\"t\",\"field\":\"page\",\"text\":\"
        json \\n { \\n webhook_config : { \\n uri : http://some.where/my-custom-webhook
        , \\n headers : { \\n api-key : xxxxxxxxxx \\n } \\n } \\n } \\n Also, you
        can choose to use a fixed uri on your token, and provide the headers in the
        /push calls. In this case you don't need to provide the uri parameter. \\n\",\"labels\":[],\"start_seconds\":null,\"end_seconds\":null,\"position\":{\"page_number\":0,\"index\":23,\"start\":9053,\"end\":9339},\"fuzzy_result\":false},{\"score\":0.0,\"rid\":\"7c9e318a8fcc4c9485b8639fdbe93b38\",\"field_type\":\"t\",\"field\":\"page\",\"text\":\"
        Get a NUA key \\n In order to use the Nuclia Understanding API (NUA), you
        first need to generate an API key. \\n There are two options to create an
        API key: \\n \\n Using the Agentic RAG dashboard top-right menu: \\n\",\"labels\":[],\"start_seconds\":null,\"end_seconds\":null,\"position\":{\"page_number\":0,\"index\":1,\"start\":496,\"end\":703},\"fuzzy_result\":false},{\"score\":0.0,\"rid\":\"7c9e318a8fcc4c9485b8639fdbe93b38\",\"field_type\":\"t\",\"field\":\"page\",\"text\":\"
        Note: If you have a Knowledge Box and want to use the predict endpoints, they
        are proxied through the /api/v1/kb//predict endpoint. You will need to provide
        a KB's regular authentication, a NUA API key will not be necessary.\",\"labels\":[],\"start_seconds\":null,\"end_seconds\":null,\"position\":{\"page_number\":0,\"index\":28,\"start\":10377,\"end\":10603},\"fuzzy_result\":false},{\"score\":0.0,\"rid\":\"7c9e318a8fcc4c9485b8639fdbe93b38\",\"field_type\":\"t\",\"field\":\"page\",\"text\":\"
        The payload received from /requests is based on the fdbwriter.BrokerMessage
        provided by writer.proto. \\n Streamed results \\n The /processing/requests//results
        endpoint is similar but it returns directly the decoded results as a stream.
        You can call it like this: \\n\",\"labels\":[],\"start_seconds\":null,\"end_seconds\":null,\"position\":{\"page_number\":0,\"index\":18,\"start\":7453,\"end\":7716},\"fuzzy_result\":false},{\"score\":0.0,\"rid\":\"7c9e318a8fcc4c9485b8639fdbe93b38\",\"field_type\":\"t\",\"field\":\"page\",\"text\":\"
        Processing happens asynchronously, so you will need to regularly check the
        queue output using one of the two endpoints available to retrieve the results.
        \\n Protobuffer results \\n The /processing/requests/ endpoint returns a protobuffer
        payload with the processing results. You can call it like this: \\n\",\"labels\":[],\"start_seconds\":null,\"end_seconds\":null,\"position\":{\"page_number\":0,\"index\":12,\"start\":5098,\"end\":5399},\"fuzzy_result\":false},{\"score\":0.0,\"rid\":\"7c9e318a8fcc4c9485b8639fdbe93b38\",\"field_type\":\"t\",\"field\":\"page\",\"text\":\"
        \\n id: nua \\n title: Nuclia Understanding API \\n \\n Using the Nuclia Understanding
        API \\n The Nuclia Understanding API (NUA) allows you to process data outside
        of a Knowledge Box. It is a set of endpoints that allow you to send data to
        the Progress Agentic RAG platform for processing, or to make calls to models
        to generate text, summaries, or other outputs. The information is stored temporarily
        for the duration of the processing, nothing remains in the ProgressAgentic
        RAG cloud infrastructure. \\n\",\"labels\":[],\"start_seconds\":null,\"end_seconds\":null,\"position\":{\"page_number\":0,\"index\":0,\"start\":0,\"end\":496},\"fuzzy_result\":false},{\"score\":0.0,\"rid\":\"7c9e318a8fcc4c9485b8639fdbe93b38\",\"field_type\":\"t\",\"field\":\"page\",\"text\":\"
        shell \\n curl 'https://.dp.progress.cloud/api/v1/processing/requests/' \\\\
        \\n -H 'X-NUCLIA-NUAKEY: Bearer ' \\n The response is a JSON object containing
        completed indicating if the processing is complete or not, and in case it
        is,a response string. \\n\",\"labels\":[],\"start_seconds\":null,\"end_seconds\":null,\"position\":{\"page_number\":0,\"index\":13,\"start\":5399,\"end\":5644},\"fuzzy_result\":false},{\"score\":0.0,\"rid\":\"7c9e318a8fcc4c9485b8639fdbe93b38\",\"field_type\":\"t\",\"field\":\"page\",\"text\":\"
        ::: \\n In Python, you can use nucliadb_protos to decode the results: \\n
        ```python \\n import base64 \\n import requests \\n from nucliadb_protos.writer_pb2
        import BrokerMessage \\n processing_id = THE_PROCESSING_ID_YOU_RECEIVED_FROM_PUSH
        \\n res = requests.get(f'https://europe-1.nuclia.cloud/api/v1/processing/requests/{processing_id}',headers={
        \\n X-NUCLIA-NUAKEY : Bearer YOUR_NUA_KEY , \\n }).json() \\n if payload in
        res: \\n\",\"labels\":[],\"start_seconds\":null,\"end_seconds\":null,\"position\":{\"page_number\":0,\"index\":16,\"start\":6812,\"end\":7224},\"fuzzy_result\":false},{\"score\":0.0,\"rid\":\"7c9e318a8fcc4c9485b8639fdbe93b38\",\"field_type\":\"t\",\"field\":\"page\",\"text\":\"
        shell \\n curl 'https://.dp.progress.cloud/api/v1/processing/push' \\\\ \\n
        -X POST \\\\ \\n -H 'X-NUCLIA-NUAKEY: Bearer ' \\\\ \\n -H 'Content-Type:
        application/json' \\\\ \\n --data-raw '{ filefield :{ my_file_1 : eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9..W8wfVj04aYicREYXRatCTb8F8-PD4Ph7MmiTliHi6DI
        }}' \\n Push text \\n Instead of uploading a file and then pushing it to the
        queue, you can also push some text directly to the queue. \\n\",\"labels\":[],\"start_seconds\":null,\"end_seconds\":null,\"position\":{\"page_number\":0,\"index\":9,\"start\":2730,\"end\":3646},\"fuzzy_result\":false},{\"score\":0.0,\"rid\":\"7c9e318a8fcc4c9485b8639fdbe93b38\",\"field_type\":\"t\",\"field\":\"page\",\"text\":\"
        It may also be used to create (or delete) Knowledge Boxes via the API \u2013
        for example, if you need to automate Knowledge Box creation. In that case
        you will need to select the Allow management of Knowledge Boxes checkbox during
        the NUA key creation. \\n\",\"labels\":[],\"start_seconds\":null,\"end_seconds\":null,\"position\":{\"page_number\":0,\"index\":4,\"start\":1170,\"end\":1420},\"fuzzy_result\":false},{\"score\":0.0,\"rid\":\"7c9e318a8fcc4c9485b8639fdbe93b38\",\"field_type\":\"t\",\"field\":\"page\",\"text\":\"
        /predict/rerank reranks a list of results to improve the relevance of the
        top results. \\n /predict/sentence computes the embedding of a sentence. \\n
        /predict/summarize summarizes a text. \\n \\n The calls must provides the
        X-NUCLIA-NUAKEY header with your NUA key: \\n\",\"labels\":[],\"start_seconds\":null,\"end_seconds\":null,\"position\":{\"page_number\":0,\"index\":26,\"start\":9847,\"end\":10108},\"fuzzy_result\":false},{\"score\":0.0,\"rid\":\"7c9e318a8fcc4c9485b8639fdbe93b38\",\"field_type\":\"t\",\"field\":\"page\",\"text\":\"
        shell \\n curl 'https://.dp.progress.cloud/api/v1/processing/requests//results'
        \\\\ \\n -H 'X-NUCLIA-NUAKEY: Bearer ' \\n Moreover the data_types parameter
        allows you to filter the results by data type. For example: \\n\",\"labels\":[],\"start_seconds\":null,\"end_seconds\":null,\"position\":{\"page_number\":0,\"index\":19,\"start\":7716,\"end\":7926},\"fuzzy_result\":false},{\"score\":0.0,\"rid\":\"7c9e318a8fcc4c9485b8639fdbe93b38\",\"field_type\":\"t\",\"field\":\"page\",\"text\":\"
        \\n Here is a typical example: \\n shell \\n curl 'https://.dp.progress.cloud/api/v1/processing/upload'
        \\\\ \\n -X POST \\\\ \\n -H X-NUCLIA-NUAKEY: Bearer  \\\\ \\n -H 'content-type:
        ' \\\\ \\n -T /path/to/file \\n Will return something like: \\n\",\"labels\":[],\"start_seconds\":null,\"end_seconds\":null,\"position\":{\"page_number\":0,\"index\":7,\"start\":1890,\"end\":2109},\"fuzzy_result\":false},{\"score\":0.0,\"rid\":\"7c9e318a8fcc4c9485b8639fdbe93b38\",\"field_type\":\"t\",\"field\":\"page\",\"text\":\"
        :::note \\n If an error occurs when posting the result to the webhook URL,
        the result is stored in the queue and can be retrieved by calling the /pull
        endpoint (see previous section). The error message is appended to the result.
        \\n\",\"labels\":[],\"start_seconds\":null,\"end_seconds\":null,\"position\":{\"page_number\":0,\"index\":24,\"start\":9339,\"end\":9568},\"fuzzy_result\":false},{\"score\":0.0,\"rid\":\"7c9e318a8fcc4c9485b8639fdbe93b38\",\"field_type\":\"t\",\"field\":\"page\",\"text\":\"
        pb = BrokerMessage() \\n pb.ParseFromString( \\n base64.b64decode(res[ payload
        ]) \\n ) \\n print(pb) \\n else: \\n print('No payload') \\n ``` \\n For other
        languages, Nuclia protobuffer models can be found on the NucliaDB GitHub repository.
        \\n\",\"labels\":[],\"start_seconds\":null,\"end_seconds\":null,\"position\":{\"page_number\":0,\"index\":17,\"start\":7224,\"end\":7453},\"fuzzy_result\":false},{\"score\":0.0,\"rid\":\"7c9e318a8fcc4c9485b8639fdbe93b38\",\"field_type\":\"t\",\"field\":\"page\",\"text\":\"
        ::: \\n Model calls \\n The predict endpoints offer various services: \\n
        \\n /predict/chat makes a direct call to an LLM. \\n /predict/remi calls the
        REMi model to measure the quality of a RAG response. \\n /predict/rephrase
        rephrases a question to make it more suitable for a RAG query. \\n\",\"labels\":[],\"start_seconds\":null,\"end_seconds\":null,\"position\":{\"page_number\":0,\"index\":25,\"start\":9568,\"end\":9847},\"fuzzy_result\":false},{\"score\":0.0,\"rid\":\"7c9e318a8fcc4c9485b8639fdbe93b38\",\"field_type\":\"t\",\"field\":\"page\",\"text\":\"
        eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9..VItLa_fUen2Pt5W2440Bjwc7Zx64rv6mJnRMFIdao5o
        \\n That is your upload token. Now you can push this token to the processing
        queue with: \\n\",\"labels\":[],\"start_seconds\":null,\"end_seconds\":null,\"position\":{\"page_number\":0,\"index\":8,\"start\":2109,\"end\":2730},\"fuzzy_result\":false},{\"score\":0.0,\"rid\":\"7c9e318a8fcc4c9485b8639fdbe93b38\",\"field_type\":\"t\",\"field\":\"page\",\"text\":\"
        Also at any level, if an attribute exceeds a certain size, it will be put
        in a downloadable file and will be replaced in the document by a file pointer.
        This will consist of { file : { uri : JWT_TOKEN }}. The rule is that if the
        size of the message is greater than 1000000 characters, the biggest parts
        will be moved to downloadable files. First, the compression process will target
        vectors. If that is not enough, it will target large field metadata, and finally
        it will target extracted text. \\n\",\"labels\":[],\"start_seconds\":null,\"end_seconds\":null,\"position\":{\"page_number\":0,\"index\":15,\"start\":6315,\"end\":6812},\"fuzzy_result\":false},{\"score\":0.0,\"rid\":\"7c9e318a8fcc4c9485b8639fdbe93b38\",\"field_type\":\"t\",\"field\":\"page\",\"text\":\"
        In this case, any time a new result is available Nuclia will post it (i.e.
        make an actual POST call) to this URL, sending the protobuffer result as payload.
