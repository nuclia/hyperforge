[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperforge_a2a"
version = "1.0.0"
license = "Apache-2.0"
description = "A2A client Hyperforge agent (connects to external A2A servers)"
authors = [{ name = "Nuclia", email = "nucliadb@nuclia.com" }]
readme = "README.md"
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.12, <4"
dependencies = [
    "hyperforge",
    "a2a-sdk[grpc]>=1.0,<2",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-recording",
    "ty",
]

[project.urls]
Homepage = "https://progress.com"
Repository = "https://github.com/nuclia/hyperforge"
Changelog = "https://github.com/nuclia/hyperforge/blob/main/agents/a2a/CHANGELOG.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv.build-backend]

# Exclude specific files from being packaged
source-exclude = ["tests/**", "*.pyc"]

[tool.ruff]
extend = "../../ruff.toml"
