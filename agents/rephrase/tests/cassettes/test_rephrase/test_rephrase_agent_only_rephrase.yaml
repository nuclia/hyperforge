- request:
    body: '{"question": "Explica c\u00f3mo usar el par\u00e1metro `max_tokens` para
      limitar la longitud de la respuesta generada por el modelo, en espa\u00f1ol,
      y proporciona un enlace a la documentaci\u00f3n relevante.", "user_id": "arag-ask-rerank",
      "context": {"4039d76b0fff4962900836ab3fdec9f7/t/page/3075-3340": " Use the max_tokens
      parameter on the /ask endpoint to set hard limits on: \n - Context size: Limits
      the amount of retrieved information sent to the LLM \n - Answer length: Limits
      the length of the generated response \n Important Considerations \n Context
      Limitations: \n\n", "4039d76b0fff4962900836ab3fdec9f7/t/page/3340-4136": " -
      Restricting context size may result in less relevant answers since the LLM has
      less information to work with \n - Balance between cost control and answer quality
      \n Answer Length Limitations: \n - The LLM might not complete its response if
      it hits the token limit, potentially cutting sentences mid-way \n - Recommended
      approach: Include length requirements in your prompt (e.g., Please answer in
      less than 200 words ) rather than relying solely on hard limits \n - This allows
      the LLM to naturally conclude its response within the desired length \n How
      to Monitor Token Consumption \n Understanding Token Consumption Data \n You
      can receive detailed token consumption information from the following endpoints
      that utilize LLM models: ask, chat, remi, query, sentence, summarize, tokens,
      and rerank. \n\n", "4039d76b0fff4962900836ab3fdec9f7/t/page/1650-2326": " \n
      Large context: Results from using RAG strategies like Full resource or Neighbouring
      paragraphs , or from using the extra_context parameter \n Long questions: More
      detailed or complex questions require more input tokens \n Long prompts: Extensive
      system prompts increase the input token count \n Detailed answers: Comprehensive
      responses require more output tokens \n Images in context: When using multimodal
      models, images included in the retrieved context significantly increase token
      consumption \n \n How to Limit and Control Token Consumption \n Strategy 1:
      Optimize Your Parameters \n The first approach to reducing token consumption
      is to fine-tune your request parameters: \n\n", "1cf976a5ca5947cd89a2f2a047b71ce9/t/page/963-1239":
      " Key components of a split strategy include: \n \n Max paragraph size: Sets
      the maximum size (in characters or tokens) for each chunk. \n Custom split:
      Determines the method used for splitting: \n Manual splitting: Splits content
      based on a specified delimiter (default is \\n ). \n\n", "50aac6f34b6d47de8e3b01f8b2de6e9c/t/page/977-1221":
      " \n optional max_tokens: number \n \n Defined in \n libs/sdk-core/src/lib/db/search/ask.models.ts:251
      \n \n prefer_markdown? \n \n optional prefer_markdown: boolean \n \n Defined
      in \n libs/sdk-core/src/lib/db/search/ask.models.ts:256 \n \n query_context?
      \n\n", "50aac6f34b6d47de8e3b01f8b2de6e9c/t/page/739-977": " \n optional generative_model:
      string \n \n Defined in \n libs/sdk-core/src/lib/db/search/ask.models.ts:250
      \n \n json_schema? \n \n optional json_schema: object \n \n Defined in \n libs/sdk-core/src/lib/db/search/ask.models.ts:257
      \n \n max_tokens? \n\n", "e8525e64c5b44982b958d32cf6090613/t/page/2808-3011":
      " \n optional max_tokens: number \\| object \n \n Defines the maximum number
      of tokens that the model will take as context. \n Defined in \n libs/sdk-core/src/lib/db/search/search.models.ts:112
      \n \n min_score? \n\n", "e8525e64c5b44982b958d32cf6090613/t/page/2450-2808":
      " \n optional highlight: boolean \n \n Inherited from \n BaseSearchOptions.highlight
      \n Defined in \n libs/sdk-core/src/lib/db/search/search.models.ts:76 \n \n keyword_filters?
      \n \n optional keyword_filters: string[] \\| Filter[] \n \n Inherited from \n
      BaseSearchOptions.keyword_filters \n Defined in \n libs/sdk-core/src/lib/db/search/search.models.ts:65
      \n \n max_tokens? \n\n", "c053e849251b4a5296ffeb79ed00200e/t/page/289-366":
      " } \n [class =''docItemCol''] { \n max-width: 100% !important; \n } \n } \n
      `} \n \n \n", "91d9ee7dc2bd47e5b4a1011ca8e42bfd/t/page/252-329": " } \n [class
      =''docItemCol''] { \n max-width: 100% !important; \n } \n } \n `} \n \n \n",
      "43004f553e534ffe9c9e735856bd9b23/t/page/480-703": " \n optional max_images:
      string \n \n Defined in \n libs/sdk-core/src/lib/db/kb/kb.models.ts:591 \n \n
      output_tokens \n \n output_tokens: object \n \n default_max? \n \n optional
      default_max: number \n \n max \n \n max: number \n \n min? \n \n\n", "43004f553e534ffe9c9e735856bd9b23/t/page/212-480":
      " \n optional driver: string \n \n Defined in \n libs/sdk-core/src/lib/db/kb/kb.models.ts:590
      \n \n input_tokens \n \n input_tokens: object \n \n max \n \n max: number \n
      \n min? \n \n optional min: number \n \n Defined in \n libs/sdk-core/src/lib/db/kb/kb.models.ts:587
      \n \n max_images? \n\n", "53b91ad0dd5f48a7ac8b59f9775ed7e0/t/page/257-334":
      " } \n [class =''docItemCol''] { \n max-width: 100% !important; \n } \n } \n
      `} \n \n \n", "9f7036a7a6694700b72d52eb58a8326c/t/page/5203-5412": " max_tokens:
      the maximum number of input tokens to put in the final context (including the
      prompt, the retrieved results and the user question). \n max_output_tokens:
      the maximum number of tokens to generate. \n\n", "dd41482018924facb5dbb87a7d53f122/t/page/3310-3757":
      " ) \n time.sleep(wait_time) \n retries += 1 \n else: \n response.raise_for_status()
      \n raise Exception( Max retries exceeded ) \n Example usage \n url = https://your-endpoint
      \n headers = { Authorization : Bearer YOUR_ACCESS_TOKEN } \n data = make_request_with_try_after_info(url,
      headers) \n print(data) \n ``` \n These examples demonstrate how to handle rate
      limits effectively, ensuring that your application respects the limits and retries
      appropriately.\n", "dd41482018924facb5dbb87a7d53f122/t/page/1900-2653": " retries
      = 0 \n while retries < max_retries: \n response = requests.get(url, headers=headers)
      \n if response.status_code == 200: \n return response.json() \n elif response.status_code
      == 429: \n wait_time = 2 retries # Exponential backoff: 2^retries \n print(f
      Rate limit exceeded. Retrying in {wait_time} seconds... ) \n time.sleep(wait_time)
      \n retries += 1 \n else: \n response.raise_for_status() \n raise Exception(
      Max retries exceeded ) \n Example usage \n url = https://your-endpoint \n headers
      = { Authorization : Bearer YOUR_ACCESS_TOKEN } \n data = make_request_with_exponential_backoff(url,
      headers) \n print(data) \n ``` \n Example 2: Ingestion back pressure limits
      \n Here''s an example of how to use the try_after key from the response to manage
      rate limits: \n\n", "220eb37c167f4eb9bb8e9454e7ba8cf5/t/page/2505-2709": " :::
      \n :::warning \n Enabling reasoning can use additional tokens, which may increase
      your usage costs. \n You may need to increase max_tokens to give the LLM enough
      room to reason and generate an answer. \n\n", "220eb37c167f4eb9bb8e9454e7ba8cf5/t/page/1790-2276":
      " \n SDK: \n \n ```python \n from nuclia import sdk \n from nucliadb_models.search
      import AskRequest, Reasoning \n search = sdk.NucliaSearch() \n query = AskRequest(
      \n query= My question with extra reasoning effort , \n max_tokens=5000, \n reasoning=Reasoning(
      \n display=True, # Show reasoning in the response \n effort= low , # Can be
      low , medium , or high \n budget_tokens=1024 # How many tokens reasoning can
      use \n ), \n ) \n search.ask(query=query) \n ``` \n Model Support for Reasoning
      Options: \n\n", "89cc367c149e4f6eab0e06a743d1edba/t/page/2804-3043": " Description:
      The maximum number of tokens that the model can generate as output. Again, we
      should keep in mind that this value summed to the Maximum supported input tokens
      should not exceed the total context size supported by the model. \n\n", "89cc367c149e4f6eab0e06a743d1edba/t/page/2202-2575":
      " \n \n Maximum supported input tokens: \n Description: The maximum number of
      tokens that the model can accept as input. Be mindful that this takes into account
      the tokens used in the prompt, query and context. Also take note that some models
      may provide their context window as the total between input and output tokens,
      while others may provide it as the input tokens only. \n\n"}}'
