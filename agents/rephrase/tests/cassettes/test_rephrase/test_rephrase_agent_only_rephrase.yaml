- request:
    body: '{"question": "\u00bfCu\u00e1l es el enlace a la documentaci\u00f3n relevante
      sobre el uso del par\u00e1metro `max_tokens`?", "user_id": "arag-ask-rerank",
      "context": {"4039d76b0fff4962900836ab3fdec9f7/t/page/3075-3340": " Use the max_tokens
      parameter on the /ask endpoint to set hard limits on: \n - Context size: Limits
      the amount of retrieved information sent to the LLM \n - Answer length: Limits
      the length of the generated response \n Important Considerations \n Context
      Limitations: \n\n", "4039d76b0fff4962900836ab3fdec9f7/t/page/3340-4136": " -
      Restricting context size may result in less relevant answers since the LLM has
      less information to work with \n - Balance between cost control and answer quality
      \n Answer Length Limitations: \n - The LLM might not complete its response if
      it hits the token limit, potentially cutting sentences mid-way \n - Recommended
      approach: Include length requirements in your prompt (e.g., Please answer in
      less than 200 words ) rather than relying solely on hard limits \n - This allows
      the LLM to naturally conclude its response within the desired length \n How
      to Monitor Token Consumption \n Understanding Token Consumption Data \n You
      can receive detailed token consumption information from the following endpoints
      that utilize LLM models: ask, chat, remi, query, sentence, summarize, tokens,
      and rerank. \n\n", "4039d76b0fff4962900836ab3fdec9f7/t/page/1650-2326": " \n
      Large context: Results from using RAG strategies like Full resource or Neighbouring
      paragraphs , or from using the extra_context parameter \n Long questions: More
      detailed or complex questions require more input tokens \n Long prompts: Extensive
      system prompts increase the input token count \n Detailed answers: Comprehensive
      responses require more output tokens \n Images in context: When using multimodal
      models, images included in the retrieved context significantly increase token
      consumption \n \n How to Limit and Control Token Consumption \n Strategy 1:
      Optimize Your Parameters \n The first approach to reducing token consumption
      is to fine-tune your request parameters: \n\n", "1cf976a5ca5947cd89a2f2a047b71ce9/t/page/963-1239":
      " Key components of a split strategy include: \n \n Max paragraph size: Sets
      the maximum size (in characters or tokens) for each chunk. \n Custom split:
      Determines the method used for splitting: \n Manual splitting: Splits content
      based on a specified delimiter (default is \\n ). \n\n", "50aac6f34b6d47de8e3b01f8b2de6e9c/t/page/977-1221":
      " \n optional max_tokens: number \n \n Defined in \n libs/sdk-core/src/lib/db/search/ask.models.ts:251
      \n \n prefer_markdown? \n \n optional prefer_markdown: boolean \n \n Defined
      in \n libs/sdk-core/src/lib/db/search/ask.models.ts:256 \n \n query_context?
      \n\n", "50aac6f34b6d47de8e3b01f8b2de6e9c/t/page/739-977": " \n optional generative_model:
      string \n \n Defined in \n libs/sdk-core/src/lib/db/search/ask.models.ts:250
      \n \n json_schema? \n \n optional json_schema: object \n \n Defined in \n libs/sdk-core/src/lib/db/search/ask.models.ts:257
      \n \n max_tokens? \n\n", "e8525e64c5b44982b958d32cf6090613/t/page/2808-3011":
      " \n optional max_tokens: number \\| object \n \n Defines the maximum number
      of tokens that the model will take as context. \n Defined in \n libs/sdk-core/src/lib/db/search/search.models.ts:112
