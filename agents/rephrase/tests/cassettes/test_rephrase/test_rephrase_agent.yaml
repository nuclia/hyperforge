        Found {nodes.Nodes?.Count ?? 0} matching nodes ); \\n } \\n ``` \\n \\n GraphRelationsSearchAsync
        \\n Search Knowledge Box graph relations (edges). \\n Signature: \\n csharp
        \\n Task> GraphRelationsSearchAsync(GraphRelationsSearchRequest request) \\n
        Parameters: \\n - request (GraphRelationsSearchRequest, required): Graph relations
        search parameters \\n Returns: Graph relations matching the search criteria
        \\n Example: \\n ```csharp \\n var relationsRequest = new GraphRelationsSearchRequest
        \\n { \\n Query = implements \\n }; \\n var response = await searchService.GraphRelationsSearchAsync(relationsRequest);
        \\n if (response.IsSuccessful) \\n { \\n var relations = response.Data; \\n
        Console.WriteLine($ Found {relations.Relations?.Count ?? 0} matching relations
        ); \\n } \\n ``` \\n \\n SendFeedbackAsync \\n Send feedback for a search
        operation to improve future results. \\n Signature: \\n csharp \\n Task> SendFeedbackAsync(FeedbackRequest
        request) \\n Parameters: \\n - request (FeedbackRequest, required): Feedback
        data including operation ID and rating \\n Returns: True if feedback was submitted
        successfully \\n Example: \\n ```csharp \\n var feedbackRequest = new FeedbackRequest
        \\n { \\n Ident = operation-123 , \\n Good = true, \\n Task = TaskType.Question
        \\n }; \\n var response = await searchService.SendFeedbackAsync(feedbackRequest);
        \\n if (response.IsSuccessful) \\n { \\n Console.WriteLine( Feedback submitted
        successfully ); \\n } \\n ``` \\n \\n SearchAsync \\n Search Knowledge Box
        and retrieve separate results for documents, paragraphs, and sentences. \\n
        Signature: \\n csharp \\n Task> SearchAsync(SearchRequest request) \\n Parameters:
        \\n - request (SearchRequest, required): Comprehensive search request parameters
        \\n Returns: Structured search results with multiple result types \\n Example:
        \\n ```csharp \\n var searchRequest = new SearchRequest \\n { \\n Query =
        API documentation \\n }; \\n var response = await searchService.SearchAsync(searchRequest);
        \\n if (response.IsSuccessful) \\n { \\n var results = response.Data; \\n
        Console.WriteLine($ Documents: {results.Documents?.Count ?? 0} ); \\n Console.WriteLine($
        Paragraphs: {results.Paragraphs?.Count ?? 0} ); \\n Console.WriteLine($ Sentences:
        {results.Sentences?.Count ?? 0} ); \\n } \\n ``` \\n \\n AskResourceAsync
        \\n Ask a question to a specific resource and get a synchronous response.
        \\n Signature: \\n csharp \\n Task> AskResourceAsync(string resourceId, AskRequest
        request) \\n Parameters: \\n - resourceId (string, required): The unique identifier
        of the resource \\n - request (AskRequest, required): The ask request parameters
        \\n Returns: Answer specific to the resource \\n Example: \\n ```csharp \\n
        var askRequest = new AskRequest \\n { \\n Query = What does this document
        explain? \\n }; \\n var response = await searchService.AskResourceAsync( my-resource-id
        , askRequest); \\n if (response.IsSuccessful) \\n { \\n var result = response.Data;
        \\n Console.WriteLine($ Resource-specific answer: {result.Answer} ); \\n }
        \\n ``` \\n \\n AskResourceStreamAsync (with AskRequest) \\n Ask a question
        to a specific resource and get a streaming response. \\n Signature: \\n csharp
        \\n IAsyncEnumerable AskResourceStreamAsync(string resourceId, AskRequest
        request) \\n Parameters: \\n - resourceId (string, required): The unique identifier
        of the resource \\n - request (AskRequest, required): The ask request parameters
        \\n Returns: Streaming response specific to the resource \\n Example: \\n
        ```csharp \\n var askRequest = new AskRequest \\n { \\n Query = Summarize
        this document's main points \\n }; \\n await foreach (var update in searchService.AskResourceStreamAsync(
        my-resource-id , askRequest)) \\n { \\n if (update.Item is AnswerContent answerContent
        && !string.IsNullOrEmpty(answerContent.Text)) \\n { \\n Console.Write(answerContent.Text);
        \\n } \\n } \\n ``` \\n \\n AskResourceStreamAsync (with query string) \\n
        Ask a question to a specific resource with simplified query. \\n Signature:
        \\n csharp \\n IAsyncEnumerable AskResourceStreamAsync(string resourceId,
        string query) \\n Parameters: \\n - resourceId (string, required): The unique
        identifier of the resource \\n - query (string, required): The question to
        ask \\n Returns: Streaming response for the resource \\n Example: \\n csharp
        \\n await foreach (var update in searchService.AskResourceStreamAsync( my-resource-id
        , What are the key features? )) \\n { \\n if (update.Item is AnswerContent
        answerContent && !string.IsNullOrEmpty(answerContent.Text)) \\n { \\n Console.Write(answerContent.Text);
        \\n } \\n } \\n \\n AskResourceBySlugAsync \\n Ask a question about a specific
        resource by slug synchronously. \\n Signature: \\n csharp \\n Task> AskResourceBySlugAsync(string
        slug, AskRequest request) \\n Parameters: \\n - slug (string, required): The
        slug identifier of the resource \\n - request (AskRequest, required): The
        ask request parameters \\n Returns: Answer specific to the resource identified
        by slug \\n Example: \\n ```csharp \\n var askRequest = new AskRequest \\n
        { \\n Query = What is the purpose of this document? \\n }; \\n var response
        = await searchService.AskResourceBySlugAsync( my-document-slug , askRequest);
        \\n if (response.IsSuccessful) \\n { \\n var result = response.Data; \\n Console.WriteLine($
        Answer: {result.Answer} ); \\n } \\n ``` \\n \\n PredictProxyAsync \\n Proxy
        endpoint that forwards requests to the Predict API with Knowledge Box configuration.
        \\n Signature: \\n csharp \\n Task> PredictProxyAsync(PredictProxiedEndpoints
        endpoint) \\n Parameters: \\n - endpoint (PredictProxiedEndpoints, required):
        The predict endpoint to call \\n Returns: Response from the predict API \\n
        Example: \\n csharp \\n var response = await searchService.PredictProxyAsync(PredictProxiedEndpoints.Tokens);
        \\n if (response.IsSuccessful) \\n { \\n var result = response.Data; \\n Console.WriteLine($
        Predict API response: {result} ); \\n } \\n \\n SearchResourceAsync \\n Search
        within a specific resource by ID. \\n Signature: \\n csharp \\n Task> SearchResourceAsync(string
        resourceId, string query) \\n Parameters: \\n - resourceId (string, required):
        The unique identifier of the resource \\n - query (string, required): The
        search query \\n Returns: Search results within the specified resource \\n
        Example: \\n csharp \\n var response = await searchService.SearchResourceAsync(
        my-resource-id , configuration settings ); \\n if (response.IsSuccessful)
        \\n { \\n var results = response.Data; \\n Console.WriteLine($ Found {results.Total}
        matches in resource ); \\n foreach (var paragraph in results.Paragraphs ??
        []) \\n { \\n Console.WriteLine($ Match: {paragraph.Text} ); \\n } \\n } \\n
        Usage Notes \\n \\n All methods are asynchronous and return ApiResponse wrappers
        \\n Check response.IsSuccessful before accessing response.Data \\n Streaming
        methods return IAsyncEnumerable for real-time response processing \\n For
        streaming examples, add using Progress.Nuclia.Model.Streaming; to access AnswerContent
        \\n Ask methods provide RAG capabilities with citations and source information
        \\n Graph search methods enable relationship-based queries \\n Resource-specific
        methods limit scope to individual documents \\n Feedback helps improve AI
