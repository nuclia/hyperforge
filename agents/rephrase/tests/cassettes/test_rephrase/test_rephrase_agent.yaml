        > rag > advanced > consumption.\",\"summary\":\"\",\"icon\":\"text/markdown\",\"thumbnail\":\"\",\"metadata\":{\"metadata\":{},\"language\":\"en\",\"languages\":[\"en\"],\"status\":\"PROCESSED\"},\"usermetadata\":{\"classifications\":[],\"relations\":[]},\"fieldmetadata\":[],\"computedmetadata\":{\"field_classifications\":[]},\"created\":\"2025-10-03T08:32:26.341394\",\"modified\":\"2026-06-09T08:18:16.730959\",\"last_seqid\":0,\"last_account_seq\":null,\"queue\":\"private\",\"hidden\":false,\"origin\":{\"source_id\":\"\",\"url\":\"https://docs.rag.progress.cloud/docs/rag/advanced/consumption\",\"metadata\":{},\"tags\":[],\"collaborators\":[],\"filename\":\"\",\"related\":[],\"path\":\"\",\"source\":\"API\"},\"extra\":null,\"relations\":null,\"data\":{\"texts\":{\"page\":{\"value\":{\"body\":\"---\\nid:
        consumption\\ntitle: Token consumption\\n---\\n\\nimport Tabs from \\\"@theme/Tabs\\\";\\nimport
        TabItem from \\\"@theme/TabItem\\\";\\n\\n# Token consumption\\n\\nAgentic
        RAG is a license and consumption-based service. This means that you pay for
        the computational resources you consume. The consumption is measured in **Agentic
        RAG tokens**.\\nAll public 3rd-party LLMs base their pricing on the number
        of tokens consumed. In the LLM world, a token is around 4-5 characters on
        average, which might fit an entire word or be split into parts. The number
        of tokens is proportional to the amount of text, measured in chunks of 4-5
        characters. It closely relates to words but not entirely. The longer a sentence
        is, the more tokens it will consume to read or to generate it.\\nSince all
        these 3rd-party LLMs have different pricing, Agentic RAG tokens serve to normalize
        the cost across all of them.\\n\\n## How Tokens Are Consumed in RAG\\n\\nWhen
        a user asks a question to your Knowledge Box, the token consumption process
        follows these steps:\\n\\n1. **Question Processing**: The system finds the
        most relevant paragraphs to answer the question\\n2. **Context Assembly**:
        These paragraphs are used as context when calling the LLM model\\n3. **Prompt
        Creation**: Agentic RAG assembles the **prompt**, **context**, and **question**
        into a single string\\n4. **LLM Processing**: This complete string is sent
        to the LLM, corresponding to a certain number of **input tokens**\\n5. **Answer
        Generation**: The LLM generates the answer, which corresponds to a certain
        number of **output tokens**\\n\\n**Total consumption** = Input tokens + Output
        tokens + Image tokens\\n\\n### Factors That Impact Token Consumption\\n\\nToken
        consumption is directly affected by:\\n\\n- **Large context**: Results from
        using RAG strategies like \\\"Full resource\\\" or \\\"Neighbouring paragraphs\\\",
        or from using the `extra_context` parameter\\n- **Long questions**: More detailed
        or complex questions require more input tokens\\n- **Long prompts**: Extensive
        system prompts increase the input token count\\n- **Detailed answers**: Comprehensive
        responses require more output tokens\\n- **Images in context**: When using
        multimodal models, images included in the retrieved context significantly
        increase token consumption\\n\\n## How to Limit and Control Token Consumption\\n\\n###
        Strategy 1: Optimize Your Parameters\\n\\nThe first approach to reducing token
        consumption is to fine-tune your request parameters:\\n\\n- **Optimize prompts**:
        Ensure your prompts are concise and focused, avoiding unnecessary verbosity\\n-
        **Control resource scope**: When using the \\\"Full resource\\\" strategy,
        use the `count` attribute to limit the number of resources returned\\n- **Tune
        neighboring context**: For the \\\"Neighbouring paragraphs\\\" strategy, optimize
        the `before` and `after` attributes to balance context quality with token
        efficiency\\n- **Manage summary length**: When using the \\\"Hierarchical\\\"
        strategy, ensure that resource summaries are appropriately sized\\n- **Choose
        efficient models**: Select LLMs that offer better token efficiency (typically,
        ChatGPT 4o-mini is more cost-effective than ChatGPT 4o)\\n\\n### Strategy
        2: Set Hard Limits\\n\\nYou can implement safeguards against excessive token
        consumption:\\n\\nUse the `max_tokens` parameter on the [`/ask` endpoint](/docs/api#tag/Search/operation/ask_knowledgebox_endpoint_kb__kbid__ask_post)
        to set hard limits on:\\n- **Context size**: Limits the amount of retrieved
        information sent to the LLM\\n- **Answer length**: Limits the length of the
        generated response\\n\\n#### Important Considerations\\n\\n**Context Limitations**:\\n-
        Restricting context size may result in less relevant answers since the LLM
        has less information to work with\\n- Balance between cost control and answer
        quality\\n\\n**Answer Length Limitations**:\\n- The LLM might not complete
        its response if it hits the token limit, potentially cutting sentences mid-way\\n-
        **Recommended approach**: Include length requirements in your prompt (e.g.,
        \\\"Please answer in less than 200 words\\\") rather than relying solely on
        hard limits\\n- This allows the LLM to naturally conclude its response within
        the desired length\\n\\n## How to Monitor Token Consumption\\n\\n### Understanding
        Token Consumption Data\\n\\nYou can receive detailed token consumption information
        from the following endpoints that utilize LLM models: `ask`, `chat`, `remi`,
        `query`, `sentence`, `summarize`, `tokens`, and `rerank`.\\n\\n:::note\\nThe
        `rephrase` endpoint currently does not support token consumption monitoring.\\n:::\\n\\nTo
        receive token consumption data, you must include the following header in your
        request:\\n```\\nX-SHOW-CONSUMPTION: true\\n```\\n\\nThe token consumption
        data is provided in different formats depending on the response type:\\n-
        **Streaming responses** (`application/x-ndjson`): Token consumption appears
        as a separate JSON chunk with type \\\"consumption\\\"\\n- **Standard responses**
        (`application/json`): Token consumption is included in a \\\"consumption\\\"
        field within the main response\\n\\n### Token Consumption Response Format\\n\\n<Tabs
        groupId=\\\"token-consumption\\\">\\n  <TabItem value=\\\"streaming json\\\"
        label=\\\"Streaming (x-ndjson)\\\">\\n    ```json\\n    {\\n      \\\"item\\\":
        {\\n        \\\"type\\\": \\\"consumption\\\",\\n        \\\"normalized_tokens\\\":
        {\\n          \\\"input\\\": 13,\\n          \\\"output\\\": 34,\\n          \\\"image\\\":
        0.0\\n        },\\n        \\\"customer_key_tokens\\\": {\\n          \\\"input\\\":
        0.0,\\n          \\\"output\\\": 0.0,\\n          \\\"image\\\": 0.0\\n        }\\n
        \     }\\n    }\\n    ```\\n  </TabItem>\\n  <TabItem value=\\\"json\\\" label=\\\"Standard
        (json)\\\">\\n    ```json\\n    {\\n      \\\"consumption\\\": {\\n        \\\"normalized_tokens\\\":
        {\\n          \\\"input\\\": 13,\\n          \\\"output\\\": 34,\\n          \\\"image\\\":
        0.0\\n        },\\n        \\\"customer_key_tokens\\\": {\\n          \\\"input\\\":
        0.0,\\n          \\\"output\\\": 0.0,\\n          \\\"image\\\": 0.0\\n        }\\n
        \     }\\n    }\\n    ```\\n  </TabItem>\\n</Tabs>\\n\\n### Understanding
        Token Types\\n\\n**Normalized Tokens** (`normalized_tokens`):\\n- These represent
        the number of Agentic RAG tokens consumed and that you will be billed for\\n-
        Values are normalized across different LLM providers for consistent billing\\n-
        Include separate counts for:\\n  - `input`: Tokens used for the prompt, context,
        and question\\n  - `output`: Tokens used for the generated response\\n  -
        `image`: Tokens used for image processing (when applicable)\\n\\n**Customer
        Key Tokens** (`customer_key_tokens`):\\n- These represent tokens consumed
        when using your own LLM API keys\\n- These tokens are **not billed** by Agentic
        RAG since you're using your own API keys\\n- Values are also normalized for
        comparison purposes across different providers\\n\",\"format\":\"MARKDOWN\",\"md5\":\"204fe47dbd7eb38d465d05fa7538e51e\",\"extract_strategy\":\"\",\"split_strategy\":\"\"},\"extracted\":{\"text\":{\"text\":\"
        \\n id: consumption \\n title: Token consumption \\n \\n import Tabs from
        @theme/Tabs ; \\n import TabItem from @theme/TabItem ; \\n Token consumption
        \\n Agentic RAG is a license and consumption-based service. This means that
        you pay for the computational resources you consume. The consumption is measured
        in Agentic RAG tokens. \\n All public 3rd-party LLMs base their pricing on
        the number of tokens consumed. In the LLM world, a token is around 4-5 characters
        on average, which might fit an entire word or be split into parts. The number
        of tokens is proportional to the amount of text, measured in chunks of 4-5
        characters. It closely relates to words but not entirely. The longer a sentence
        is, the more tokens it will consume to read or to generate it. \\n Since all
        these 3rd-party LLMs have different pricing, Agentic RAG tokens serve to normalize
        the cost across all of them. \\n How Tokens Are Consumed in RAG \\n When a
        user asks a question to your Knowledge Box, the token consumption process
        follows these steps: \\n \\n Question Processing: The system finds the most
        relevant paragraphs to answer the question \\n Context Assembly: These paragraphs
        are used as context when calling the LLM model \\n Prompt Creation: Agentic
        RAG assembles the prompt, context, and question into a single string \\n LLM
        Processing: This complete string is sent to the LLM, corresponding to a certain
        number of input tokens \\n Answer Generation: The LLM generates the answer,
        which corresponds to a certain number of output tokens \\n \\n Total consumption
        = Input tokens + Output tokens + Image tokens \\n Factors That Impact Token
        Consumption \\n Token consumption is directly affected by: \\n \\n Large context:
        Results from using RAG strategies like Full resource or Neighbouring paragraphs
        , or from using the extra_context parameter \\n Long questions: More detailed
        or complex questions require more input tokens \\n Long prompts: Extensive
        system prompts increase the input token count \\n Detailed answers: Comprehensive
        responses require more output tokens \\n Images in context: When using multimodal
        models, images included in the retrieved context significantly increase token
        consumption \\n \\n How to Limit and Control Token Consumption \\n Strategy
        1: Optimize Your Parameters \\n The first approach to reducing token consumption
        is to fine-tune your request parameters: \\n \\n Optimize prompts: Ensure
        your prompts are concise and focused, avoiding unnecessary verbosity \\n Control
        resource scope: When using the Full resource strategy, use the count attribute
        to limit the number of resources returned \\n Tune neighboring context: For
        the Neighbouring paragraphs strategy, optimize the before and after attributes
        to balance context quality with token efficiency \\n Manage summary length:
        When using the Hierarchical strategy, ensure that resource summaries are appropriately
        sized \\n Choose efficient models: Select LLMs that offer better token efficiency
        (typically, ChatGPT 4o-mini is more cost-effective than ChatGPT 4o) \\n \\n
        Strategy 2: Set Hard Limits \\n You can implement safeguards against excessive
        token consumption: \\n Use the max_tokens parameter on the /ask endpoint to
        set hard limits on: \\n - Context size: Limits the amount of retrieved information
        sent to the LLM \\n - Answer length: Limits the length of the generated response
        \\n Important Considerations \\n Context Limitations: \\n - Restricting context
        size may result in less relevant answers since the LLM has less information
        to work with \\n - Balance between cost control and answer quality \\n Answer
        Length Limitations: \\n - The LLM might not complete its response if it hits
        the token limit, potentially cutting sentences mid-way \\n - Recommended approach:
        Include length requirements in your prompt (e.g., Please answer in less than
        200 words ) rather than relying solely on hard limits \\n - This allows the
        LLM to naturally conclude its response within the desired length \\n How to
        Monitor Token Consumption \\n Understanding Token Consumption Data \\n You
        can receive detailed token consumption information from the following endpoints
        that utilize LLM models: ask, chat, remi, query, sentence, summarize, tokens,
        and rerank. \\n :::note \\n The rephrase endpoint currently does not support
        token consumption monitoring. \\n ::: \\n To receive token consumption data,
        you must include the following header in your request: \\n X-SHOW-CONSUMPTION:
        true \\n The token consumption data is provided in different formats depending
        on the response type: \\n - Streaming responses (application/x-ndjson): Token
        consumption appears as a separate JSON chunk with type consumption \\n - Standard
        responses (application/json): Token consumption is included in a consumption
        field within the main response \\n Token Consumption Response Format \\n \\n
        \\n json \\n { \\n item : { \\n type : consumption , \\n normalized_tokens
        : { \\n input : 13, \\n output : 34, \\n image : 0.0 \\n }, \\n customer_key_tokens
        : { \\n input : 0.0, \\n output : 0.0, \\n image : 0.0 \\n } \\n } \\n } \\n
        \\n \\n json \\n { \\n consumption : { \\n normalized_tokens : { \\n input
        : 13, \\n output : 34, \\n image : 0.0 \\n }, \\n customer_key_tokens : {
        \\n input : 0.0, \\n output : 0.0, \\n image : 0.0 \\n } \\n } \\n } \\n \\n
        \\n Understanding Token Types \\n Normalized Tokens (normalized_tokens): \\n
        - These represent the number of Agentic RAG tokens consumed and that you will
        be billed for \\n - Values are normalized across different LLM providers for
        consistent billing \\n - Include separate counts for: \\n - input: Tokens
        used for the prompt, context, and question \\n - output: Tokens used for the
        generated response \\n - image: Tokens used for image processing (when applicable)
        \\n Customer Key Tokens (customer_key_tokens): \\n - These represent tokens
        consumed when using your own LLM API keys \\n - These tokens are not billed
        by Agentic RAG since you're using your own API keys \\n - Values are also
        normalized for comparison purposes across different providers\",\"split_text\":{},\"deleted_splits\":[]},\"metadata\":{\"metadata\":{\"links\":[],\"paragraphs\":[{\"start\":0,\"end\":319,\"start_seconds\":[],\"end_seconds\":[],\"kind\":\"TEXT\",\"classifications\":[],\"sentences\":[{\"start\":3,\"end\":198,\"key\":\"\"},{\"start\":198,\"end\":267,\"key\":\"\"},{\"start\":267,\"end\":319,\"key\":\"\"}]},{\"start\":319,\"end\":747,\"start_seconds\":[],\"end_seconds\":[],\"kind\":\"TEXT\",\"classifications\":[],\"sentences\":[{\"start\":320,\"end\":399,\"key\":\"\"},{\"start\":399,\"end\":517,\"key\":\"\"},{\"start\":517,\"end\":615,\"key\":\"\"},{\"start\":615,\"end\":661,\"key\":\"\"},{\"start\":661,\"end\":747,\"key\":\"\"}]},{\"start\":747,\"end\":1008,\"start_seconds\":[],\"end_seconds\":[],\"kind\":\"TEXT\",\"classifications\":[],\"sentences\":[{\"start\":748,\"end\":872,\"key\":\"\"},{\"start\":872,\"end\":1008,\"key\":\"\"}]},{\"start\":1008,\"end\":1650,\"start_seconds\":[],\"end_seconds\":[],\"kind\":\"TEXT\",\"classifications\":[],\"sentences\":[{\"start\":1011,\"end\":1650,\"key\":\"\"}]},{\"start\":1650,\"end\":2326,\"start_seconds\":[],\"end_seconds\":[],\"kind\":\"TEXT\",\"classifications\":[],\"sentences\":[{\"start\":1653,\"end\":2326,\"key\":\"\"}]},{\"start\":2326,\"end\":3075,\"start_seconds\":[],\"end_seconds\":[],\"kind\":\"TEXT\",\"classifications\":[],\"sentences\":[{\"start\":2329,\"end\":3075,\"key\":\"\"}]},{\"start\":3075,\"end\":3340,\"start_seconds\":[],\"end_seconds\":[],\"kind\":\"TEXT\",\"classifications\":[],\"sentences\":[{\"start\":3076,\"end\":3340,\"key\":\"\"}]},{\"start\":3340,\"end\":4136,\"start_seconds\":[],\"end_seconds\":[],\"kind\":\"TEXT\",\"classifications\":[],\"sentences\":[{\"start\":3341,\"end\":4136,\"key\":\"\"}]},{\"start\":4136,\"end\":4446,\"start_seconds\":[],\"end_seconds\":[],\"kind\":\"TEXT\",\"classifications\":[],\"sentences\":[{\"start\":4137,\"end\":4228,\"key\":\"\"},{\"start\":4228,\"end\":4446,