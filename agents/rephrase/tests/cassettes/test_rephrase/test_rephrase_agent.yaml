        ISearchService Documentation\\n\\nThe `ISearchService` provides AI-powered
        search, question-answering, and retrieval capabilities across Knowledge Boxes,
        including both synchronous and streaming responses.\\n\\n## Methods\\n\\n###
        AskAsync\\n\\nAsk a question to the Knowledge Box and get a synchronous response
        with RAG (Retrieval-Augmented Generation).\\n\\n**Signature:**\\n```csharp\\nTask<ApiResponse<SyncAskResponse>>
        AskAsync(AskRequest request)\\n```\\n\\n**Parameters:**\\n- `request` (AskRequest,
        required): The ask request containing query and configuration\\n\\n**Returns:**
        Complete response with answer, citations, and metadata\\n\\n**Example:**\\n```csharp\\nvar
        askRequest = new AskRequest\\n{\\n    Query = \\\"What are the main benefits
        of using this system?\\\"\\n};\\n\\nvar response = await searchService.AskAsync(askRequest);\\nif
        (response.IsSuccessful)\\n{\\n    var result = response.Data;\\n    Console.WriteLine($\\\"Answer:
        {result.Answer}\\\");\\n    Console.WriteLine($\\\"Citations: {result.Citations?.Count
        ?? 0}\\\");\\n}\\n```\\n\\n---\\n\\n### AskStreamAsync (with AskRequest)\\n\\nAsk
        a question to the Knowledge Box and get a streaming response.\\n\\n**Signature:**\\n```csharp\\nIAsyncEnumerable<SyncAskResponseUpdate>
        AskStreamAsync(AskRequest request)\\n```\\n\\n**Parameters:**\\n- `request`
        (AskRequest, required): The ask request containing query and configuration\\n\\n**Returns:**
        Streaming updates as they become available\\n\\n**Example:**\\n```csharp\\nvar
        askRequest = new AskRequest(query) { Citations = new Citations(true) };\\n\\nvar
        result = client.Search.AskStreamAsync(askRequest);\\nstring streamingResponse
        = string.Empty;\\nDictionary<string, FindResource>? allResources;\\nIEnumerable<(int
        Number, KeyValuePair<string, int[][]> Item)>? citations;\\nawait foreach (var
        response in result)\\n \\t{\\n \\t\\tswitch (response.Item)\\n \\t\\t{\\n
        \\t\\t\\tcase AnswerContent answer:\\n \\t\\t\\t\\tstreamingResponse += answer.Text;\\n
        \\t\\t\\t\\tbreak;\\n \\t\\t\\tcase RetrievalContent retrieval:\\n \\t\\t\\t\\tallResources
        = retrieval.Results?.Resources;\\n \\t\\t\\t\\tbreak;\\n \\t\\t\\tcase CitationsContent
        c:\\n \\t\\t\\t\\tcitations = c.Citations.Index(); // Index is optional, this
        adds an numeric index to the citations.\\n \\t\\t\\t\\tbreak;\\n \\t\\t}\\n
        \\t}\\n```\\n\\n---\\n\\n### AskStreamAsync (with query string)\\n\\nAsk a
        question using default options and get a streaming response.\\n\\n**Signature:**\\n```csharp\\nIAsyncEnumerable<SyncAskResponseUpdate>
        AskStreamAsync(string query)\\n```\\n\\n**Parameters:**\\n- `query` (string,
        required): The question to ask\\n\\n**Returns:** Streaming response updates\\n\\n**Example:**\\n```csharp\\nstring
        streamingResponse = string.Empty;\\nawait foreach (var update in searchService.AskStreamAsync(\\\"How
        do I configure authentication?\\\"))\\n{\\n    if (update.Item is AnswerContent
        answerContent)\\n    {\\n       streamingResponse += answerContent.Text;\\n
        \   }\\n}\\n```\\n\\n---\\n\\n### FindAsync\\n\\nFind resources in the Knowledge
        Box with detailed paragraph-level search results.\\n\\n**Signature:**\\n```csharp\\nTask<ApiResponse<KnowledgeboxFindResults>>
        FindAsync(FindRequest request)\\n```\\n\\n**Parameters:**\\n- `request` (FindRequest,
        required): The find request with search parameters\\n\\n**Returns:** Detailed
        search results with paragraph-level information\\n\\n**Example:**\\n```csharp\\nvar
        findRequest = new FindRequest\\n{\\n    Query = \\\"security implementation\\\"\\n};\\n\\nvar
        response = await searchService.FindAsync(findRequest);\\nif (response.IsSuccessful)\\n{\\n
        \   var results = response.Data;\\n    Console.WriteLine($\\\"Found {results.Total}
        results\\\");\\n    foreach (var resource in results.Resources)\\n    {\\n
        \       Console.WriteLine($\\\"Resource: {resource.Title}\\\");\\n    }\\n}\\n```\\n\\n---\\n\\n###
        CatalogAsync\\n\\nList resources in the Knowledge Box using POST with JSON
        body.\\n\\n**Signature:**\\n```csharp\\nTask<ApiResponse<KnowledgeboxSearchResults>>
        CatalogAsync(CatalogRequest request)\\n```\\n\\n**Parameters:**\\n- `request`
        (CatalogRequest, required): The catalog request parameters\\n\\n**Returns:**
        Resource catalog with filtering and pagination\\n\\n**Example:**\\n```csharp\\nvar
        catalogRequest = new CatalogRequest\\n{\\n    // Configure catalog parameters\\n};\\n\\nvar
        response = await searchService.CatalogAsync(catalogRequest);\\nif (response.IsSuccessful)\\n{\\n
        \   var catalog = response.Data;\\n    Console.WriteLine($\\\"Catalog contains
        {catalog.Total} resources\\\");\\n}\\n```\\n\\n---\\n\\n### SuggestAsync\\n\\nRetrieve
        paragraph and entity suggestions for a query.\\n\\n**Signature:**\\n```csharp\\nTask<ApiResponse<KnowledgeboxSuggestResults>>
        SuggestAsync(string query)\\n```\\n\\n**Parameters:**\\n- `query` (string,
        required): The query to get suggestions for\\n\\n**Returns:** Suggestions
        including paragraphs and entities\\n\\n**Example:**\\n```csharp\\nvar response
        = await searchService.SuggestAsync(\\\"authentication\\\");\\nif (response.IsSuccessful)\\n{\\n
        \   var suggestions = response.Data;\\n    Console.WriteLine($\\\"Found {suggestions.Paragraphs?.Count
        ?? 0} paragraph suggestions\\\");\\n    Console.WriteLine($\\\"Found {suggestions.Entities?.Count
        ?? 0} entity suggestions\\\");\\n}\\n```\\n\\n---\\n\\n### SummarizeAsync\\n\\nSummarize
        a set of resources using AI.\\n\\n**Signature:**\\n```csharp\\nTask<ApiResponse<SummarizedResponse>>
        SummarizeAsync(SummarizeRequest request)\\n```\\n\\n**Parameters:**\\n- `request`
        (SummarizeRequest, required): The summarization request with resources and
        options\\n\\n**Returns:** AI-generated summary of the specified resources\\n\\n**Example:**\\n```csharp\\nvar
        summarizeRequest = new SummarizeRequest\\n{\\n    Resources = new[] { \\\"resource-1\\\",
        \\\"resource-2\\\" }\\n};\\n\\nvar response = await searchService.SummarizeAsync(summarizeRequest);\\nif
        (response.IsSuccessful)\\n{\\n    var summary = response.Data;\\n    Console.WriteLine($\\\"Summary:
        {summary.Summary}\\\");\\n}\\n```\\n\\n---\\n\\n### GraphSearchAsync\\n\\nSearch
        Knowledge Box graph using triplets (vertex-edge-vertex).\\n\\n**Signature:**\\n```csharp\\nTask<ApiResponse<GraphSearchResponse>>
        GraphSearchAsync(GraphSearchRequest request)\\n```\\n\\n**Parameters:**\\n-
        `request` (GraphSearchRequest, required): Graph search parameters\\n\\n**Returns:**
        Graph search results with relationships\\n\\n**Example:**\\n```csharp\\nvar
        graphRequest = new GraphSearchRequest\\n{\\n    Query = \\\"security protocols\\\"\\n};\\n\\nvar
        response = await searchService.GraphSearchAsync(graphRequest);\\nif (response.IsSuccessful)\\n{\\n
        \   var results = response.Data;\\n    Console.WriteLine($\\\"Found {results.Paths?.Count
        ?? 0} graph paths\\\");\\n}\\n```\\n\\n---\\n\\n### GraphNodesSearchAsync\\n\\nSearch
        Knowledge Box graph nodes (vertices).\\n\\n**Signature:**\\n```csharp\\nTask<ApiResponse<GraphNodesSearchResponse>>
        GraphNodesSearchAsync(GraphNodesSearchRequest request)\\n```\\n\\n**Parameters:**\\n-
        `request` (GraphNodesSearchRequest, required): Graph nodes search parameters\\n\\n**Returns:**
        Graph nodes matching the search criteria\\n\\n**Example:**\\n```csharp\\nvar
        nodesRequest = new GraphNodesSearchRequest\\n{\\n    Query = \\\"user authentication\\\"\\n};\\n\\nvar
        response = await searchService.GraphNodesSearchAsync(nodesRequest);\\nif (response.IsSuccessful)\\n{\\n
        \   var nodes = response.Data;\\n    Console.WriteLine($\\\"Found {nodes.Nodes?.Count
        ?? 0} matching nodes\\\");\\n}\\n```\\n\\n---\\n\\n### GraphRelationsSearchAsync\\n\\nSearch
        Knowledge Box graph relations (edges).\\n\\n**Signature:**\\n```csharp\\nTask<ApiResponse<GraphRelationsSearchResponse>>
        GraphRelationsSearchAsync(GraphRelationsSearchRequest request)\\n```\\n\\n**Parameters:**\\n-
        `request` (GraphRelationsSearchRequest, required): Graph relations search
        parameters\\n\\n**Returns:** Graph relations matching the search criteria\\n\\n**Example:**\\n```csharp\\nvar
        relationsRequest = new GraphRelationsSearchRequest\\n{\\n    Query = \\\"implements\\\"\\n};\\n\\nvar
        response = await searchService.GraphRelationsSearchAsync(relationsRequest);\\nif
        (response.IsSuccessful)\\n{\\n    var relations = response.Data;\\n    Console.WriteLine($\\\"Found
        {relations.Relations?.Count ?? 0} matching relations\\\");\\n}\\n```\\n\\n---\\n\\n###
        SendFeedbackAsync\\n\\nSend feedback for a search operation to improve future
        results.\\n\\n**Signature:**\\n```csharp\\nTask<ApiResponse<object>> SendFeedbackAsync(FeedbackRequest
        request)\\n```\\n\\n**Parameters:**\\n- `request` (FeedbackRequest, required):
        Feedback data including operation ID and rating\\n\\n**Returns:** True if
        feedback was submitted successfully\\n\\n**Example:**\\n```csharp\\nvar feedbackRequest
        = new FeedbackRequest\\n{\\n    Ident = \\\"operation-123\\\",\\n    Good
        = true,\\n    Task = TaskType.Question\\n};\\n\\nvar response = await searchService.SendFeedbackAsync(feedbackRequest);\\nif
        (response.IsSuccessful)\\n{\\n    Console.WriteLine(\\\"Feedback submitted
        successfully\\\");\\n}\\n```\\n\\n---\\n\\n### SearchAsync\\n\\nSearch Knowledge
        Box and retrieve separate results for documents, paragraphs, and sentences.\\n\\n**Signature:**\\n```csharp\\nTask<ApiResponse<KnowledgeboxSearchResults>>
        SearchAsync(SearchRequest request)\\n```\\n\\n**Parameters:**\\n- `request`
        (SearchRequest, required): Comprehensive search request parameters\\n\\n**Returns:**
        Structured search results with multiple result types\\n\\n**Example:**\\n```csharp\\nvar
        searchRequest = new SearchRequest\\n{\\n    Query = \\\"API documentation\\\"\\n};\\n\\nvar
        response = await searchService.SearchAsync(searchRequest);\\nif (response.IsSuccessful)\\n{\\n
        \   var results = response.Data;\\n    Console.WriteLine($\\\"Documents: {results.Documents?.Count
        ?? 0}\\\");\\n    Console.WriteLine($\\\"Paragraphs: {results.Paragraphs?.Count
        ?? 0}\\\");\\n    Console.WriteLine($\\\"Sentences: {results.Sentences?.Count
        ?? 0}\\\");\\n}\\n```\\n\\n---\\n\\n### AskResourceAsync\\n\\nAsk a question
        to a specific resource and get a synchronous response.\\n\\n**Signature:**\\n```csharp\\nTask<ApiResponse<SyncAskResponse>>
        AskResourceAsync(string resourceId, AskRequest request)\\n```\\n\\n**Parameters:**\\n-
        `resourceId` (string, required): The unique identifier of the resource\\n-
        `request` (AskRequest, required): The ask request parameters\\n\\n**Returns:**
        Answer specific to the resource\\n\\n**Example:**\\n```csharp\\nvar askRequest
        = new AskRequest\\n{\\n    Query = \\\"What does this document explain?\\\"\\n};\\n\\nvar
        response = await searchService.AskResourceAsync(\\\"my-resource-id\\\", askRequest);\\nif
        (response.IsSuccessful)\\n{\\n    var result = response.Data;\\n    Console.WriteLine($\\\"Resource-specific
        answer: {result.Answer}\\\");\\n}\\n```\\n\\n---\\n\\n### AskResourceStreamAsync
        (with AskRequest)\\n\\nAsk a question to a specific resource and get a streaming
        response.\\n\\n**Signature:**\\n```csharp\\nIAsyncEnumerable<SyncAskResponseUpdate>
        AskResourceStreamAsync(string resourceId, AskRequest request)\\n```\\n\\n**Parameters:**\\n-
        `resourceId` (string, required): The unique identifier of the resource\\n-
        `request` (AskRequest, required): The ask request parameters\\n\\n**Returns:**
        Streaming response specific to the resource\\n\\n**Example:**\\n```csharp\\nvar
        askRequest = new AskRequest\\n{\\n    Query = \\\"Summarize this document's
        main points\\\"\\n};\\n\\nawait foreach (var update in searchService.AskResourceStreamAsync(\\\"my-resource-id\\\",
        askRequest))\\n{\\n    if (update.Item is AnswerContent answerContent && !string.IsNullOrEmpty(answerContent.Text))\\n
        \   {\\n        Console.Write(answerContent.Text);\\n    }\\n}\\n```\\n\\n---\\n\\n###
        AskResourceStreamAsync (with query string)\\n\\nAsk a question to a specific
        resource with simplified query.\\n\\n**Signature:**\\n```csharp\\nIAsyncEnumerable<SyncAskResponseUpdate>
        AskResourceStreamAsync(string resourceId, string query)\\n```\\n\\n**Parameters:**\\n-
        `resourceId` (string, required): The unique identifier of the resource\\n-
        `query` (string, required): The question to ask\\n\\n**Returns:** Streaming
        response for the resource\\n\\n**Example:**\\n```csharp\\nawait foreach (var
        update in searchService.AskResourceStreamAsync(\\\"my-resource-id\\\", \\\"What
        are the key features?\\\"))\\n{\\n    if (update.Item is AnswerContent answerContent
        && !string.IsNullOrEmpty(answerContent.Text))\\n    {\\n        Console.Write(answerContent.Text);\\n
        \   }\\n}\\n```\\n\\n---\\n\\n### AskResourceBySlugAsync\\n\\nAsk a question
        about a specific resource by slug synchronously.\\n\\n**Signature:**\\n```csharp\\nTask<ApiResponse<SyncAskResponse>>
        AskResourceBySlugAsync(string slug, AskRequest request)\\n```\\n\\n**Parameters:**\\n-
        `slug` (string, required): The slug identifier of the resource\\n- `request`
        (AskRequest, required): The ask request parameters\\n\\n**Returns:** Answer
        specific to the resource identified by slug\\n\\n**Example:**\\n```csharp\\nvar
        askRequest = new AskRequest\\n{\\n    Query = \\\"What is the purpose of this
        document?\\\"\\n};\\n\\nvar response = await searchService.AskResourceBySlugAsync(\\\"my-document-slug\\\",
        askRequest);\\nif (response.IsSuccessful)\\n{\\n    var result = response.Data;\\n
        \   Console.WriteLine($\\\"Answer: {result.Answer}\\\");\\n}\\n```\\n\\n---\\n\\n###
        PredictProxyAsync\\n\\nProxy endpoint that forwards requests to the Predict
        API with Knowledge Box configuration.\\n\\n**Signature:**\\n```csharp\\nTask<ApiResponse<JsonElement>>
        PredictProxyAsync(PredictProxiedEndpoints endpoint)\\n```\\n\\n**Parameters:**\\n-
        `endpoint` (PredictProxiedEndpoints, required): The predict endpoint to call\\n\\n**Returns:**
        Response from the predict API\\n\\n**Example:**\\n```csharp\\nvar response
        = await searchService.PredictProxyAsync(PredictProxiedEndpoints.Tokens);\\nif
        (response.IsSuccessful)\\n{\\n    var result = response.Data;\\n    Console.WriteLine($\\\"Predict
        API response: {result}\\\");\\n}\\n```\\n\\n---\\n\\n### SearchResourceAsync\\n\\nSearch
        within a specific resource by ID.\\n\\n**Signature:**\\n```csharp\\nTask<ApiResponse<ResourceSearchResults>>
        SearchResourceAsync(string resourceId, string query)\\n```\\n\\n**Parameters:**\\n-
        `resourceId` (string, required): The unique identifier of the resource\\n-
        `query` (string, required): The search query\\n\\n**Returns:** Search results
        within the specified resource\\n\\n**Example:**\\n```csharp\\nvar response
        = await searchService.SearchResourceAsync(\\\"my-resource-id\\\", \\\"configuration
        settings\\\");\\nif (response.IsSuccessful)\\n{\\n    var results = response.Data;\\n
        \   Console.WriteLine($\\\"Found {results.Total} matches in resource\\\");\\n
        \   foreach (var paragraph in results.Paragraphs ?? [])\\n    {\\n        Console.WriteLine($\\\"Match:
        {paragraph.Text}\\\");\\n    }\\n}\\n```\\n\\n## Usage Notes\\n\\n- All methods
        are asynchronous and return `ApiResponse<T>` wrappers\\n- Check `response.IsSuccessful`
        before accessing `response.Data`\\n- Streaming methods return `IAsyncEnumerable`
        for real-time response processing\\n- For streaming examples, add `using Progress.Nuclia.Model.Streaming;`
        to access `AnswerContent`\\n- Ask methods provide RAG capabilities with citations
        and source information\\n- Graph search methods enable relationship-based
        queries\\n- Resource-specific methods limit scope to individual documents\\n-
