        PAGES\\\\_PROCESSED\\n\\n\u2022 **PAGES\\\\_PROCESSED** = ``\\\"pages_processed\\\"``\\n\\n####
        Defined in\\n\\n[libs/sdk-core/src/lib/db/db.models.ts:185](https://github.com/nuclia/frontend/blob/55a20097/libs/sdk-core/src/lib/db/db.models.ts#L185)\\n\\n___\\n\\n###
        PARAGRAPHS\\\\_PROCESSED\\n\\n\u2022 **PARAGRAPHS\\\\_PROCESSED** = ``\\\"paragraphs_processed\\\"``\\n\\n####
        Defined in\\n\\n[libs/sdk-core/src/lib/db/db.models.ts:186](https://github.com/nuclia/frontend/blob/55a20097/libs/sdk-core/src/lib/db/db.models.ts#L186)\\n\\n___\\n\\n###
