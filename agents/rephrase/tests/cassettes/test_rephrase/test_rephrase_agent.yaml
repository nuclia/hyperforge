        \\n effort= low , # Can be low , medium , or high \\n budget_tokens=1024 #
        How many tokens reasoning can use \\n ), \\n ) \\n search.ask(query=query)
        \\n ``` \\n Model Support for Reasoning Options: \\n\",\"id\":\"220eb37c167f4eb9bb8e9454e7ba8cf5/t/page/1790-2276\",\"labels\":[],\"position\":{\"page_number\":0,\"index\":6,\"start\":1790,\"end\":2276,\"start_seconds\":[],\"end_seconds\":[]},\"fuzzy_result\":false,\"page_with_visual\":false,\"reference\":null,\"is_a_table\":false,\"relevant_relations\":null},\"220eb37c167f4eb9bb8e9454e7ba8cf5/t/page/2505-2709\":{\"score\":0.016666666666666666,\"score_type\":\"BM25\",\"order\":6,\"text\":\"
