        = ``\\\"media_seconds_processed\\\"``\\n\\n#### Defined in\\n\\n[libs/sdk-core/src/lib/db/db.models.ts:183](https://github.com/nuclia/frontend/blob/55a20097/libs/sdk-core/src/lib/db/db.models.ts#L183)\\n\\n___\\n\\n###
