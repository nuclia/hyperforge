        > develop > python sdk > 02 auth\",\"summary\":\"\",\"icon\":\"text/markdown\",\"thumbnail\":\"\",\"metadata\":{\"metadata\":{},\"language\":\"en\",\"languages\":[\"en\"],\"status\":\"PROCESSED\"},\"usermetadata\":{\"classifications\":[],\"relations\":[]},\"fieldmetadata\":[],\"computedmetadata\":{\"field_classifications\":[]},\"created\":\"2025-04-15T14:48:39.987690\",\"modified\":\"2026-06-09T08:08:06.772770\",\"last_seqid\":0,\"last_account_seq\":null,\"queue\":\"private\",\"hidden\":false,\"origin\":{\"source_id\":\"\",\"url\":\"https://docs.rag.progress.cloud/docs/develop/python-sdk/auth\",\"metadata\":{},\"tags\":[],\"collaborators\":[],\"filename\":\"\",\"related\":[],\"path\":\"\",\"source\":\"API\"},\"extra\":null,\"relations\":null,\"data\":{\"texts\":{\"page\":{\"value\":{\"body\":\"#
        Authentication\\n\\nIn order to start working you can login either using a
        user acount, or using an API key.\\n\\nNote: you can also login with a NUA
        key. With the right permissions/scopes, a NUA key can be used not only for
        processing features (see [NUA](07-nua.md)), but also for Knowledge Box management
        operations (list/get/create/delete) in your authorized account.\\n\\n- CLI:
        `nuclia auth nua [NUA_KEY]`\\n- SDK:\\n\\n  ```python\\n  from nuclia import
        sdk\\n  sdk.NucliaAuth().nua(NUA_KEY)\\n  ```\\n\\nFor private or on-premise
        deployments where the API endpoint differs from the token issuer, see [Custom
        API endpoint](07-nua.md#custom-api-endpoint-private-or-on-premise-deployments-only).\\n\\n##
        User authentication\\n\\nWith user authentication, there is no limitation
        to the API endpoints you can use. You manage all the accounts and Knowledge
        Boxes you have access to. It also allows to manage local NucliaDBs connected
        to your accounts.\\n\\nBut it does not last very long (30 minutes), and it
        requires a browser to complete the authentication process.\\nIt is a good
        fit for interactive use, but not for long running scripts.\\n\\n- CLI: `nuclia
        auth login`, and it will trigger a browser authentication flow, so you can
        copy/paste the token in your terminal.\\n\\n- SDK: (even if it is not recommended
        for long running scripts, user authentication can be done in the SDK)\\n\\n
        \ ```python\\n  from nuclia import sdk\\n  sdk.NucliaAuth().set_user_token(USER_TOKEN)\\n
        \ ```\\n\\n## Personal access token\\n\\nA personal access token is a long-lived
        user token that can be used to authenticate to the API. It is a good fit for
        long running scripts. It grants the same access as user authentication.\\n\\nYou
        define its expiration date (default is 90 days), and you can revoke it at
        any time.\\n\\n- CLI:\\n\\n  To generate a token, run:\\n\\n  ```sh\\n  nuclia
        auth create_personal_token --description=\\\"My token\\\" --days=30\\n  ```\\n\\n
        \ To generate a token and use it as authentication in the CLI, run:\\n\\n
        \ ```sh\\n  nuclia auth create_personal_token --description=\\\"My token\\\"
        --days=30 --login\\n  ```\\n\\n  To list the tokens, run:\\n\\n  ```sh\\n
        \ nuclia auth list_personal_tokens\\n  ```\\n\\n  To delete a token, run:\\n\\n
        \ ```sh\\n  nuclia auth delete_personal_token [TOKEN_ID]\\n  ```\\n\\n- SDK:\\n\\n
        \ ```python\\n  from nuclia import sdk\\n  sdk.NucliaAuth().create_personal_token(description=\\\"My
        token\\\", days=30)\\n  sdk.NucliaAuth().list_personal_tokens()\\n  sdk.NucliaAuth().delete_personal_token(token_id=TOKEN_ID)\\n
        \ ```\\n\\n## API key\\n\\nAn API key can be generated from the Nuclia Dashboard,
        see [Get an API key](https://docs.rag.progress.cloud/docs/guides/getting-started/quick-start/push#get-an-api-key).\\n\\nWhen
        authenticating with an API key, you can only access the Knowledge Box that
        is associated with this API key.\\nThe authentication will last as long as
        the key is valid (potentially forever, but an API key can be revoked from
        the Nuclia Dashboard).\\n\\nIt is the recommended way to authenticate for
        long running scripts.\\n\\n- CLI: `nuclia auth kb [KB_URL] [API_KEY]`\\n-
        SDK:\\n\\n  ```python\\n  from nuclia import sdk\\n  sdk.NucliaAuth().kb(url=KB_URL,
        token=API_KEY)\\n  ```\\n\\n- Provides access to NucliaDB API. For the managed
        service you will need a service token.\\n\\n## Logout\\n\\n```sh\\nnuclia
        auth logout\\n```\\n\\n## List configured user accounts, knowledge boxes and
        NUA keys\\n\\nYou can list the configured authentication mechanisms using:\\n\\n```bash\\nnuclia
        auth show\\n```\\n\",\"format\":\"MARKDOWN\",\"md5\":\"7adfd5cd16971a512ca4db72bb4047d5\",\"extract_strategy\":\"\",\"split_strategy\":\"\"},\"extracted\":{\"text\":{\"text\":\"Authentication
        \\n In order to start working you can login either using a user acount, or
        using an API key. \\n Note: you can also login with a NUA key. With the right
        permissions/scopes, a NUA key can be used not only for processing features
        (see NUA), but also for Knowledge Box management operations (list/get/create/delete)
        in your authorized account. \\n \\n CLI: nuclia auth nua [NUA_KEY] \\n SDK:
        \\n \\n python \\n from nuclia import sdk \\n sdk.NucliaAuth().nua(NUA_KEY)
        \\n For private or on-premise deployments where the API endpoint differs from
        the token issuer, see Custom API endpoint. \\n User authentication \\n With
        user authentication, there is no limitation to the API endpoints you can use.
        You manage all the accounts and Knowledge Boxes you have access to. It also
        allows to manage local NucliaDBs connected to your accounts. \\n But it does
        not last very long (30 minutes), and it requires a browser to complete the
        authentication process. \\n It is a good fit for interactive use, but not
        for long running scripts. \\n \\n \\n CLI: nuclia auth login, and it will
        trigger a browser authentication flow, so you can copy/paste the token in
        your terminal. \\n \\n \\n SDK: (even if it is not recommended for long running
        scripts, user authentication can be done in the SDK) \\n \\n \\n python \\n
        from nuclia import sdk \\n sdk.NucliaAuth().set_user_token(USER_TOKEN) \\n
        Personal access token \\n A personal access token is a long-lived user token
        that can be used to authenticate to the API. It is a good fit for long running
        scripts. It grants the same access as user authentication. \\n You define
        its expiration date (default is 90 days), and you can revoke it at any time.
        \\n \\n CLI: \\n \\n To generate a token, run: \\n sh \\n nuclia auth create_personal_token
        --description= My token --days=30 \\n To generate a token and use it as authentication
        in the CLI, run: \\n sh \\n nuclia auth create_personal_token --description=
        My token --days=30 --login \\n To list the tokens, run: \\n sh \\n nuclia
        auth list_personal_tokens \\n To delete a token, run: \\n sh \\n nuclia auth
        delete_personal_token [TOKEN_ID] \\n \\n SDK: \\n \\n python \\n from nuclia
        import sdk \\n sdk.NucliaAuth().create_personal_token(description= My token
        , days=30) \\n sdk.NucliaAuth().list_personal_tokens() \\n sdk.NucliaAuth().delete_personal_token(token_id=TOKEN_ID)
        \\n API key \\n An API key can be generated from the Nuclia Dashboard, see
        Get an API key. \\n When authenticating with an API key, you can only access
        the Knowledge Box that is associated with this API key. \\n The authentication
        will last as long as the key is valid (potentially forever, but an API key
        can be revoked from the Nuclia Dashboard). \\n It is the recommended way to
        authenticate for long running scripts. \\n \\n CLI: nuclia auth kb [KB_URL]
        [API_KEY] \\n SDK: \\n \\n python \\n from nuclia import sdk \\n sdk.NucliaAuth().kb(url=KB_URL,
        token=API_KEY) \\n \\n Provides access to NucliaDB API. For the managed service
        you will need a service token. \\n \\n Logout \\n sh \\n nuclia auth logout
