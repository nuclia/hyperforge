        \\n \\n Maximum supported input tokens: \\n Description: The maximum number
        of tokens that the model can accept as input. Be mindful that this takes into
        account the tokens used in the prompt, query and context. Also take note that
        some models may provide their context window as the total between input and
        output tokens, while others may provide it as the input tokens only. \\n\",\"id\":\"89cc367c149e4f6eab0e06a743d1edba/t/page/2202-2575\",\"labels\":[\"/k/text\"],\"position\":{\"page_number\":0,\"index\":8,\"start\":2202,\"end\":2575,\"start_seconds\":[],\"end_seconds\":[]},\"fuzzy_result\":false,\"page_with_visual\":false,\"reference\":null,\"is_a_table\":false,\"relevant_relations\":null},\"89cc367c149e4f6eab0e06a743d1edba/t/page/2804-3043\":{\"score\":0.015151515151515152,\"score_type\":\"VECTOR\",\"order\":13,\"text\":\"
