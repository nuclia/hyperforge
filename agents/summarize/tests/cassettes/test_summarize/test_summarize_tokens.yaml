        > ingestion > how to > split strategies\",\"summary\":\"\",\"icon\":\"text/markdown\",\"thumbnail\":\"\",\"metadata\":{\"metadata\":{},\"language\":\"en\",\"languages\":[\"en\"],\"status\":\"PROCESSED\"},\"usermetadata\":{\"classifications\":[],\"relations\":[]},\"fieldmetadata\":[],\"computedmetadata\":{\"field_classifications\":[]},\"created\":\"2025-09-12T08:39:42.634556\",\"modified\":\"2025-09-12T08:39:42.634566\",\"last_seqid\":0,\"last_account_seq\":null,\"queue\":\"private\",\"hidden\":false,\"origin\":{\"source_id\":\"\",\"url\":\"https://docs.rag.progress.cloud/docs/ingestion/how-to/split-strategies\",\"metadata\":{},\"tags\":[],\"collaborators\":[],\"filename\":\"\",\"related\":[],\"path\":\"\",\"source\":\"API\"},\"extra\":null,\"relations\":null,\"data\":{\"texts\":{\"page\":{\"value\":{\"body\":\"---\\nid:
        split-strategies\\ntitle: Use split strategies\\n---\\n\\n# Split strategies\\n\\nIn
        some cases, default chunking methods aren't enough to handle the complexity
        of your data.\\nImagine working with dense technical documentation, splitting
        it effectively can make a big difference in how well the information is indexed
        and retrieved.\\n\\nTo address this, you can define a split strategy that
        controls how content is broken into chunks during ingestion.\\nSplit strategies
        are reusable and configurable, allowing you to tailor the chunking process
        to your specific needs.\\n\\nOnce defined, these strategies can be applied
        across multiple ingestion jobs, giving you flexibility and consistency in
        how your data is processed.\\n\\n## What is a split strategy?\\n\\nA split
        strategy is a reusable configuration that defines how your data is divided
        into chunks during ingestion. By customizing a split strategy, you can optimize
        chunking for different types of content and use cases.\\n\\nKey components
        of a split strategy include:\\n\\n- **Max paragraph size**: Sets the maximum
        size (in characters or tokens) for each chunk.\\n- **Custom split**: Determines
        the method used for splitting:\\n  - **Manual splitting**: Splits content
        based on a specified delimiter (default is `\\\"\\\\n\\\"`).\\n  - **LLM splitting**:
        Uses a language model to segment text intelligently, with optional rules to
        guide the process.\\n\\nNote that you can only choose one splitting method
        per strategy, and that you will have to set custom_split to 1 for manual splitting
        or 2 for LLM splitting.\\n\\n## LLM Splitting\\n\\nLLM splitting leverages
        a language model to intelligently segment text into meaningful chunks, going
        beyond simple character or line-based splitting. This approach is ideal when
        you need context-aware chunking, such as dividing content by sections, topics,
        or other logical boundaries.\\n\\nYou can enable LLM splitting with default
        settings, or customize it for your specific needs using these parameters:\\n\\n-
        **LLM**: Specify the language model in the **generative_model** field. Optionally,
        provide credentials for your chosen LLM provider in **user_keys**.\\n- **Rules**:
        Define natural language instructions to guide how the text should be split.
        For example, you might use rules like \\\"Split at each section heading\\\"
        or \\\"Separate lists into individual items\\\".\\n\\nExample configuration:\\n\\n```json\\n{\\n
        \       \\\"name\\\": \\\"llm\\\",\\n        \\\"max_paragraph\\\": 1000,\\n
        \       \\\"custom_split\\\": 2, \\n        \\\"llm_split\\\": {\\n            \\\"llm\\\":
        {\\n                \\\"generative_model\\\": \\\"chatgpt-azure-4o-mini\\\",\\n
        \           },\\n            \\\"rules\\\": [\\n                \\\"Split
        at each section heading\\\"\\n            ]\\n        },\\n    }\\n```\\n\\nExperiment
        with different rules and models to optimize chunking for your use case. Note
        that using an LLM may increase processing time and cost, and could slightly
        alter the extracted text.\\n\\n## Manual Splitting\\nManual splitting divides
        text based on a specified delimiter, making it straightforward and efficient
        for simpler chunking needs. This method is particularly useful when your content
        has clear, consistent separators, such as paragraphs or bullet points.\\nYou
        can customize manual splitting using the following parameters:\\n- **Splitter**:
        Choose the character or string that indicates where to split the text. The
        default is a double newline character (`\\\"\\\\n\\\\n\\\"`), but you can
        set it to any delimiter that suits your content structure.\\nExample configuration:\\n\\n```json\\n
        {\\n        \\\"name\\\": \\\"manual\\\",\\n        \\\"custom_split\\\":
        1,\\n        \\\"manual_split\\\": {\\n            \\\"splitter\\\": \\\"\\\\n\\\"\\n
        \       }\\n    }\\n``` \\n\\n## Strategy creation and management\\n\\nBefore
        we can use a split strategy, we need to create it. We can create as many strategies
        as we want, and just use the right one for each processing job. Once created
        we can not modify our strategies, but we can delete them and inspect the ones
        we have created for a given kb.\\n\\n### Dashboard\\n\\nTo create a strategy,
        just go to the section **AI Models** and then to **Extract & split**. Then
        you can click on the button **Create configuration** , next to **Split configurations**
        to create a new strategy. Once there, you can fill in the necessary fields
        with the desired configuration.\\nIn the same section, you can also see the
        list of strategies you have created, and you can delete them once you no longer
        need them.\\n\\n### CLI\\n\\nTo create a strategy using the CLI, you can use
        the command `nuclia kb split_strategies add` with the desired configuration
        in JSON format. You can also list the strategies you have created with `nuclia
        kb split_strategies list`, and delete them with `nuclia kb split_strategies
        delete`.\\n\\n```bash\\nnuclia kb split_strategies add --config='{\\\"name\\\":\\\"strategy1\\\",\\\"custom_split\\\":
        1,\\\"manual_split\\\": {\\\"splitter\\\": \\\"\\\\n\\\"}}'\\nnuclia kb split_strategies
        list\\nnuclia kb split_strategies delete --id=1361c0c7-918a-4a7f-b44b-ba37437619fb\\n```\\n\\n###
        SDK\\n\\nTo create a strategy using the SDK, you can use the `add` method
        of the `split_strategies` object, passing the desired configuration in JSON
        format. You can also list the strategies you have created with the `list`
        method, and delete them with the `delete` method.\\n\\n```python\\nfrom nuclia
        import sdk\\nsplit_strategies = sdk.NucliaKB().split_strategies\\nprint(split_strategies.list())\\nid
        = split_strategies.add(config='{\\\"name\\\":\\\"strategy1\\\",\\\"custom_split\\\":
        1,\\\"manual_split\\\": {\\\"splitter\\\": \\\"\\\\n\\\"}}')\\nsplit_strategies.delete(id=id)\\n```\\n\\n##
        Use split strategies for processing\\n\\n### Dashboard\\n\\nTo use a split
        strategy for processing documents, just upload the document normally, enable
        **Customize data extraction** and select the strategy you want to use in the
        dropdown menu. Once the document is uploaded, it will be processed using the
        selected strategy.\\n\\n### CLI\\n\\nTo use a split strategy for processing
        documents using the CLI, you can use the command `nuclia kb upload file` with
        the `--split_strategy` option, passing the ID of the strategy you want to
        use.\\n\\n```bash\\nnuclia kb upload file --path=FILE_PATH --split_strategy=1361c0c7-918a-4a7f-b44b-ba37437619fb\\n```\\n\\n```bash\\nnuclia
        kb upload file --path=FILE_PATH --split_strategy=1361c0c7-918a-4a7f-b44b-ba37437619fb\\n```\\n\\n###
        SDK\\n\\nTo use a split strategy for processing documents using the SDK, you
        can use the `file` method of the `NucliaUpload` object, passing the path to
        the file and the ID of the strategy you want to use.\\n\\n```python\\nfrom
        nuclia import sdk\\nupload = sdk.NucliaUpload()\\nupload.file(path=FILE_PATH,
        split_strategy=\\\"1361c0c7-918a-4a7f-b44b-ba37437619fb\\\")\\n```\\n\",\"format\":\"MARKDOWN\",\"md5\":\"834cf2c7e30daced272772d79b257cf0\",\"extract_strategy\":\"\",\"split_strategy\":\"\"},\"extracted\":{\"text\":{\"text\":\"
