        output tokens, while others may provide it as the input tokens only. \\n\",\"id\":\"89cc367c149e4f6eab0e06a743d1edba/t/page/2202-2575\",\"labels\":[\"/k/text\"],\"position\":{\"page_number\":0,\"index\":8,\"start\":2202,\"end\":2575,\"start_seconds\":[],\"end_seconds\":[]},\"fuzzy_result\":false,\"page_with_visual\":false,\"reference\":null,\"is_a_table\":false,\"relevant_relations\":null},\"89cc367c149e4f6eab0e06a743d1edba/t/page/2804-3043\":{\"score\":0.014705882352941176,\"score_type\":\"VECTOR\",\"order\":15,\"text\":\"
