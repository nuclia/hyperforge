        \u2022 **Docs**\\n\\n***\\n\\n[@nuclia/core](../globals.md) / UsageType\\n\\n#
        Enumeration: UsageType\\n\\n## Enumeration Members\\n\\n### AI\\\\_TOKENS\\\\_USED\\n\\n>
        **AI\\\\_TOKENS\\\\_USED**: `\\\"ai_tokens_used\\\"`\\n\\n#### Defined in\\n\\n[libs/sdk-core/src/lib/db/db.models.ts:206](https://github.com/nuclia/frontend/blob/1e7e9064a81e1644471a9bfef71b91388bff2cd1/libs/sdk-core/src/lib/db/db.models.ts#L206)\\n\\n***\\n\\n###
