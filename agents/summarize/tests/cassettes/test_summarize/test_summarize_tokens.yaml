        \\n Parameters \\n \u2022 payload?: any \\n Optional payload to provide extra
        data for the token generation \\n \u2022 ignoreExpiration?: boolean = false
        \\n Optional By default, a temp token is valid for 5min and the same token
        returned if this method is called several times during this time. \\n\",\"id\":\"828a119645574efd908c8ecb5ee6c013/t/page/34400-34802\",\"labels\":[\"/k/text\"],\"position\":{\"page_number\":0,\"index\":67,\"start\":34400,\"end\":34802,\"start_seconds\":[],\"end_seconds\":[]},\"fuzzy_result\":false,\"page_with_visual\":false,\"reference\":null,\"is_a_table\":false,\"relevant_relations\":null}}}}},\"220eb37c167f4eb9bb8e9454e7ba8cf5\":{\"id\":\"220eb37c167f4eb9bb8e9454e7ba8cf5\",\"slug\":\"docs-develop-python-sdk-05-search-md\",\"title\":\"docs
        > develop > python sdk > 05 search\",\"summary\":\"\",\"icon\":\"text/markdown\",\"thumbnail\":\"\",\"metadata\":{\"metadata\":{},\"language\":\"en\",\"languages\":[\"en\"],\"status\":\"PROCESSED\"},\"usermetadata\":{\"classifications\":[],\"relations\":[]},\"fieldmetadata\":[],\"computedmetadata\":{\"field_classifications\":[]},\"created\":\"2025-04-15T14:48:33.723913\",\"modified\":\"2025-09-18T11:01:18.918196\",\"last_seqid\":0,\"last_account_seq\":null,\"queue\":\"private\",\"hidden\":false,\"origin\":{\"source_id\":\"\",\"url\":\"https://docs.rag.progress.cloud/docs/develop/python-sdk/search\",\"metadata\":{},\"tags\":[],\"collaborators\":[],\"filename\":\"\",\"related\":[],\"path\":\"\",\"source\":\"API\"},\"extra\":null,\"relations\":null,\"data\":{\"texts\":{\"page\":{\"value\":{\"body\":\"#
        Search and answer generation\\n\\n## Search\\n\\nNuclia supports 2 different
        search endpoints:\\n\\n- `search`: returns several result sets according the
        different search techniques (full-text, fuzzy, semantic).\\n- `find`: returns
        a single result set where all different results are merged into a hierarchical
        structure.\\n\\nBoth endpoints support the same query parameters.\\n\\n- CLI:\\n\\n
        \ ```bash\\n  nuclia kb search search --query=\\\"My search\\\"\\n  nuclia
        kb search find --query=\\\"My search\\\" --filters=\\\"['/icon/application/pdf','/classification.labels/region/Asia']\\\"\\n
        \ ```\\n\\n- SDK:\\n\\n  ```python\\n  from nuclia import sdk\\n  search =
        sdk.NucliaSearch()\\n  search.search(query=\\\"My search\\\", filters=['/icon/application/pdf',
        '/classification.labels/region/Asia'])\\n  search.find(query=\\\"My search\\\")\\n
        \ ```\\n\\nGet JSON output:\\n\\n```bash\\nnuclia kb search find --query=\\\"My
        search\\\" --json\\n```\\n\\nGet YAML output:\\n\\n```bash\\nnuclia kb search
        search --query=\\\"My search\\\" --yaml\\n```\\n\\n## Generative answer\\n\\nBased
        on a `find` request, Nuclia uses a generative AI to answer the question based
        on the context without hallucinations and with the find result and relations.\\n\\n-
        CLI:\\n\\n  ```bash\\n  nuclia kb search ask --query=\\\"My question\\\"\\n
        \ ```\\n\\n- SDK:\\n\\n  ```python\\n  from nuclia import sdk\\n  search =
        sdk.NucliaSearch()\\n  search.ask(query=\\\"My question\\\")\\n  ```\\n\\n
        \ You can also use the `AskRequest` item to configure the request with all
        the parameters supported:\\n\\n  ```python\\n  from nuclia import sdk\\n  from
        nucliadb_models.search import AskRequest\\n\\n  search = sdk.NucliaSearch()\\n
        \ query = AskRequest(query=\\\"My question\\\", prefer_markdown=True, citations=True)\\n
        \ search.ask(query=query)\\n  ```\\n\\n### Reasoning\\n\\nSome LLMs support
        reasoning. In some models, reasoning is enabled by default, while in others
        it must be explicitly requested. You can control this behavior using the reasoning
        parameter.\\n\\n- SDK:\\n\\n  ```python\\n  from nuclia import sdk\\n  from
        nucliadb_models.search import AskRequest, Reasoning\\n\\n  search = sdk.NucliaSearch()\\n
        \ query = AskRequest(\\n    query=\\\"My question with extra reasoning effort\\\",\\n
        \   max_tokens=5000,\\n    reasoning=Reasoning(\\n        display=True,      #
        Show reasoning in the response\\n        effort=\\\"low\\\",      # Can be
        \\\"low\\\", \\\"medium\\\", or \\\"high\\\"\\n        budget_tokens=1024
        # How many tokens reasoning can use\\n    ),\\n  )\\n  search.ask(query=query)\\n
        \ ```\\n\\nModel Support for Reasoning Options:\\n\\n* **OpenAI models** \u2192
        support `effort` only.\\n* **Google & Anthropic models** \u2192 support `budget_tokens`
        only.\\n\\n:::tip\\nIf you send just one of these values (`effort` or `budget_tokens`),
        Nuclia will automatically fill in the other for you.\\n:::\\n\\n:::warning\\n*
        Enabling reasoning can use additional tokens, which may increase your usage
        costs.\\n* You may need to increase `max_tokens` to give the LLM enough room
        to reason and generate an answer.\\n:::\\n\\n## Filtering\\n\\nAny endpoint
        that involves search (`search`, `find` and `ask`) also support more advanced
        filtering expressions. Expressions can have one of the following operators:\\n\\n-
        `all`: this is the default. Will make search return results containing all
        specified filter labels.\\n- `any`: returns results containing at least one
        of the labels.\\n- `none`: returns results that do not contain any of the
        labels.\\n- `not_all`: returns results that do not contain all specified labels.\\n\\nNote
        that multiple expressions can be chained in the `filters` parameter and the
        conjunction of all of them will be computed.\\n\\nHere are some examples:\\n\\n-
        CLI:\\n\\n  ```bash\\n  nuclia kb search find --query=\\\"My search\\\" --filters=\\\"[{'any':['/icon/application/pdf','/icon/image/mp4']}]\\\"\\n
        \ ```\\n\\n- SDK:\\n\\n  ```python\\n  from nuclia import sdk\\n  from nucliadb_models.search
        import Filter\\n\\n  search = sdk.NucliaSearch()\\n  search.ask(\\n    query=\\\"My
        question\\\",\\n    filters=[Filter(any=['/classification.labels/region/Europe','/classification.labels/region/Asia'])],\\n
        \ )\\n  ```\\n\\n## Using RAG strategies\\n\\nRAG strategies can be used to
        improve the quality of the answers by extending the search results passed
        to the LLM as context.\\n\\n- CLI:\\n\\n  ```bash\\n  nuclia kb search ask
        --query=\\\"My question\\\" --rag_strategies='[{\\\"name\\\":\\\"hierarchy\\\"}]'\\n
        \ ```\\n\\n- SDK:\\n\\n  ```python\\n  from nuclia import sdk\\n  search =
        sdk.NucliaSearch()\\n  search.ask(query=\\\"My question\\\", rag_strategies=[{\\\"name\\\":
        \\\"hierarchy\\\"}])\\n  ```\\n\\nSee the [RAG strategies documentation](https://docs.rag.progress.cloud/docs/rag/rag-strategy)
        for more information.\\n\\n## Complex queries\\n\\nThe Python SDK allows to
        use all the options supported by the `/find` and `/ask` endpoints,\\nbut not
        all of the options can be passed as specific parameter.\\nIn these cases,
        you can just pass your query as a dictionnary in the `query` parameter.\\n\\n-
        CLI:\\n\\n  ```bash\\n  nuclia kb search find --query='{\\\"query\\\": \\\"My
        search\\\", \\\"filters\\\": [\\\"/icon/application/pdf\\\", \\\"/classification.labels/region/Asia\\\"]}'\\n
        \ nuclia kb search ask --query='{\\\"query\\\": \\\"My search\\\",\\\"top_k\\\":
        5}'\\n  ```\\n\\n- SDK:\\n\\n  ```python\\n  from nuclia import sdk\\n  search
        = sdk.NucliaSearch()\\n  search.find(query={\\\"query\\\": \\\"My search\\\",
        \\\"filters\\\": [\\\"/icon/application/pdf\\\", \\\"/classification.labels/region/Asia\\\"]})\\n
        \ search.ask(query={\\\"query\\\": \\\"My search\\\",\\\"top_k\\\": 5})\\n
        \ ```\\n\\n## Graph queries\\n\\nThe Python SDK allows graph queries supported
        by the `/graph` endpoint. Although\\na bit cumbersome, the knowledge graph
        can be queried as in this example:\\n\\n- CLI:\\n\\n  ```bash\\n  nuclia kb
        search graph --query='{\\\"query\\\": {\\\"prop\\\": \\\"path\\\", \\\"source\\\":
        {\\\"value\\\": \\\"Rust\\\"}, \\\"destination\\\": {\\\"value\\\": \\\"Python\\\"}}}'\\n
        \ ```\\n\\n- SDK:\\n\\n  ```python\\n  from nuclia import sdk\\n  search =
        sdk.NucliaSearch()\\n  search.graph(\\n      query={\\n          \\\"query\\\":
        {\\n              \\\"prop\\\": \\\"path\\\",\\n              \\\"source\\\":
        {\\\"value\\\": \\\"Rust\\\"},\\n              \\\"destination\\\": {\\\"value\\\":
        \\\"Python\\\"}\\n          }\\n      }\\n  )\\n  ```\\n\\nFor more information
        about graph querying, please refer to [Nuclia's graph\\ndoc](https://docs.rag.progress.cloud/docs/rag/advanced/graph)
        or the [API reference](https://docs.rag.progress.cloud/docs/api#tag/Search/operation/graph_search_knowledgebox_kb__kbid__graph_post)\\n\",\"format\":\"MARKDOWN\",\"md5\":\"57ed2bd023399aee08015a57a948ebf2\",\"extract_strategy\":\"\",\"split_strategy\":\"\"},\"extracted\":{\"text\":{\"text\":\"Search
        and answer generation \\n Search \\n Nuclia supports 2 different search endpoints:
        \\n \\n search: returns several result sets according the different search
        techniques (full-text, fuzzy, semantic). \\n find: returns a single result
        set where all different results are merged into a hierarchical structure.
        \\n \\n Both endpoints support the same query parameters. \\n \\n CLI: \\n
        \\n bash \\n nuclia kb search search --query= My search \\n nuclia kb search
        find --query= My search --filters= ['/icon/application/pdf','/classification.labels/region/Asia']
        \\n \\n SDK: \\n \\n python \\n from nuclia import sdk \\n search = sdk.NucliaSearch()
        \\n search.search(query= My search , filters=['/icon/application/pdf', '/classification.labels/region/Asia'])
        \\n search.find(query= My search ) \\n Get JSON output: \\n bash \\n nuclia
        kb search find --query= My search --json \\n Get YAML output: \\n bash \\n
        nuclia kb search search --query= My search --yaml \\n Generative answer \\n
        Based on a find request, Nuclia uses a generative AI to answer the question
        based on the context without hallucinations and with the find result and relations.
        \\n \\n CLI: \\n \\n bash \\n nuclia kb search ask --query= My question \\n
        \\n SDK: \\n \\n python \\n from nuclia import sdk \\n search = sdk.NucliaSearch()
        \\n search.ask(query= My question ) \\n You can also use the AskRequest item
        to configure the request with all the parameters supported: \\n ```python
        \\n from nuclia import sdk \\n from nucliadb_models.search import AskRequest
        \\n search = sdk.NucliaSearch() \\n query = AskRequest(query= My question
        , prefer_markdown=True, citations=True) \\n search.ask(query=query) \\n ```
        \\n Reasoning \\n Some LLMs support reasoning. In some models, reasoning is
        enabled by default, while in others it must be explicitly requested. You can
        control this behavior using the reasoning parameter. \\n \\n SDK: \\n \\n
        ```python \\n from nuclia import sdk \\n from nucliadb_models.search import
        AskRequest, Reasoning \\n search = sdk.NucliaSearch() \\n query = AskRequest(
        \\n query= My question with extra reasoning effort , \\n max_tokens=5000,
        \\n reasoning=Reasoning( \\n display=True, # Show reasoning in the response
        \\n effort= low , # Can be low , medium , or high \\n budget_tokens=1024 #
        How many tokens reasoning can use \\n ), \\n ) \\n search.ask(query=query)
        \\n ``` \\n Model Support for Reasoning Options: \\n \\n OpenAI models \u2192
        support effort only. \\n Google & Anthropic models \u2192 support budget_tokens
        only. \\n \\n :::tip \\n If you send just one of these values (effort or budget_tokens),
        Nuclia will automatically fill in the other for you. \\n ::: \\n :::warning
        \\n Enabling reasoning can use additional tokens, which may increase your
        usage costs. \\n You may need to increase max_tokens to give the LLM enough
        room to reason and generate an answer. \\n ::: \\n Filtering \\n Any endpoint
        that involves search (search, find and ask) also support more advanced filtering
        expressions. Expressions can have one of the following operators: \\n \\n
        all: this is the default. Will make search return results containing all specified
        filter labels. \\n any: returns results containing at least one of the labels.
        \\n none: returns results that do not contain any of the labels. \\n not_all:
        returns results that do not contain all specified labels. \\n \\n Note that
        multiple expressions can be chained in the filters parameter and the conjunction
        of all of them will be computed. \\n Here are some examples: \\n \\n CLI:
        \\n \\n bash \\n nuclia kb search find --query= My search --filters= [{'any':['/icon/application/pdf','/icon/image/mp4']}]
        \\n \\n SDK: \\n \\n ```python \\n from nuclia import sdk \\n from nucliadb_models.search
        import Filter \\n search = sdk.NucliaSearch() \\n search.ask( \\n query= My
        question , \\n filters=[Filter(any=['/classification.labels/region/Europe','/classification.labels/region/Asia'])],
        \\n ) \\n ``` \\n Using RAG strategies \\n RAG strategies can be used to improve
        the quality of the answers by extending the search results passed to the LLM
        as context. \\n \\n CLI: \\n \\n bash \\n nuclia kb search ask --query= My
        question --rag_strategies='[{ name : hierarchy }]' \\n \\n SDK: \\n \\n python
        \\n from nuclia import sdk \\n search = sdk.NucliaSearch() \\n search.ask(query=
        My question , rag_strategies=[{ name : hierarchy }]) \\n See the RAG strategies
        documentation for more information. \\n Complex queries \\n The Python SDK
        allows to use all the options supported by the /find and /ask endpoints, \\n
        but not all of the options can be passed as specific parameter. \\n In these
        cases, you can just pass your query as a dictionnary in the query parameter.
        \\n \\n CLI: \\n \\n bash \\n nuclia kb search find --query='{ query : My
        search , filters : [ /icon/application/pdf , /classification.labels/region/Asia
        ]}' \\n nuclia kb search ask --query='{ query : My search , top_k : 5}' \\n
        \\n SDK: \\n \\n python \\n from nuclia import sdk \\n search = sdk.NucliaSearch()
        \\n search.find(query={ query : My search , filters : [ /icon/application/pdf
        , /classification.labels/region/Asia ]}) \\n search.ask(query={ query : My
        search , top_k : 5}) \\n Graph queries \\n The Python SDK allows graph queries
        supported by the /graph endpoint. Although \\n a bit cumbersome, the knowledge
        graph can be queried as in this example: \\n \\n CLI: \\n \\n bash \\n nuclia
        kb search graph --query='{ query : { prop : path , source : { value : Rust
        }, destination : { value : Python }}}' \\n \\n SDK: \\n \\n python \\n from
        nuclia import sdk \\n search = sdk.NucliaSearch() \\n search.graph( \\n query={
        \\n query : { \\n prop : path , \\n source : { value : Rust }, \\n destination
        : { value : Python } \\n } \\n } \\n ) \\n For more information about graph
        querying, please refer to Nuclia's graph \\n doc or the API reference\",\"split_text\":{},\"deleted_splits\":[]},\"metadata\":{\"metadata\":{\"links\":[],\"paragraphs\":[{\"start\":0,\"end\":305,\"start_seconds\":[],\"end_seconds\":[],\"kind\":\"TEXT\",\"classifications\":[],\"sentences\":[{\"start\":0,\"end\":200,\"key\":\"\"},{\"start\":200,\"end\":305,\"key\":\"\"}]},{\"start\":305,\"end\":550,\"start_seconds\":[],\"end_seconds\":[],\"kind\":\"TEXT\",\"classifications\":[],\"sentences\":[{\"start\":308,\"end\":362,\"key\":\"\"},{\"start\":362,\"end\":550,\"key\":\"\"}]},{\"start\":550,\"end\":774,\"start_seconds\":[],\"end_seconds\":[],\"kind\":\"TEXT\",\"classifications\":[],\"sentences\":[{\"start\":551,\"end\":774,\"key\":\"\"}]},{\"start\":774,\"end\":1091,\"start_seconds\":[],\"end_seconds\":[],\"kind\":\"TEXT\",\"classifications\":[],\"sentences\":[{\"start\":775,\"end\":1091,\"key\":\"\"}]},{\"start\":1091,\"end\":1361,\"start_seconds\":[],\"end_seconds\":[],\"kind\":\"TEXT\",\"classifications\":[],\"sentences\":[{\"start\":1094,\"end\":1361,\"key\":\"\"}]},{\"start\":1361,\"end\":1790,\"start_seconds\":[],\"end_seconds\":[],\"kind\":\"TEXT\",\"classifications\":[],\"sentences\":[{\"start\":1362,\"end\":1630,\"key\":\"\"},{\"start\":1630,\"end\":1728,\"key\":\"\"},{\"start\":1728,\"end\":1790,\"key\":\"\"}]},{\"start\":1790,\"end\":2276,\"start_seconds\":[],\"end_seconds\":[],\"kind\":\"TEXT\",\"classifications\":[],\"sentences\":[{\"start\":1793,\"end\":2276,\"key\":\"\"}]},{\"start\":2276,\"end\":2505,\"start_seconds\":[],\"end_seconds\":[],\"kind\":\"TEXT\",\"classifications\":[],\"sentences\":[{\"start\":2279,\"end\":2318,\"key\":\"\"},{\"start\":2318,\"end\":2378,\"key\":\"\"},{\"start\":2378,\"end\":2505,\"key\":\"\"}]},{\"start\":2505,\"end\":2709,\"start_seconds\":[],\"end_seconds\":[],\"kind\":\"TEXT\",\"classifications\":[],\"sentences\":[{\"start\":2506,\"end\":2610,\"key\":\"\"},{\"start\":2610,\"end\":2709,\"key\":\"\"}]},{\"start\":27