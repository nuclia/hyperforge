        Defined in\\n\\n[libs/sdk-core/src/lib/db/kb/kb.ts:368](https://github.com/nuclia/frontend/blob/f1e43b7ed1446e3c0e98b96653673062f734a3f2/libs/sdk-core/src/lib/db/kb/kb.ts#L368)\\n\\n####
