        \     }\\n    }\\n    ```\\n  </TabItem>\\n</Tabs>\\n\\n### Understanding
        Token Types\\n\\n**Normalized Tokens** (`normalized_tokens`):\\n- These represent
        the number of Agentic RAG tokens consumed and that you will be billed for\\n-
        Values are normalized across different LLM providers for consistent billing\\n-
        Include separate counts for:\\n  - `input`: Tokens used for the prompt, context,
        and question\\n  - `output`: Tokens used for the generated response\\n  -
        `image`: Tokens used for image processing (when applicable)\\n\\n**Customer
        Key Tokens** (`customer_key_tokens`):\\n- These represent tokens consumed
