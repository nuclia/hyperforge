      is Marklogic?\n\n<START OF CONTEXT>\n\nContext:\n\n**block-AA**\n\n## Chunk:
      Database Platform to Simplify Complex Data | Progress Marklogic\nURLs: https://www.progress.com/marklogic\n```
      Unlock data value, accelerate insightful decisions, and securely achieve data
      agility with the MarkLogic data platform.\nCombine your data with everything
      known about it (metadata) in a single service and reveal smarter decisions faster.\n...\n##
      The Single Platform that Unlocks Data AgilityleGet a faster, trusted way to
      securely connect data and metadata, create and interpret meaning, and consume
      high-quality contextualized data across the enterprise with the MarkLogic data
      platform.\n...\n## Achieve Data Agility With a Single Data PlatformtoDon\u2019t
      waste time stitching together components.\nMarkLogic combines the power of a
      multi-model\u202fdatabase, search, and semantic AI in a single platform with
      mastering, metadata management,\u202fgovernment-grade security and more.\nContact
      Us ```\n\n\n---\"\n\n\n**block-AB**\n\n## Chunk: Overview of MarkLogic Server\nURLs:
      https://docs.progress.com/bundle/marklogic-server-understand-concepts-12/page/topics/overview.html\n```
      MarkLogic is a database designed from the ground up to make massive quantities
      of heterogenous data easily accessible through search.\n...\nMarkLogic fuses
      together database internals, search-style indexing, and application server behaviors
      into a unified system.\nIt uses XML and JSON documents as its data model, and
      stores the documents within a transactional repository.\nIt indexes the words
      and values from each of the loaded documents, as well as the document structure.\nAnd,
      because of its unique Universal Index, MarkLogic does not require advance knowledge
      of the document structure and adherence to a particular schema.\nThrough its
      application server capabilities, it is programmable and extensible.\nMarkLogic
      clusters on commodity hardware using a shared-nothing architecture and supports
      massive scale, high-availability, and very high performance. ```\n\n\n---\"\n\n\n**block-AC**\n\n##
      Chunk: [PDF] MARKLOGIC SERVER - Progress Software\nURLs: https://www.progress.com/docs/default-source/marklogic-docs/inside-marklogic-server.pdf?sfvrsn=243546da_8\n```
      WHAT IS MARKLOGIC SERVER?\nMarkLogic Server is the Enterprise NoSQL Database1
      that combines database \ninternals, search-style indexing, and application server
      behaviors into a unified system.\nIt is a multi-model database management system
      (DBMS) that combines a document \nmodel with a semantic triple model.\nIt stores
      all of its data within a fully ACID-\ncompliant transactional repository.\nIt
      indexes the words and values from each of the \nloaded documents, as well as
      the document structure.\nBecause of its unique Universal \nIndex, MarkLogic
      doesn''t require advance knowledge of the document structure (its \n\"schema\")
      nor complete adherence to a particular schema.\nAnd through its application
      \nserver capabilities, it''s programmable and extensible.\nMarkLogic Server
      (referred to from here on as \"MarkLogic\") clusters on commodity \nhardware
      using a shared-nothing architecture and differentiates itself in the market
      \nby supporting massive scale and exceptional performance, all while maintaining
      the \nenterprise capabilities required for mission-critical applications.\n...\n\u201c\n\u201c
      MarkLogic is a document-centric, multi-model, \ntransactional, search-enabled,
      structure-aware, \nschema-agnostic, programmable,  \nhigh-performance, clustered
      database server.\u201d\n1  ```\n\n\n---\"\n\n\n**block-AD**\n\n## Chunk: MarkLogic
      FAQs - Progress Software\nURLs: https://www.progress.com/marklogic/faqs\n```
      MarkLogic provides a semantic data platform that lets you connect, create and
      consume all types of data, ready for immediate use by informed search, contextual
      applications, grounded analytics and facts-based intelligence.\nThe platform
      is purpose-built with a multi-model database and semantic AI technology to provide
      a comprehensive data layer with strong security, integration, scale and with
      configuration choices of a semantic knowledge graph, as a data hub or as metadata
      management.\n...\nMarkLogic solves complex data problems.\nAlmost every organization
      is facing challenges in managing and getting value from data because of data
      and knowledge silos.\nOur platform eliminates the effect of these silos and
      delivers data agility by coupling data with its meaning and definitions.\n...\nMarkLogic
      Data Hub is a unified solution for integrating and managing your multi-structured
      data.\n...\nMarkLogic Server is an enterprise-grade multi-model database.\nIt
      is designed with both modern NoSQL and trusted enterprise capabilities to power
      transactional, operational, and analytical applications.\n...\nBroadly speaking,
      MarkLogic is used to make high-quality, unified, contextualized data available
      for immediate use by informed search, contextual applications, grounded analytics
      and facts-based intelligence..\nThe platform can be configured as a semantic
      knowledge graph, a data hub, or metadata management.\n...\nWe are a data platform
      company, not an application software company.\nThat said, our solutions engineers
      and consultants can work with you to develop the applications that your business
      needs or to serve up integrated data to applications you already use, like BI
      tools or GIS. ```\n\n\n---\"\n\n\n**block-AE**\n\n## Chunk: MarkLogic Overview
      Datasheet\nURLs: https://www.progress.com/docs/default-source/marklogic-docs/marklogic-overview-datasheet.pdf\n```
      MarkLogic Overview\nData integration.\nSimplified.\nData integration is one
      of the most complex IT challenges \nand the MarkLogic Data Hub Platform simplifies
      it.\nMarkLogic removes friction at every step in the process so \nthat organizations
      can achieve a 360\u00ba view faster than ever.\n...\nWith \nMarkLogic, it only
      takes days or weeks \u2013 not months or years \n\u2013 to integrate data and
      build secure data services that enable\nIT to keep pace with the speed of business.\nThe
      MarkLogic Data Hub Platform\nThe MarkLogic Data Hub is a comprehensive data
      platform that excels at multi-model data integration.\nIt enables you to load
      \ndata as is, curate that data to form a unified, actionable 360\u00b0 view
      \u2013 and provide easy ways to access that 360\u00b0 view.\nDocuments,\ngraphs,
      relational data \u2013 it handles it all at enterprise scale and security.\n...\nengine,
      ETL tools, mastering capability, and more \u2013 all \naccessible through a
      simple user interface.\n...\n\u2022 Advanced security \u2013 MarkLogic is the
      most secure \nmulti-model database, having the most granular security \ncontrols
      and highest level of certifications.\n...\nMarkLogic is a trademark or registered
      trademark of MarkLogic Corporation in the United States and/or other\ncountries.\n...\nMARKLOGIC
      CORPORATION  \n999 Skyway Road, Suite 200 San Carlos, CA 94070   \n+1 650 655
      2300  |  +1 877 992 8885  |  www.marklogic.com  |  sales@marklogic.com\nThe
      MarkLogic Data Hub Platform\n...\nMarkLogic Data Hub Service is a fully automated
      cloud service that allows you to focus on your business and leave database \ninfrastructure
      and operations to the experts at MarkLogic.\n...\nAbout MarkLogic\nBy simplifying
      data integration, MarkLogic helps organizations gain agility, lower IT costs,
      and safely share their data.\nHeadquartered in Silicon Valley, MarkLogic has
      offices throughout the U.S., Europe, Asia, and Australia.\nACCESS ```\n\n\n---\"\n\n\n\n\n<END
