      string: "{\"id\":\"6403a6a1-498d-446a-a3d0-87396e4df5ae\",\"results\":[{\"date\":\"2025-09-13\",\"last_updated\":\"2026-05-30\",\"snippet\":\"#
        The #1 Agentic RAG-as-a-Service\\n...\\nDeploy AI Agents seamlessly with Nuclia,
        the only RAG platform specifically designed to deliver reliable and scalable
        retrieval functionalities to AI Agents.\\n...\\nWith Nuclia, access RAG, AI
        Search, and generative answers from your data.\\nCustomize AI classification,
        document summarization, LLMs, prompts, and Named Entity Recognition.\\n...\\nNuclia
        automatically delivers\\n** AI search** and **Generative Answers** on top
        of your unstructured data, and provides knowledge in the form of trusted answers,
        in any language, and from any data.\\n...\\nNuclia is ultra-focused on delivering
        exceptional AI capabilities for data.\\nIn addition to offering RAG, with
        Nuclia, you\u2019ll be able to harness AI Search and generative answers from
        your data.\\nYou can also create your own AI classification, personalize document
        summarization, utilize different LLMs, define prompts, and obtain Named Entity
        Recognition for your data.\\n...\\nNuclia\u2019s capabilities rely on NucliaDB,
        the open-source AI search database.\\nData is stored in your own NucliaDB
        instance, 100% isolated from other instances, that acts as a centralized knowledge
        repository which can power diverse AI applications for your unstructured data.\",\"title\":\"Nuclia
        | The AI Search and RAG as a Service platform\",\"url\":\"https://nuclia.com\"},{\"date\":\"2023-03-12\",\"last_updated\":\"2026-05-05\",\"snippet\":\"Today,
        we are thrilled to present something we\u2019ve been putting all our passion
        into search, AI, development, and open-source.\\nPlease meet Nuclia, the API
        that makes the unsearchable, searchable.\\n### But what is Nuclia exactly?\\n...\\nNuclia
        is an end-to-end API that enables developers to integrate AI-powered search
        for any data and source.\\nIt uses AI and Natural Language Processing to extract
        value from unstructured data in minutes.\\nNuclia API is capable of connecting
        to any data source and automatically indexing its content, regardless of format
        or language.\\nThat way, companies can perform multilingual semantic searches
        on their entire unstructured data set, turning unstructured data into knowledge
        while owning their data.\\nNuclia enables developers to integrate AI-powered
        search by normalising unstructured data, including video and audio content,
        and extracting value using its Natural Language Processing (NLP).\\nWe have
        developed and released NucliaDB, the first open-source vector database designed
        for unstructured data to store all this information.\\nNucliaDB lets teams
        use their own vectorisation and normalisation algorithms while providing storage,
        indexing, and querying.\\nUsing NucliaDB unlocks vector, keyword, and relation
        search\u2014core requirements when dealing with unstructured data.\",\"title\":\"World,
        meet Nuclia Nuclia, meet the world | Making the unsearchable, searchable.\",\"url\":\"https://nuclia.com/building-nuclia/first-release/\"},{\"date\":\"2022-01-04\",\"last_updated\":\"2026-04-05\",\"snippet\":\"#
        Nuclia, the a RAG as a Service platform for developers\\nNuclia is a RAG-as-a-Service
        API that focuses on normalising unstructured data from different sources,
        in different formats and different languages to provide multi-language semantic
        search and Generative Answers on top of it using multiple LLMs.\",\"title\":\"Nuclia,
        the a RAG as a Service platform for developers\",\"url\":\"https://nuclia.com/developers/\"}]}\n"
