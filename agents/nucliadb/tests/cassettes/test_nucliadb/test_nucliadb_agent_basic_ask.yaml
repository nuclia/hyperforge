        The Smart Agent plans the answer: picks the most appropriate sources, splits
        the question into sub-questions, evaluates relevancy, and iterates autonomously
        until the information is sufficient. \\n Basic usage \\n To set up a Smart
        Agent, declare all the sources you want to use (Knowledge Boxes, Perplexity,
        etc.) in the Sources section of the left menu. Then, create a new workflow
        in the Workflows section and add a Smart Agent in the Retrieval step. \\n\",\"labels\":[],\"start_seconds\":null,\"end_seconds\":null,\"position\":{\"page_number\":0,\"index\":1,\"start\":373,\"end\":825},\"fuzzy_result\":false},{\"score\":0.0,\"rid\":\"b28e388104644fc5bba68c0cd44e01d4\",\"field_type\":\"t\",\"field\":\"page\",\"text\":\"
        Chat mode \\n If you want to use the Smart Agent in a chat interface, you
        need the following: \\n \\n Enable the Session history option in the Smart
        Agent configuration. This will allow the Smart Agent to take into account
        the previous conversation when planning its next steps. \\n\",\"labels\":[],\"start_seconds\":null,\"end_seconds\":null,\"position\":{\"page_number\":0,\"index\":7,\"start\":2167,\"end\":2442},\"fuzzy_result\":false},{\"score\":0.0,\"rid\":\"b28e388104644fc5bba68c0cd44e01d4\",\"field_type\":\"t\",\"field\":\"page\",\"text\":\"
        Then connect your sources as Registered Agents to the Smart Agent. It is very
        important that you provide an extensive description of each registered agent,
        so that the Smart Agent can understand what each source is about and when
        to use it. \\n\",\"labels\":[],\"start_seconds\":null,\"end_seconds\":null,\"position\":{\"page_number\":0,\"index\":2,\"start\":825,\"end\":1068},\"fuzzy_result\":false},{\"score\":0.0,\"rid\":\"b28e388104644fc5bba68c0cd44e01d4\",\"field_type\":\"t\",\"field\":\"page\",\"text\":\"
        \\n reactive: The Smart Agent will decide what to do first, and will plan
        the next steps based on the information it retrieves. It is expected to be
