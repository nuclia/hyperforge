        \\n \\n Maximum supported input tokens: \\n Description: The maximum number
        of tokens that the model can accept as input. Be mindful that this takes into
        account the tokens used in the prompt, query and context. Also take note that
        some models may provide their context window as the total between input and
        output tokens, while others may provide it as the input tokens only. \\n\",\"id\":\"89cc367c149e4f6eab0e06a743d1edba/t/page/2202-2575\",\"labels\":[\"/k/text\"],\"position\":{\"page_number\":0,\"index\":0,\"start\":2202,\"end\":2575,\"start_seconds\":[],\"end_seconds\":[]},\"fuzzy_result\":false,\"page_with_visual\":false,\"is_a_table\":false},\"89cc367c149e4f6eab0e06a743d1edba/t/page/2804-3043\":{\"score\":0.025323061272501945,\"score_type\":\"RERANKER\",\"order\":13,\"text\":\"
        Description: The maximum number of tokens that the model can generate as output.
        Again, we should keep in mind that this value summed to the Maximum supported
        input tokens should not exceed the total context size supported by the model.
        \\n\",\"id\":\"89cc367c149e4f6eab0e06a743d1edba/t/page/2804-3043\",\"labels\":[\"/k/text\"],\"position\":{\"page_number\":0,\"index\":0,\"start\":2804,\"end\":3043,\"start_seconds\":[],\"end_seconds\":[]},\"fuzzy_result\":false,\"page_with_visual\":false,\"is_a_table\":false},\"89cc367c149e4f6eab0e06a743d1edba/t/page/2575-2804\":{\"score\":0.015306354500353336,\"score_type\":\"RERANKER\",\"order\":15,\"text\":\"
        Example: For Phi 4 Reasoning Plus, the total context size is 32768 tokens,
        as we want to leave room for the output, we will set the maximum supported
        input tokens as 32768 - 1024 = 31744. \\n \\n \\n Maximum supported output
        tokens: \\n\",\"id\":\"89cc367c149e4f6eab0e06a743d1edba/t/page/2575-2804\",\"labels\":[\"/k/text\"],\"position\":{\"page_number\":0,\"index\":0,\"start\":2575,\"end\":2804,\"start_seconds\":[],\"end_seconds\":[]},\"fuzzy_result\":false,\"page_with_visual\":false,\"is_a_table\":false}}}}},\"220eb37c167f4eb9bb8e9454e7ba8cf5\":{\"id\":\"220eb37c167f4eb9bb8e9454e7ba8cf5\",\"slug\":\"docs-develop-python-sdk-05-search-md\",\"title\":\"docs
