        > rag > advanced > openai api compatible models\",\"summary\":\"\",\"icon\":\"text/markdown\",\"thumbnail\":\"\",\"metadata\":{\"metadata\":{},\"language\":\"en\",\"languages\":[\"en\"],\"status\":\"PROCESSED\"},\"usermetadata\":{\"classifications\":[],\"relations\":[]},\"fieldmetadata\":[],\"computedmetadata\":{\"field_classifications\":[]},\"created\":\"2025-05-23T07:21:32.894218\",\"modified\":\"2025-08-27T15:33:06.862963\",\"last_seqid\":0,\"queue\":\"private\",\"hidden\":false,\"fields\":{\"/t/page\":{\"paragraphs\":{\"89cc367c149e4f6eab0e06a743d1edba/t/page/2804-3043\":{\"score\":0.16762705147266388,\"score_type\":\"RERANKER\",\"order\":4,\"text\":\"
        Description: The maximum number of tokens that the model can generate as output.
        Again, we should keep in mind that this value summed to the Maximum supported
        input tokens should not exceed the total context size supported by the model.
        \\n\",\"id\":\"89cc367c149e4f6eab0e06a743d1edba/t/page/2804-3043\",\"labels\":[\"/k/text\"],\"position\":{\"page_number\":0,\"index\":0,\"start\":2804,\"end\":3043,\"start_seconds\":[],\"end_seconds\":[]},\"fuzzy_result\":false,\"page_with_visual\":false,\"is_a_table\":false},\"89cc367c149e4f6eab0e06a743d1edba/t/page/2202-2575\":{\"score\":0.12400070577859879,\"score_type\":\"RERANKER\",\"order\":8,\"text\":\"
        \\n \\n Maximum supported input tokens: \\n Description: The maximum number
        of tokens that the model can accept as input. Be mindful that this takes into
        account the tokens used in the prompt, query and context. Also take note that
        some models may provide their context window as the total between input and
        output tokens, while others may provide it as the input tokens only. \\n\",\"id\":\"89cc367c149e4f6eab0e06a743d1edba/t/page/2202-2575\",\"labels\":[\"/k/text\"],\"position\":{\"page_number\":0,\"index\":0,\"start\":2202,\"end\":2575,\"start_seconds\":[],\"end_seconds\":[]},\"fuzzy_result\":false,\"page_with_visual\":false,\"is_a_table\":false},\"89cc367c149e4f6eab0e06a743d1edba/t/page/3043-3250\":{\"score\":0.03527754917740822,\"score_type\":\"RERANKER\",\"order\":14,\"text\":\"
        Example: For Phi 4 Reasoning Plus, the maximum output tokens is specified
        at 32768, but we already reserved 31744 for the input tokens, so we will set
        this to 32768 - 31744 = 1024. \\n \\n \\n \\n Model Features: \\n\",\"id\":\"89cc367c149e4f6eab0e06a743d1edba/t/page/3043-3250\",\"labels\":[\"/k/text\"],\"position\":{\"page_number\":0,\"index\":0,\"start\":3043,\"end\":3250,\"start_seconds\":[],\"end_seconds\":[]},\"fuzzy_result\":false,\"page_with_visual\":false,\"is_a_table\":false}}}}},\"9f7036a7a6694700b72d52eb58a8326c\":{\"id\":\"9f7036a7a6694700b72d52eb58a8326c\",\"slug\":\"docs-rag-advanced-widget-features-md\",\"title\":\"docs
        > rag > advanced > widget > features\",\"summary\":\"\",\"icon\":\"text/markdown\",\"thumbnail\":\"\",\"metadata\":{\"metadata\":{},\"language\":\"en\",\"languages\":[\"en\"],\"status\":\"PROCESSED\"},\"usermetadata\":{\"classifications\":[],\"relations\":[]},\"fieldmetadata\":[],\"computedmetadata\":{\"field_classifications\":[]},\"created\":\"2024-07-18T14:32:26.204740\",\"modified\":\"2025-10-27T14:35:08.325400\",\"last_seqid\":0,\"queue\":\"private\",\"hidden\":false,\"fields\":{\"/t/page\":{\"paragraphs\":{\"9f7036a7a6694700b72d52eb58a8326c/t/page/5203-5412\":{\"score\":0.28656837344169617,\"score_type\":\"RERANKER\",\"order\":2,\"text\":\"
        max_tokens: the maximum number of input tokens to put in the final context
        (including the prompt, the retrieved results and the user question). \\n max_output_tokens:
        the maximum number of tokens to generate. \\n\",\"id\":\"9f7036a7a6694700b72d52eb58a8326c/t/page/5203-5412\",\"labels\":[],\"position\":{\"page_number\":0,\"index\":0,\"start\":5203,\"end\":5412,\"start_seconds\":[],\"end_seconds\":[]},\"fuzzy_result\":false,\"page_with_visual\":false,\"is_a_table\":false}}}}},\"4039d76b0fff4962900836ab3fdec9f7\":{\"id\":\"4039d76b0fff4962900836ab3fdec9f7\",\"slug\":\"docs-rag-advanced-consumption-mdx\",\"title\":\"docs
        > rag > advanced > consumption.\",\"summary\":\"\",\"icon\":\"text/markdown\",\"thumbnail\":\"\",\"metadata\":{\"metadata\":{},\"language\":\"en\",\"languages\":[\"en\"],\"status\":\"PROCESSED\"},\"usermetadata\":{\"classifications\":[],\"relations\":[]},\"fieldmetadata\":[],\"computedmetadata\":{\"field_classifications\":[]},\"created\":\"2025-10-03T08:32:26.341394\",\"modified\":\"2026-05-26T09:20:08.504451\",\"last_seqid\":0,\"queue\":\"private\",\"hidden\":false,\"fields\":{\"/t/page\":{\"paragraphs\":{\"4039d76b0fff4962900836ab3fdec9f7/t/page/3075-3340\":{\"score\":0.9133679866790771,\"score_type\":\"RERANKER\",\"order\":0,\"text\":\"
        Use the max_tokens parameter on the /ask endpoint to set hard limits on: \\n
        - Context size: Limits the amount of retrieved information sent to the LLM
        \\n - Answer length: Limits the length of the generated response \\n Important
        Considerations \\n Context Limitations: \\n\",\"id\":\"4039d76b0fff4962900836ab3fdec9f7/t/page/3075-3340\",\"labels\":[],\"position\":{\"page_number\":0,\"index\":0,\"start\":3075,\"end\":3340,\"start_seconds\":[],\"end_seconds\":[]},\"fuzzy_result\":false,\"page_with_visual\":false,\"is_a_table\":false},\"4039d76b0fff4962900836ab3fdec9f7/t/page/3340-4136\":{\"score\":0.10875558853149414,\"score_type\":\"RERANKER\",\"order\":9,\"text\":\"
        - Restricting context size may result in less relevant answers since the LLM
        has less information to work with \\n - Balance between cost control and answer
        quality \\n Answer Length Limitations: \\n - The LLM might not complete its
        response if it hits the token limit, potentially cutting sentences mid-way
        \\n - Recommended approach: Include length requirements in your prompt (e.g.,
        Please answer in less than 200 words ) rather than relying solely on hard
        limits \\n - This allows the LLM to naturally conclude its response within
        the desired length \\n How to Monitor Token Consumption \\n Understanding
        Token Consumption Data \\n You can receive detailed token consumption information
        from the following endpoints that utilize LLM models: ask, chat, remi, query,
        sentence, summarize, tokens, and rerank. \\n\",\"id\":\"4039d76b0fff4962900836ab3fdec9f7/t/page/3340-4136\",\"labels\":[\"/k/text\"],\"position\":{\"page_number\":0,\"index\":0,\"start\":3340,\"end\":4136,\"start_seconds\":[],\"end_seconds\":[]},\"fuzzy_result\":false,\"page_with_visual\":false,\"is_a_table\":false},\"4039d76b0fff4962900836ab3fdec9f7/t/page/1650-2326\":{\"score\":0.027272669598460197,\"score_type\":\"RERANKER\",\"order\":18,\"text\":\"
        \\n Large context: Results from using RAG strategies like Full resource or
        Neighbouring paragraphs , or from using the extra_context parameter \\n Long
        questions: More detailed or complex questions require more input tokens \\n
        Long prompts: Extensive system prompts increase the input token count \\n
        Detailed answers: Comprehensive responses require more output tokens \\n Images
        in context: When using multimodal models, images included in the retrieved
        context significantly increase token consumption \\n \\n How to Limit and
        Control Token Consumption \\n Strategy 1: Optimize Your Parameters \\n The
        first approach to reducing token consumption is to fine-tune your request
        parameters: \\n\",\"id\":\"4039d76b0fff4962900836ab3fdec9f7/t/page/1650-2326\",\"labels\":[\"/k/text\"],\"position\":{\"page_number\":0,\"index\":0,\"start\":1650,\"end\":2326,\"start_seconds\":[],\"end_seconds\":[]},\"fuzzy_result\":false,\"page_with_visual\":false,\"is_a_table\":false}}}}},\"50aac6f34b6d47de8e3b01f8b2de6e9c\":{\"id\":\"50aac6f34b6d47de8e3b01f8b2de6e9c\",\"slug\":\"docs-develop-js-sdk-interfaces-PredictAnswerOptions-md\",\"title\":\"docs
