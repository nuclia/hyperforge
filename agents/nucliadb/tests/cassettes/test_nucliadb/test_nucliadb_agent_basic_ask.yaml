        > ingestion > how to > split strategies\",\"summary\":\"\",\"icon\":\"text/markdown\",\"thumbnail\":\"\",\"metadata\":{\"metadata\":{},\"language\":\"en\",\"languages\":[\"en\"],\"status\":\"PROCESSED\"},\"usermetadata\":{\"classifications\":[],\"relations\":[]},\"fieldmetadata\":[],\"computedmetadata\":{\"field_classifications\":[]},\"created\":\"2025-09-12T08:39:42.634556\",\"modified\":\"2026-06-09T08:18:07.009807\",\"last_seqid\":0,\"queue\":\"private\",\"hidden\":false,\"fields\":{\"/t/page\":{\"paragraphs\":{\"1cf976a5ca5947cd89a2f2a047b71ce9/t/page/963-1239\":{\"score\":0.003736220533028245,\"score_type\":\"RERANKER\",\"order\":15,\"text\":\"
        Key components of a split strategy include: \\n \\n Max paragraph size: Sets
        the maximum size (in characters or tokens) for each chunk. \\n Custom split:
        Determines the method used for splitting: \\n Manual splitting: Splits content
        based on a specified delimiter (default is \\\\n ). \\n\",\"id\":\"1cf976a5ca5947cd89a2f2a047b71ce9/t/page/963-1239\",\"labels\":[],\"position\":{\"page_number\":0,\"index\":0,\"start\":963,\"end\":1239,\"start_seconds\":[],\"end_seconds\":[]},\"fuzzy_result\":false,\"page_with_visual\":false,\"is_a_table\":false}}}}},\"4039d76b0fff4962900836ab3fdec9f7\":{\"id\":\"4039d76b0fff4962900836ab3fdec9f7\",\"slug\":\"docs-rag-advanced-consumption-mdx\",\"title\":\"docs
        > rag > advanced > consumption.\",\"summary\":\"\",\"icon\":\"text/markdown\",\"thumbnail\":\"\",\"metadata\":{\"metadata\":{},\"language\":\"en\",\"languages\":[\"en\"],\"status\":\"PROCESSED\"},\"usermetadata\":{\"classifications\":[],\"relations\":[]},\"fieldmetadata\":[],\"computedmetadata\":{\"field_classifications\":[]},\"created\":\"2025-10-03T08:32:26.341394\",\"modified\":\"2026-06-09T08:18:16.730959\",\"last_seqid\":0,\"queue\":\"private\",\"hidden\":false,\"fields\":{\"/t/page\":{\"paragraphs\":{\"4039d76b0fff4962900836ab3fdec9f7/t/page/3075-3340\":{\"score\":0.32756075263023376,\"score_type\":\"RERANKER\",\"order\":0,\"text\":\"
        Use the max_tokens parameter on the /ask endpoint to set hard limits on: \\n
        - Context size: Limits the amount of retrieved information sent to the LLM
        \\n - Answer length: Limits the length of the generated response \\n Important
        Considerations \\n Context Limitations: \\n\",\"id\":\"4039d76b0fff4962900836ab3fdec9f7/t/page/3075-3340\",\"labels\":[],\"position\":{\"page_number\":0,\"index\":0,\"start\":3075,\"end\":3340,\"start_seconds\":[],\"end_seconds\":[]},\"fuzzy_result\":false,\"page_with_visual\":false,\"is_a_table\":false},\"4039d76b0fff4962900836ab3fdec9f7/t/page/1650-2326\":{\"score\":0.0012793075293302536,\"score_type\":\"RERANKER\",\"order\":18,\"text\":\"
        \\n Large context: Results from using RAG strategies like Full resource or
        Neighbouring paragraphs , or from using the extra_context parameter \\n Long
        questions: More detailed or complex questions require more input tokens \\n
        Long prompts: Extensive system prompts increase the input token count \\n
        Detailed answers: Comprehensive responses require more output tokens \\n Images
        in context: When using multimodal models, images included in the retrieved
        context significantly increase token consumption \\n \\n How to Limit and
        Control Token Consumption \\n Strategy 1: Optimize Your Parameters \\n The
        first approach to reducing token consumption is to fine-tune your request
        parameters: \\n\",\"id\":\"4039d76b0fff4962900836ab3fdec9f7/t/page/1650-2326\",\"labels\":[\"/k/text\"],\"position\":{\"page_number\":0,\"index\":0,\"start\":1650,\"end\":2326,\"start_seconds\":[],\"end_seconds\":[]},\"fuzzy_result\":false,\"page_with_visual\":false,\"is_a_table\":false}}}}},\"220eb37c167f4eb9bb8e9454e7ba8cf5\":{\"id\":\"220eb37c167f4eb9bb8e9454e7ba8cf5\",\"slug\":\"docs-develop-python-sdk-05-search-md\",\"title\":\"docs
        > develop > python sdk > 05 search\",\"summary\":\"\",\"icon\":\"text/markdown\",\"thumbnail\":\"\",\"metadata\":{\"metadata\":{},\"language\":\"en\",\"languages\":[\"en\"],\"status\":\"PROCESSED\"},\"usermetadata\":{\"classifications\":[],\"relations\":[]},\"fieldmetadata\":[],\"computedmetadata\":{\"field_classifications\":[]},\"created\":\"2025-04-15T14:48:33.723913\",\"modified\":\"2026-06-09T08:08:04.866092\",\"last_seqid\":0,\"queue\":\"private\",\"hidden\":false,\"fields\":{\"/t/page\":{\"paragraphs\":{\"220eb37c167f4eb9bb8e9454e7ba8cf5/t/page/1790-2276\":{\"score\":0.05910154804587364,\"score_type\":\"RERANKER\",\"order\":3,\"text\":\"
        \\n SDK: \\n \\n ```python \\n from nuclia import sdk \\n from nucliadb_models.search
        import AskRequest, Reasoning \\n search = sdk.NucliaSearch() \\n query = AskRequest(
        \\n query= My question with extra reasoning effort , \\n max_tokens=5000,
        \\n reasoning=Reasoning( \\n display=True, # Show reasoning in the response
        \\n effort= low , # Can be low , medium , or high \\n budget_tokens=1024 #
        How many tokens reasoning can use \\n ), \\n ) \\n search.ask(query=query)
        \\n ``` \\n Model Support for Reasoning Options: \\n\",\"id\":\"220eb37c167f4eb9bb8e9454e7ba8cf5/t/page/1790-2276\",\"labels\":[],\"position\":{\"page_number\":0,\"index\":0,\"start\":1790,\"end\":2276,\"start_seconds\":[],\"end_seconds\":[]},\"fuzzy_result\":false,\"page_with_visual\":false,\"is_a_table\":false},\"220eb37c167f4eb9bb8e9454e7ba8cf5/t/page/2505-2709\":{\"score\":0.04560694471001625,\"score_type\":\"RERANKER\",\"order\":5,\"text\":\"
        ::: \\n :::warning \\n Enabling reasoning can use additional tokens, which
        may increase your usage costs. \\n You may need to increase max_tokens to
        give the LLM enough room to reason and generate an answer. \\n\",\"id\":\"220eb37c167f4eb9bb8e9454e7ba8cf5/t/page/2505-2709\",\"labels\":[],\"position\":{\"page_number\":0,\"index\":0,\"start\":2505,\"end\":2709,\"start_seconds\":[],\"end_seconds\":[]},\"fuzzy_result\":false,\"page_with_visual\":false,\"is_a_table\":false}}}}},\"43004f553e534ffe9c9e735856bd9b23\":{\"id\":\"43004f553e534ffe9c9e735856bd9b23\",\"slug\":\"docs-develop-js-sdk-interfaces-ModelConfig-md\",\"title\":\"docs
