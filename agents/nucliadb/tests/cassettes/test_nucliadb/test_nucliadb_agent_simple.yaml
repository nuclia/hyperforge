        \ more output tokens \\n Images in context: When using multimodal models,\
        \ images included in the retrieved context significantly increase token consumption\
        \ \\n \\n How to Limit and Control Token Consumption \\n Strategy 1: Optimize\
        \ Your Parameters \\n The first approach to reducing token consumption is\
        \ to fine-tune your request parameters: \\n \\n Optimize prompts: Ensure your\
        \ prompts are concise and focused, avoiding unnecessary verbosity \\n Control\
        \ resource scope: When using the Full resource strategy, use the count attribute\
        \ to limit the number of resources returned \\n Tune neighboring context:\
        \ For the Neighbouring paragraphs strategy, optimize the before and after\
        \ attributes to balance context quality with token efficiency \\n Manage summary\
        \ length: When using the Hierarchical strategy, ensure that resource summaries\
        \ are appropriately sized \\n Choose efficient models: Select LLMs that offer\
        \ better token efficiency (typically, ChatGPT 4o-mini is more cost-effective\
        \ than ChatGPT 4o) \\n \\n Strategy 2: Set Hard Limits \\n You can implement\
        \ safeguards against excessive token consumption: \\n Use the max_tokens parameter\
        \ on the /ask endpoint to set hard limits on: \\n - Context size: Limits the\
        \ amount of retrieved information sent to the LLM \\n - Answer length: Limits\
        \ the length of the generated response \\n Important Considerations \\n Context\
        \ Limitations: \\n - Restricting context size may result in less relevant\
        \ answers since the LLM has less information to work with \\n - Balance between\
        \ cost control and answer quality \\n Answer Length Limitations: \\n - The\
        \ LLM might not complete its response if it hits the token limit, potentially\
        \ cutting sentences mid-way \\n - Recommended approach: Include length requirements\
        \ in your prompt (e.g., Please answer in less than 200 words ) rather than\
        \ relying solely on hard limits \\n - This allows the LLM to naturally conclude\
        \ its response within the desired length \\n How to Monitor Token Consumption\
        \ \\n Understanding Token Consumption Data \\n You can receive detailed token\
        \ consumption information from the following endpoints that utilize LLM models:\
        \ ask, chat, remi, query, sentence, summarize, tokens, and rerank. \\n :::note\
        \ \\n The rephrase endpoint currently does not support token consumption monitoring.\
        \ \\n ::: \\n To receive token consumption data, you must include the following\
        \ header in your request: \\n X-SHOW-CONSUMPTION: true \\n The token consumption\
        \ data is provided in different formats depending on the response type: \\\
        n - Streaming responses (application/x-ndjson): Token consumption appears\
        \ as a separate JSON chunk with type consumption \\n - Standard responses\
        \ (application/json): Token consumption is included in a consumption field\
        \ within the main response \\n Token Consumption Response Format \\n \\n \\\
        n json \\n { \\n item : { \\n type : consumption , \\n normalized_tokens :\
        \ { \\n input : 13, \\n output : 34, \\n image : 0.0 \\n }, \\n customer_key_tokens\
        \ : { \\n input : 0.0, \\n output : 0.0, \\n image : 0.0 \\n } \\n } \\n }\
        \ \\n \\n \\n json \\n { \\n consumption : { \\n normalized_tokens : { \\\
        n input : 13, \\n output : 34, \\n image : 0.0 \\n }, \\n customer_key_tokens\
        \ : { \\n input : 0.0, \\n output : 0.0, \\n image : 0.0 \\n } \\n } \\n }\
        \ \\n \\n \\n Understanding Token Types \\n Normalized Tokens (normalized_tokens):\
        \ \\n - These represent the number of Agentic RAG tokens consumed and that\
        \ you will be billed for \\n - Values are normalized across different LLM\
        \ providers for consistent billing \\n - Include separate counts for: \\n\
        \ - input: Tokens used for the prompt, context, and question \\n - output:\
        \ Tokens used for the generated response \\n - image: Tokens used for image\
        \ processing (when applicable) \\n Customer Key Tokens (customer_key_tokens):\
        \ \\n - These represent tokens consumed when using your own LLM API keys \\\
        n - These tokens are not billed by Agentic RAG since you're using your own\
        \ API keys \\n - Values are also normalized for comparison purposes across\
        \ different providers\",\"split_text\":{},\"deleted_splits\":[]},\"metadata\"\
