        nfrom nuclia.exceptions import RaoAPIException\\n\\nagent = NucliaAgent()\\\
        n\\ntry:\\n    for response in agent.interact(question=\\\"Hello?\\\"):\\\
        n        if response.exception:\\n            print(f\\\"Agent error: {response.exception.detail}\\\
        \")\\n        elif response.answer:\\n            print(response.answer)\\\
        nexcept RaoAPIException as e:\\n    print(f\\\"API error: {e.detail}\\\")\\\
        nexcept Exception as e:\\n    print(f\\\"Unexpected error: {e}\\\")\\n```\\\
        n\\n### Passing Custom Headers to MCP\\n\\nIf your Retrieval Agents Orchestrator\
        \ requires custom headers for MCP Agents, you can pass them as follows:\\\
        n\\n**CLI:**\\n```bash\\nnuclia agent interact \\\"What is AI?\\\" --headers\
        \ '{\\\"X-Custom-Header\\\": \\\"value\\\"}'\\n```\\n\\n**SDK:**\\n```python\\\
