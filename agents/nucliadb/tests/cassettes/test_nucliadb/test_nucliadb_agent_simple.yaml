        \u2022 **Docs**\\n\\n***\\n\\n[@nuclia/core](../globals.md) / ChatOptions\\n\\n#
        Interface: ChatOptions\\n\\n## Extends\\n\\n- [`BaseSearchOptions`](BaseSearchOptions.md)\\n\\n##
