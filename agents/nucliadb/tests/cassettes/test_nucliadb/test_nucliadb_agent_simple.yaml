        n\\n```python\\nfrom nuclia.sdk.agent import NucliaAgent\\n\\nagent = NucliaAgent()\\\
        n\\n# Iterate over all messages\\nfor message in agent.interact(\\n    question=\\\
        \"What is RAO?\\\"\\n):\\n    # message is an AragAnswer object with all raw\
        \ data\\n    print(f\\\"Operation: {message.operation}\\\")\\n    print(f\\\
        \"Raw message: {message.model_dump_json(indent=2)}\\\")\\n```\\n\\nThis gives\
        \ you direct access to all websocket message data for debugging or custom\
        \ processing.\\n\\n## Advanced Features\\n\\n### Agent Feedback Requests\\\
        n\\nAgents can request additional input from users during processing:\\n\\\
        n```python\\nfrom nuclia.sdk.agent import NucliaAgent\\nfrom nuclia_models.agent.interaction\
        \ import AnswerOperation\\n\\nagent = NucliaAgent()\\ngenerator = agent.interact(question=\\\
