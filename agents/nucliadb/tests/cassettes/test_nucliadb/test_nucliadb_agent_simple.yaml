        Retrieval Agents Orchestrator\\n\\nInteract with Nuclia's Retrieval Agents
        Orchestrator to have intelligent conversations over several knowledge sources
        with persistent session management and real-time streaming responses.\\n\\n##
        Prerequisites\\n\\nInstall the Nuclia SDK:\\n\\n```sh\\npip install nuclia\\n```\\n\\nEnsure
        you have:\\n- A valid Nuclia authentication token (see [Authentication](02-auth.md))\\n-
        Access to a configured Retrieval Agent\\n\\n## Overview\\n\\nThe nuclia.py
        library provides several ways to interact with your Retrieval Agents Orchestrators:\\n\\n-
        **Interactive CLI**: A rich, user-friendly terminal interface (recommended)\\n-
        **Standard CLI**: Direct access to raw websocket messages for debugging\\n-
        **Session Management**: Create and manage persistent conversation sessions\\n-
        **Programmatic API**: Python SDK for building custom applications\\n\\n\\n##
        Listing Available Agents\\n\\nDiscover what Retrieval Agents Orchestrators
        you have access to.\\n\\n- CLI:\\n\\n  ```sh\\n  nuclia agents list\\n  ```\\n\\n-
        SDK:\\n\\n  ```python\\n  from nuclia.sdk.agents import NucliaAgents\\n\\n
        \ agents = NucliaAgents()\\n  all_agents = agents.list()\\n\\n  for agent
        in all_agents:\\n      print(f\\\"Agent: {agent.title} ({agent.id})\\\")\\n
        \     print(f\\\"  Slug: {agent.slug}\\\")\\n      print(f\\\"  Zone: {agent.zone}\\\")\\n
        \ ```\\n\\n### Getting a Specific Agent\\n\\n- CLI:\\n\\n  ```sh\\n  nuclia
        agents get --account=\\\"my-account\\\" --id=\\\"agent-uuid\\\" --zone=\\\"europe-1\\\"\\n
        \ ```\\n\\n- SDK:\\n\\n  ```python\\n  from nuclia.sdk.agents import NucliaAgents\\n\\n
        \ agents = NucliaAgents()\\n  agent_details = agents.get(\\n      account=\\\"my-account\\\",\\n
        \     id=\\\"agent-uuid\\\",\\n      zone=\\\"europe-1\\\"\\n  )\\n  print(agent_details)\\n
        \ ```\\n\\n### Setting a Default Agent\\n\\n- CLI:\\n\\n  ```sh\\n  nuclia
        agents default [AGENT_SLUG or AGENT_UUID]\\n  ```\\n\\n- SDK:\\n\\n  ```python\\n
        \ from nuclia.sdk.agents import NucliaAgents\\n\\n  agents = NucliaAgents()\\n
        \ agents.default(\\\"my-agent\\\")\\n  ```\\n\\nThis sets the default agent
        for all subsequent operations.\\n\\n## Interactive CLI (Recommended)\\n\\nThe
        interactive CLI provides a beautiful, real-time interface for conversing with
        your Retrieval Agents Orchestrator.\\n\\n### Starting the Interactive CLI\\n\\n-
        CLI:\\n\\n  ```sh\\n  nuclia agent cli interact\\n  ```\\n\\n- SDK:\\n\\n
        \ ```python\\n  from nuclia.sdk.agent import NucliaAgent\\n\\n  agent = NucliaAgent()\\n
        \ agent.cli.interact()\\n  ```\\n\\nThis launches an interactive terminal
        session where you can:\\n- Ask questions and see streaming responses\\n- View
        processing steps in real-time\\n- Manage conversation sessions\\n- See retrieved
        context and citations\\n\\n### Interactive CLI Commands\\n\\nThe CLI supports
        several commands (prefix with `/`):\\n\\n| Command | Description |\\n|---------|-------------|\\n|
        `/help` | Show available commands |\\n| `/new_session` | Create a new persistent
        session |\\n| `/list_sessions` | List all your sessions |\\n| `/change_session`
        | Switch to a different session, use 'ephemeral' for a temporary session |\\n|
        `/clear` | Clear the screen |\\n| `/exit` | Exit the CLI |\\n\\nPlease note
        that all commands related to sessions require a Retrieval Agent Orchestrator
        with the option **Agent with memory** enabled during creation.\\n\\n## Session
        Management\\n\\nSessions allow you to maintain conversation context across
        multiple interactions.\\n\\n> This feature will only be available if you checked
        **Agent with memory** during the creation of your Retrieval Agents Orchestrator.\\n\\n###
        Creating a Session\\n\\n- CLI:\\n\\n  ```sh\\n  nuclia agent session new --name=\\\"My
        Research Session\\\"\\n  ```\\n\\n- SDK:\\n\\n  ```python\\n  from nuclia.sdk.agent
        import NucliaAgent\\n\\n  agent = NucliaAgent()\\n  session_uuid = agent.session.new(\\\"My
        Research Session\\\")\\n  print(f\\\"Created session: {session_uuid}\\\")\\n
        \ ```\\n\\n### Listing Sessions\\n\\n- CLI:\\n\\n  ```sh\\n  nuclia agent
        session list\\n  ```\\n\\n- SDK:\\n\\n  ```python\\n  from nuclia.sdk.agent
        import NucliaAgent\\n\\n  agent = NucliaAgent()\\n  sessions = agent.session.list()\\n
        \ for session in sessions.resources:\\n      print(f\\\"{session.title}: {session.id}\\\")\\n
        \ ```\\n\\n### Getting a Session\\n\\n- CLI:\\n\\n  ```sh\\n  nuclia agent
        session get --session_uuid=[SESSION_UUID]\\n  ```\\n\\n- SDK:\\n\\n  ```python\\n
        \ from nuclia.sdk.agent import NucliaAgent\\n\\n  agent = NucliaAgent()\\n
        \ session = agent.session.get(session_uuid)\\n  print(f\\\"Session: {session.title}\\\")\\n
        \ print(f\\\"Created: {session.created}\\\")\\n  ```\\n\\n### Deleting a Session\\n\\n-
        CLI:\\n\\n  ```sh\\n  nuclia agent session delete --session_uuid=[SESSION_UUID]\\n
        \ ```\\n\\n- SDK:\\n\\n  ```python\\n  from nuclia.sdk.agent import NucliaAgent\\n\\n
        \ agent = NucliaAgent()\\n  agent.session.delete(session_uuid)\\n  ```\\n\\n##
        Interaction\\n\\nAside from the interactive CLI, you can interact with your
        Retrieval Agents Orchestrator with the simple CLI or programmatically using
        the SDK.\\n\\n### Basic Interaction\\n\\n\\n**CLI:**\\n```bash\\nnuclia agent
        interact \\\"What is Eric known for?\\\"\\n```\\n\\n**SDK:**\\n```python\\nfrom
        nuclia.sdk.agent import NucliaAgent\\n\\nagent = NucliaAgent()\\n\\n# Iterate
        over streaming responses\\nfor response in agent.interact(\\n    question=\\\"What
        is Eric known for?\\\"\\n):\\n    if response.operation == \\\"ANSWER\\\"
        and response.answer:\\n        print(response.answer)\\n    elif response.step:\\n
        \       print(f\\\"Processing: {response.step.module}\\\")\\n```\\n\\nNot
        supplying a `session_uuid` when calling `interact` will use an ephemeral session
        by default. To maintain context, provide a persistent session UUID.\\n\\n###
        Using Persistent Sessions\\n\\n**CLI:**\\n```bash\\nnuclia agent sessions
        new \\\"Customer Support Chat\\\"\\n# Note the session UUID returned\\nnuclia
        agent interact \\\"What are your business hours?\\\" --session_uuid=\\\"SESSION_UUID\\\"\\nnuclia
        agent interact \\\"Are you open on weekends?\\\" --session_uuid=\\\"SESSION_UUID\\\"\\n```\\n\\n**SDK:**\\n```python\\nfrom
        nuclia.sdk.agent import NucliaAgent\\n\\nagent = NucliaAgent()\\n\\n# Create
        a session\\nsession_uuid = agent.session.new(\\\"Customer Support Chat\\\")\\n\\n#
        Have a conversation with context\\nfor response in agent.interact(\\n    session_uuid=session_uuid,\\n
        \   question=\\\"What are your business hours?\\\"\\n):\\n    if response.answer:\\n
        \       print(response.answer)\\n\\n# Follow-up question maintains context\\nfor
        response in agent.interact(\\n    session_uuid=session_uuid,\\n    question=\\\"Are
        you open on weekends?\\\"\\n):\\n    if response.answer:\\n        print(response.answer)\\n```\\n\\n##
        Understanding Response Types\\n\\nWhen interacting with an agent, you receive
        a stream of `AragAnswer` objects with different operations:\\n\\n| Operation
        | Description |\\n|-----------|-------------|\\n| `START` | Interaction has
        begun |\\n| `ANSWER` | Processing step or partial answer |\\n| `DONE` | Interaction
        complete |\\n| `ERROR` | An error occurred |\\n| `AGENT_REQUEST` | Agent needs
        user feedback |\\n\\n### Response Attributes\\n\\nEach response may contain:\\n\\n-
        **`step`**: Information about the current processing step\\n  - `module`:
        The module being executed (e.g., \\\"rephrase\\\", \\\"basic_ask\\\", \\\"remi\\\")\\n
        \ - `title`: Display title for the step\\n  - `value`: Result of the step\\n
        \ - `reason`: Explanation for the step\\n  - `timeit`: Time taken in seconds\\n
        \ - `input_nuclia_tokens`/`output_nuclia_tokens`: Token usage\\n\\n- **`context`**:
        Retrieved context from the knowledge base\\n  - `chunks`: List of retrieved
        text chunks with sources\\n  - `summary`: Summary of the context or partial
        answer\\n\\n- **`answer`**: The final answer text (Markdown formatted)\\n\\n-
        **`generated_text`**: Intermediate generated text\\n\\n- **`possible_answer`**:
        Alternative answer being considered\\n\\n- **`exception`**: Error details
        if something went wrong\\n\\n### Processing Responses\\n\\n```python\\nfrom
        nuclia.sdk.agent import NucliaAgent\\nfrom nuclia_models.agent.interaction
        import AnswerOperation\\n\\nagent = NucliaAgent()\\n\\nfor response in agent.interact(question=\\\"Tell
        me about AI\\\"):\\n    if response.operation == AnswerOperation.START:\\n
        \       print(\\\"Starting...\\\")\\n    \\n    elif response.step:\\n        print(f\\\"Step:
        {response.step.module} ({response.step.timeit:.2f}s)\\\")\\n    \\n    elif
        response.context:\\n        print(f\\\"Retrieved {len(response.context.chunks)}
        chunks\\\")\\n        for chunk in response.context.chunks:\\n            print(f\\\"
        \ - {chunk.title}: {chunk.text[:100]}...\\\")\\n    \\n    elif response.answer:\\n
        \       print(f\\\"\\\\nFinal Answer:\\\\n{response.answer}\\\")\\n    \\n
        \   elif response.operation == AnswerOperation.DONE:\\n        print(\\\"Complete!\\\")\\n
        \   \\n    elif response.operation == AnswerOperation.ERROR:\\n        print(f\\\"Error:
        {response.exception.detail if response.exception else 'Unknown'}\\\")\\n```\\n\\n##
        Standard CLI for Raw Messages\\n\\nFor debugging or advanced use cases, you
        can access raw websocket messages programmatically:\\n\\n```python\\nfrom
        nuclia.sdk.agent import NucliaAgent\\n\\nagent = NucliaAgent()\\n\\n# Iterate
        over all messages\\nfor message in agent.interact(\\n    question=\\\"What
        is RAO?\\\"\\n):\\n    # message is an AragAnswer object with all raw data\\n
        \   print(f\\\"Operation: {message.operation}\\\")\\n    print(f\\\"Raw message:
        {message.model_dump_json(indent=2)}\\\")\\n```\\n\\nThis gives you direct
        access to all websocket message data for debugging or custom processing.\\n\\n##
        Advanced Features\\n\\n### Agent Feedback Requests\\n\\nAgents can request
        additional input from users during processing:\\n\\n```python\\nfrom nuclia.sdk.agent
        import NucliaAgent\\nfrom nuclia_models.agent.interaction import AnswerOperation\\n\\nagent
        = NucliaAgent()\\ngenerator = agent.interact(question=\\\"Help me with X\\\")\\n\\nfor
        response in generator:\\n    if response.operation == AnswerOperation.AGENT_REQUEST:\\n
        \       # Agent is requesting user input\\n        user_input = input(f\\\"Agent
        asks: {response.feedback.question}\\\\n> \\\")\\n        # Send response back\\n
        \       generator.send(user_input)\\n    elif response.answer:\\n        print(response.answer)\\n```\\n\\n###
        Error Handling\\n\\n```python\\nfrom nuclia.sdk.agent import NucliaAgent\\nfrom
        nuclia.exceptions import RaoAPIException\\n\\nagent = NucliaAgent()\\n\\ntry:\\n
        \   for response in agent.interact(question=\\\"Hello?\\\"):\\n        if
        response.exception:\\n            print(f\\\"Agent error: {response.exception.detail}\\\")\\n
        \       elif response.answer:\\n            print(response.answer)\\nexcept
        RaoAPIException as e:\\n    print(f\\\"API error: {e.detail}\\\")\\nexcept
        Exception as e:\\n    print(f\\\"Unexpected error: {e}\\\")\\n```\\n\\n###
        Passing Custom Headers to MCP\\n\\nIf your Retrieval Agents Orchestrator requires
        custom headers for MCP Agents, you can pass them as follows:\\n\\n**CLI:**\\n```bash\\nnuclia
        agent interact \\\"What is AI?\\\" --headers '{\\\"X-Custom-Header\\\": \\\"value\\\"}'\\n```\\n\\n**SDK:**\\n```python\\nfrom
        nuclia.sdk.agent import NucliaAgent\\n\\nagent = NucliaAgent()\\nfor response
        in agent.interact(\\n    question=\\\"What is AI?\\\",\\n    headers={\\\"X-Custom-Header\\\":
        \\\"value\\\"}\\n):\\n    if response.answer:\\n        print(response.answer)\\n```\\n\\nPlease
        ensure that the 'Allowed Headers' configuration in your MCP agent includes
        any custom headers you wish to use.\\n\\n## Best Practices\\n\\n1. **Use Sessions
        for Context**: Create sessions when you need multi-turn conversations with
        context retention\\n2. **Use Ephemeral Sessions for One-offs**: Don't supply
        a session UUID for using agents in a stateless manner.\\n3. **Stream for UX**:
        Process responses as they arrive for better user experience\\n4. **Handle
        All Operations**: Check for different operation types (START, ANSWER, DONE,
        ERROR) when processing responses\\n5. **Clean Up Sessions**: Delete sessions
        when done to avoid clutter\\n6. **Use Interactive CLI**: For manual testing
        and exploration, the interactive CLI provides the best experience\\n\",\"format\":\"MARKDOWN\",\"md5\":\"bbaaf8cccd2b664ba4f7daf47d1f2bf4\",\"extract_strategy\":\"\",\"split_strategy\":\"\"},\"extracted\":{\"text\":{\"text\":\"Retrieval
