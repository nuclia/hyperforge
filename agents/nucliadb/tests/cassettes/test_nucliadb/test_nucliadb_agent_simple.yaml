        :{\"text\":\" \\n id: rate-limiting \\n title: Manage rate limiting \\n \\\
        n Manage rate limiting \\n Rate limits are an essential aspect of the Agentic\
        \ RAG platform, ensuring fair usage and optimal performance for all users\
        \ interacting with Agentic RAG APIs. This document outlines the rate limits\
        \ enforced by Agentic RAG and provides guidelines for handling rate-limited\
        \ responses effectively. \\n Introduction \\n Agentic RAG can apply two types\
        \ of limits to its APIs: \\n \\n \\n Regular API rate limits: By default,\
        \ the sum of all authenticated requests in a Agentic RAG account cannot exceed\
        \ 2400 requests per minute. Note that this limit can be customized on a per-account\
        \ basis. Please contact Agentic RAG's support team if you need an increase.\
        \ \\n \\n \\n Ingestion back pressure limits: Agentic RAG implements a back-pressure\
        \ mechanism to manage ingestion pipeline overload. This mainly affects endpoints\
        \ for uploading data and creating or updating resources. \\n \\n \\n Handling\
        \ Rate-Limited Responses \\n Agentic RAG adheres to the HTTP standard and\
        \ will return a response with a 429 status codes when the limits are exceeded.\
        \ \\n The official Agentic RAG API clients already have built-in mechanisms\
        \ for retrying requests when rate limits are encountered: \\n \\n Nuclia Python\
        \ client \\n Nuclia JavaScript client \\n \\n However, if you are interacting\
        \ directly with the API, we recommend using an exponential backoff retry strategy\
        \ when limits are reached. \\n When ingestion back pressure rate limits are\
        \ hit, the response will include a try_after key with an estimated UTC time\
        \ for retrying the request. You can use this value for retry logic as an alternative\
        \ to the exponential backoff strategy. \\n Example 1: Regular API rate limits\
        \ \\n Here's an example of how to implement an exponential backoff retry strategy\
        \ in Python: \\n ```python \\n import time \\n import requests \\n def make_request_with_exponential_backoff(url,\
        \ headers, max_retries=5): \\n retries = 0 \\n while retries < max_retries:\
        \ \\n response = requests.get(url, headers=headers) \\n if response.status_code\
        \ == 200: \\n return response.json() \\n elif response.status_code == 429:\
        \ \\n wait_time = 2 retries # Exponential backoff: 2^retries \\n print(f Rate\
        \ limit exceeded. Retrying in {wait_time} seconds... ) \\n time.sleep(wait_time)\
        \ \\n retries += 1 \\n else: \\n response.raise_for_status() \\n raise Exception(\
        \ Max retries exceeded ) \\n Example usage \\n url = https://your-endpoint\
        \ \\n headers = { Authorization : Bearer YOUR_ACCESS_TOKEN } \\n data = make_request_with_exponential_backoff(url,\
        \ headers) \\n print(data) \\n ``` \\n Example 2: Ingestion back pressure\
        \ limits \\n Here's an example of how to use the try_after key from the response\
        \ to manage rate limits: \\n ```python \\n import time \\n from datetime import\
        \ datetime \\n import requests \\n def make_request_with_try_after_info(url,\
        \ headers, max_retries=5): \\n retries = 0 \\n while retries < max_retries:\
        \ \\n response = requests.get(url, headers=headers) \\n response_body = response.json()\
        \ \\n if response.status_code == 200: \\n return response.json() \\n elif\
        \ response.status_code == 429 and try_after in response_body: \\n try_after\
        \ = response_body[ try_after ] \\n retry_time = datetime.strptime(try_after,\
        \ %Y-%m-%dT%H:%M:%S.%fZ ) \\n wait_time = (retry_time - datetime.utcnow()).total_seconds()\
        \ \\n print( \\n f Rate limit exceeded. Retrying at {retry_time} (in {wait_time}\
        \ seconds)... \\n ) \\n time.sleep(wait_time) \\n retries += 1 \\n else: \\\
        n response.raise_for_status() \\n raise Exception( Max retries exceeded )\
        \ \\n Example usage \\n url = https://your-endpoint \\n headers = { Authorization\
        \ : Bearer YOUR_ACCESS_TOKEN } \\n data = make_request_with_try_after_info(url,\
        \ headers) \\n print(data) \\n ``` \\n These examples demonstrate how to handle\
        \ rate limits effectively, ensuring that your application respects the limits\
        \ and retries appropriately.\",\"split_text\":{},\"deleted_splits\":[]},\"\
