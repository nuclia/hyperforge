        citations?\\n\\n> `optional` **citations**: `boolean` \\\\| `\\\"none\\\"`
        \\\\| `\\\"default\\\"` \\\\| `\\\"llm_footnotes\\\"`\\n\\nIt will return
        the text blocks that have been effectively used to build each section of the
        answer.\\n\\n#### Defined in\\n\\n[libs/sdk-core/src/lib/db/search/search.models.ts:105](https://github.com/nuclia/frontend/blob/7b2930a2c8efcce03177de1325ff4377daf3c6d4/libs/sdk-core/src/lib/db/search/search.models.ts#L105)\\n\\n***\\n\\n###
        debug?\\n\\n> `optional` **debug**: `boolean`\\n\\n#### Inherited from\\n\\n[`BaseSearchOptions`](BaseSearchOptions.md).[`debug`](BaseSearchOptions.md#debug)\\n\\n####
        Defined in\\n\\n[libs/sdk-core/src/lib/db/search/search.models.ts:79](https://github.com/nuclia/frontend/blob/7b2930a2c8efcce03177de1325ff4377daf3c6d4/libs/sdk-core/src/lib/db/search/search.models.ts#L79)\\n\\n***\\n\\n###
