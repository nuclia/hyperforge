        \ Token usage\\n\\n- **`context`**: Retrieved context from the knowledge base\\\
        n  - `chunks`: List of retrieved text chunks with sources\\n  - `summary`:\
        \ Summary of the context or partial answer\\n\\n- **`answer`**: The final\
        \ answer text (Markdown formatted)\\n\\n- **`generated_text`**: Intermediate\
        \ generated text\\n\\n- **`possible_answer`**: Alternative answer being considered\\\
        n\\n- **`exception`**: Error details if something went wrong\\n\\n### Processing\
        \ Responses\\n\\n```python\\nfrom nuclia.sdk.agent import NucliaAgent\\nfrom\
        \ nuclia_models.agent.interaction import AnswerOperation\\n\\nagent = NucliaAgent()\\\
        n\\nfor response in agent.interact(question=\\\"Tell me about AI\\\"):\\n\
        \    if response.operation == AnswerOperation.START:\\n        print(\\\"\
        Starting...\\\")\\n    \\n    elif response.step:\\n        print(f\\\"Step:\
        \ {response.step.module} ({response.step.timeit:.2f}s)\\\")\\n    \\n    elif\
        \ response.context:\\n        print(f\\\"Retrieved {len(response.context.chunks)}\
        \ chunks\\\")\\n        for chunk in response.context.chunks:\\n         \
        \   print(f\\\"  - {chunk.title}: {chunk.text[:100]}...\\\")\\n    \\n   \
        \ elif response.answer:\\n        print(f\\\"\\\\nFinal Answer:\\\\n{response.answer}\\\
        \")\\n    \\n    elif response.operation == AnswerOperation.DONE:\\n     \
        \   print(\\\"Complete!\\\")\\n    \\n    elif response.operation == AnswerOperation.ERROR:\\\
        n        print(f\\\"Error: {response.exception.detail if response.exception\
        \ else 'Unknown'}\\\")\\n```\\n\\n## Standard CLI for Raw Messages\\n\\nFor\
