        n nuclia kb search search --query= My search --yaml \\n Generative answer\
        \ \\n Based on a find request, Nuclia uses a generative AI to answer the question\
        \ based on the context without hallucinations and with the find result and\
        \ relations. \\n \\n CLI: \\n \\n bash \\n nuclia kb search ask --query= My\
        \ question \\n \\n SDK: \\n \\n python \\n from nuclia import sdk \\n search\
        \ = sdk.NucliaSearch() \\n search.ask(query= My question ) \\n You can also\
        \ use the AskRequest item to configure the request with all the parameters\
        \ supported: \\n ```python \\n from nuclia import sdk \\n from nucliadb_models.search\
        \ import AskRequest \\n search = sdk.NucliaSearch() \\n query = AskRequest(query=\
        \ My question , prefer_markdown=True, citations=True) \\n search.ask(query=query)\
        \ \\n ``` \\n Reasoning \\n Some LLMs support reasoning. In some models, reasoning\
        \ is enabled by default, while in others it must be explicitly requested.\
