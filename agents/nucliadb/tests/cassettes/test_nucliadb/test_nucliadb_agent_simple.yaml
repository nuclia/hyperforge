        data\":{\"texts\":{\"page\":{\"value\":{\"body\":\"# Retrieval Agents Orchestrator\\\
        n\\nInteract with Nuclia's Retrieval Agents Orchestrator to have intelligent\
        \ conversations over several knowledge sources with persistent session management\
        \ and real-time streaming responses.\\n\\n## Prerequisites\\n\\nInstall the\
        \ Nuclia SDK:\\n\\n```sh\\npip install nuclia\\n```\\n\\nEnsure you have:\\\
        n- A valid Nuclia authentication token (see [Authentication](02-auth.md))\\\
        n- Access to a configured Retrieval Agent\\n\\n## Overview\\n\\nThe nuclia.py\
        \ library provides several ways to interact with your Retrieval Agents Orchestrators:\\\
        n\\n- **Interactive CLI**: A rich, user-friendly terminal interface (recommended)\\\
        n- **Standard CLI**: Direct access to raw websocket messages for debugging\\\
        n- **Session Management**: Create and manage persistent conversation sessions\\\
        n- **Programmatic API**: Python SDK for building custom applications\\n\\\
        n\\n## Listing Available Agents\\n\\nDiscover what Retrieval Agents Orchestrators\
        \ you have access to.\\n\\n- CLI:\\n\\n  ```sh\\n  nuclia agents list\\n \
        \ ```\\n\\n- SDK:\\n\\n  ```python\\n  from nuclia.sdk.agents import NucliaAgents\\\
        n\\n  agents = NucliaAgents()\\n  all_agents = agents.list()\\n\\n  for agent\
        \ in all_agents:\\n      print(f\\\"Agent: {agent.title} ({agent.id})\\\"\
        )\\n      print(f\\\"  Slug: {agent.slug}\\\")\\n      print(f\\\"  Zone:\
        \ {agent.zone}\\\")\\n  ```\\n\\n### Getting a Specific Agent\\n\\n- CLI:\\\
        n\\n  ```sh\\n  nuclia agents get --account=\\\"my-account\\\" --id=\\\"agent-uuid\\\
        \" --zone=\\\"europe-1\\\"\\n  ```\\n\\n- SDK:\\n\\n  ```python\\n  from nuclia.sdk.agents\
        \ import NucliaAgents\\n\\n  agents = NucliaAgents()\\n  agent_details = agents.get(\\\
        n      account=\\\"my-account\\\",\\n      id=\\\"agent-uuid\\\",\\n     \
        \ zone=\\\"europe-1\\\"\\n  )\\n  print(agent_details)\\n  ```\\n\\n### Setting\
        \ a Default Agent\\n\\n- CLI:\\n\\n  ```sh\\n  nuclia agents default [AGENT_SLUG\
        \ or AGENT_UUID]\\n  ```\\n\\n- SDK:\\n\\n  ```python\\n  from nuclia.sdk.agents\
        \ import NucliaAgents\\n\\n  agents = NucliaAgents()\\n  agents.default(\\\
        \"my-agent\\\")\\n  ```\\n\\nThis sets the default agent for all subsequent\
        \ operations.\\n\\n## Interactive CLI (Recommended)\\n\\nThe interactive CLI\
        \ provides a beautiful, real-time interface for conversing with your Retrieval\
        \ Agents Orchestrator.\\n\\n### Starting the Interactive CLI\\n\\n- CLI:\\\
        n\\n  ```sh\\n  nuclia agent cli interact\\n  ```\\n\\n- SDK:\\n\\n  ```python\\\
        n  from nuclia.sdk.agent import NucliaAgent\\n\\n  agent = NucliaAgent()\\\
        n  agent.cli.interact()\\n  ```\\n\\nThis launches an interactive terminal\
        \ session where you can:\\n- Ask questions and see streaming responses\\n-\
        \ View processing steps in real-time\\n- Manage conversation sessions\\n-\
        \ See retrieved context and citations\\n\\n### Interactive CLI Commands\\\
        n\\nThe CLI supports several commands (prefix with `/`):\\n\\n| Command |\
        \ Description |\\n|---------|-------------|\\n| `/help` | Show available commands\
        \ |\\n| `/new_session` | Create a new persistent session |\\n| `/list_sessions`\
        \ | List all your sessions |\\n| `/change_session` | Switch to a different\
        \ session, use 'ephemeral' for a temporary session |\\n| `/clear` | Clear\
        \ the screen |\\n| `/exit` | Exit the CLI |\\n\\nPlease note that all commands\
        \ related to sessions require a Retrieval Agent Orchestrator with the option\
        \ **Agent with memory** enabled during creation.\\n\\n## Session Management\\\
        n\\nSessions allow you to maintain conversation context across multiple interactions.\\\
        n\\n> This feature will only be available if you checked **Agent with memory**\
        \ during the creation of your Retrieval Agents Orchestrator.\\n\\n### Creating\
        \ a Session\\n\\n- CLI:\\n\\n  ```sh\\n  nuclia agent session new --name=\\\
        \"My Research Session\\\"\\n  ```\\n\\n- SDK:\\n\\n  ```python\\n  from nuclia.sdk.agent\
        \ import NucliaAgent\\n\\n  agent = NucliaAgent()\\n  session_uuid = agent.session.new(\\\
        \"My Research Session\\\")\\n  print(f\\\"Created session: {session_uuid}\\\
        \")\\n  ```\\n\\n### Listing Sessions\\n\\n- CLI:\\n\\n  ```sh\\n  nuclia\
        \ agent session list\\n  ```\\n\\n- SDK:\\n\\n  ```python\\n  from nuclia.sdk.agent\
        \ import NucliaAgent\\n\\n  agent = NucliaAgent()\\n  sessions = agent.session.list()\\\
        n  for session in sessions.resources:\\n      print(f\\\"{session.title}:\
        \ {session.id}\\\")\\n  ```\\n\\n### Getting a Session\\n\\n- CLI:\\n\\n \
        \ ```sh\\n  nuclia agent session get --session_uuid=[SESSION_UUID]\\n  ```\\\
        n\\n- SDK:\\n\\n  ```python\\n  from nuclia.sdk.agent import NucliaAgent\\\
        n\\n  agent = NucliaAgent()\\n  session = agent.session.get(session_uuid)\\\
        n  print(f\\\"Session: {session.title}\\\")\\n  print(f\\\"Created: {session.created}\\\
        \")\\n  ```\\n\\n### Deleting a Session\\n\\n- CLI:\\n\\n  ```sh\\n  nuclia\
        \ agent session delete --session_uuid=[SESSION_UUID]\\n  ```\\n\\n- SDK:\\\
        n\\n  ```python\\n  from nuclia.sdk.agent import NucliaAgent\\n\\n  agent\
        \ = NucliaAgent()\\n  agent.session.delete(session_uuid)\\n  ```\\n\\n## Interaction\\\
        n\\nAside from the interactive CLI, you can interact with your Retrieval Agents\
        \ Orchestrator with the simple CLI or programmatically using the SDK.\\n\\\
        n### Basic Interaction\\n\\n\\n**CLI:**\\n```bash\\nnuclia agent interact\
        \ \\\"What is Eric known for?\\\"\\n```\\n\\n**SDK:**\\n```python\\nfrom nuclia.sdk.agent\
        \ import NucliaAgent\\n\\nagent = NucliaAgent()\\n\\n# Iterate over streaming\
        \ responses\\nfor response in agent.interact(\\n    question=\\\"What is Eric\
        \ known for?\\\"\\n):\\n    if response.operation == \\\"ANSWER\\\" and response.answer:\\\
        n        print(response.answer)\\n    elif response.step:\\n        print(f\\\
        \"Processing: {response.step.module}\\\")\\n```\\n\\nNot supplying a `session_uuid`\
        \ when calling `interact` will use an ephemeral session by default. To maintain\
        \ context, provide a persistent session UUID.\\n\\n### Using Persistent Sessions\\\
        n\\n**CLI:**\\n```bash\\nnuclia agent sessions new \\\"Customer Support Chat\\\
