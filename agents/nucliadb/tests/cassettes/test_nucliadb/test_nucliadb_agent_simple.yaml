        \ , /classification.labels/region/Asia ]}' \\n nuclia kb search ask --query='{\
        \ query : My search , top_k : 5}' \\n \\n SDK: \\n \\n python \\n from nuclia\
        \ import sdk \\n search = sdk.NucliaSearch() \\n search.find(query={ query\
        \ : My search , filters : [ /icon/application/pdf , /classification.labels/region/Asia\
        \ ]}) \\n search.ask(query={ query : My search , top_k : 5}) \\n Graph queries\
        \ \\n The Python SDK allows graph queries supported by the /graph endpoint.\
        \ Although \\n a bit cumbersome, the knowledge graph can be queried as in\
