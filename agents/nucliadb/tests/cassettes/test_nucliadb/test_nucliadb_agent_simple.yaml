        Methods\\n\\n### ask()\\n\\n#### ask(query, context, features, options)\\n\\n>
        **ask**(`query`, `context`?, `features`?, `options`?): `Observable`\\\\<[`Answer`](../namespaces/Ask/interfaces/Answer.md)
        \\\\| [`IErrorResponse`](../interfaces/IErrorResponse.md)\\\\>\\n\\nRetrieves
        a generative answer for the given query.\\n\\nThe generative answer is a text
        that is generated chunk by chunk by the language model.\\nIt is retrieved
        through a readable HTTP stream, so the `chat()` method returns an `Observable`\\nemitting
        a value each time a new chunk is available.\\nThe `incomplete` attribute of
        the emitted value indicates if the asnwer is complete or not.\\n\\nExample:\\n```ts\\n
        nuclia.knowledgeBox\\n   .ask('where does the Little Prince live')\\n   .pipe(filter((answer)
        => !answer.incomplete))\\n   .subscribe((answer) => {\\n     console.log(answer.text);\\n
        \  });\\n ```\\n\\n##### Parameters\\n\\n\u2022 **query**: `string`\\n\\n\u2022
        **context?**: [`ContextEntry`](../namespaces/Ask/interfaces/ContextEntry.md)[]\\n\\n\u2022
        **features?**: [`Features`](../namespaces/Ask/enumerations/Features.md)[]\\n\\n\u2022
        **options?**: [`ChatOptions`](../interfaces/ChatOptions.md)\\n\\n##### Returns\\n\\n`Observable`\\\\<[`Answer`](../namespaces/Ask/interfaces/Answer.md)
        \\\\| [`IErrorResponse`](../interfaces/IErrorResponse.md)\\\\>\\n\\n#####
