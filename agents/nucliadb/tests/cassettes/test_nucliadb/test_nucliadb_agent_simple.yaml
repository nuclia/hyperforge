      response \n - image: Tokens used for image processing (when applicable) \n Customer
      Key Tokens (customer_key_tokens): \n\n\n\nLink: https://docs.rag.progress.cloud/docs/rag/advanced/consumption\n",
      "4039d76b0fff4962900836ab3fdec9f7/t/page/5189-5396": " - These represent the
      number of Agentic RAG tokens consumed and that you will be billed for \n - Values
      are normalized across different LLM providers for consistent billing \n - Include
      separate counts for: \n\n\n\nLink: https://docs.rag.progress.cloud/docs/rag/advanced/consumption\n",
      "4039d76b0fff4962900836ab3fdec9f7/t/page/5615-5849": " - These represent tokens
      consumed when using your own LLM API keys \n - These tokens are not billed by
      Agentic RAG since you''re using your own API keys \n - Values are also normalized
      for comparison purposes across different providers\n\n\nLink: https://docs.rag.progress.cloud/docs/rag/advanced/consumption\n",
      "4039d76b0fff4962900836ab3fdec9f7/t/page/747-1008": " Since all these 3rd-party
      LLMs have different pricing, Agentic RAG tokens serve to normalize the cost
      across all of them. \n How Tokens Are Consumed in RAG \n When a user asks a
      question to your Knowledge Box, the token consumption process follows these
      steps: \n\n\n\nLink: https://docs.rag.progress.cloud/docs/rag/advanced/consumption\n",
      "4039d76b0fff4962900836ab3fdec9f7/t/page/0-319": " \n id: consumption \n title:
      Token consumption \n \n import Tabs from @theme/Tabs ; \n import TabItem from
      @theme/TabItem ; \n Token consumption \n Agentic RAG is a license and consumption-based
      service. This means that you pay for the computational resources you consume.
      The consumption is measured in Agentic RAG tokens. \n\n\n\nLink: https://docs.rag.progress.cloud/docs/rag/advanced/consumption\n",
      "4039d76b0fff4962900836ab3fdec9f7/t/page/319-747": " All public 3rd-party LLMs
      base their pricing on the number of tokens consumed. In the LLM world, a token
      is around 4-5 characters on average, which might fit an entire word or be split
      into parts. The number of tokens is proportional to the amount of text, measured
      in chunks of 4-5 characters. It closely relates to words but not entirely. The
      longer a sentence is, the more tokens it will consume to read or to generate
      it. \n\n\n\nLink: https://docs.rag.progress.cloud/docs/rag/advanced/consumption\n",
      "4039d76b0fff4962900836ab3fdec9f7/t/page/1008-1650": " \n Question Processing:
      The system finds the most relevant paragraphs to answer the question \n Context
      Assembly: These paragraphs are used as context when calling the LLM model \n
      Prompt Creation: Agentic RAG assembles the prompt, context, and question into
      a single string \n LLM Processing: This complete string is sent to the LLM,
      corresponding to a certain number of input tokens \n Answer Generation: The
      LLM generates the answer, which corresponds to a certain number of output tokens
      \n \n Total consumption = Input tokens + Output tokens + Image tokens \n Factors
      That Impact Token Consumption \n Token consumption is directly affected by:
      \n\n\n\nLink: https://docs.rag.progress.cloud/docs/rag/advanced/consumption\n",
      "220eb37c167f4eb9bb8e9454e7ba8cf5/t/page/2505-2709": " ::: \n :::warning \n
      Enabling reasoning can use additional tokens, which may increase your usage
      costs. \n You may need to increase max_tokens to give the LLM enough room to
      reason and generate an answer. \n\n\n\nLink: https://docs.rag.progress.cloud/docs/develop/python-sdk/search\n",
      "220eb37c167f4eb9bb8e9454e7ba8cf5/t/page/2276-2505": " \n OpenAI models \u2192
      support effort only. \n Google & Anthropic models \u2192 support budget_tokens
      only. \n \n :::tip \n If you send just one of these values (effort or budget_tokens),
      Nuclia will automatically fill in the other for you. \n\n\n\nLink: https://docs.rag.progress.cloud/docs/develop/python-sdk/search\n",
      "4be29234ea764ce7889f78e60fe8ec78/t/page/0-1164": " \n id: models \n title:
      Semantic models \n \n | Model Name | Size | Similarity | Threshold | Max Tokens
      | Matryoshka | Multilingual | External | \n | --------------------------- |
      -------- | ------------- | ------------- | -------------- | -------------- |
      ---------------- | ------------ | \n | en-2024-04-24 | 768 | DOT | 0.47 | 2048
      | No | No | No | \n | multilingual-2023-08-16 | 1024 | DOT | 0.7 | 512 | No
      | Yes | No | \n | multilingual-2024-05-06 | 1024 | DOT | 0.4 | 2048 | No | Yes
      | No | \n | multilingual-2024-10-07 | 1024 | DOT | 0.4 | 2048 | No | Yes | No
      | \n | Open AI 3 small | 1536 | COSINE | 0.5 | 8192 | Yes | Yes | Yes | \n |
      Open AI 3 large | 3072 | COSINE | 0.5 | 8192 | Yes | Yes | Yes | \n | Google
      multilingual Gecko | 768 | COSINE | 0.55 | 3072 | Yes | Yes | Yes | \n | Google
      Gemini 2 | 3072 | COSINE | 0.55 | 8192 | Yes | Yes | Yes | \n | Hugging Face
      | N/A | N/A | N/A | N/A | N/A | N/A | Yes | \n Embeddings models \n Embeddings
      are like fingerprints for words or data. They help computers understand the
      similarities and differences between them, making it easier for machines to
      perform tasks like understanding language or recognizing patterns. \n\n\n\nLink:
      https://docs.rag.progress.cloud/docs/rag/advanced/models\n"}}'
