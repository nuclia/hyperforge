        :\"b28e388104644fc5bba68c0cd44e01d4\",\"field_type\":\"t\",\"field\":\"page\"\
        ,\"text\":\" The Smart Agent plans the answer: picks the most appropriate\
        \ sources, splits the question into sub-questions, evaluates relevancy, and\
        \ iterates autonomously until the information is sufficient. \\n Basic usage\
        \ \\n To set up a Smart Agent, declare all the sources you want to use (Knowledge\
