        data\":{\"texts\":{\"page\":{\"value\":{\"body\":\"---\\nid: features\\ntitle:\
        \ Features\\n---\\n\\n# Widgets features\\n\\nThe Agentic RAG widgets allows\
        \ you to embed the Agentic RAG search experience directly into your website\
        \ or web application through a simple HTML snippet:\\n\\n```html\\n<script\
        \ src=\\\"https://cdn.rag.progress.cloud/nuclia-widget.umd.js\\\"></script>\\\
        n<nuclia-search-bar\\n  knowledgebox=\\\"YOUR-KB\\\"\\n  zone=\\\"ZONE\\\"\
        \\n  features=\\\"answers,filter\\\"></nuclia-search-bar>\\n<nuclia-search-results></nuclia-search-results>\\\
        n```\\n\\nThe easiest way to explore the different features of the widgets\
        \ is to use the [Agentic RAG Dashboard](https://rag.progress.cloud/) in the\
        \ Widgets section and to play with the different options.\\n\\nThe _Embed\
        \ widget_ button will generate the HTML snippet for you.\\n\\n## Widget types\\\
        n\\nThere are 3 different types of widgets:\\n\\n- **Embedded in page**: the\
        \ search input is embedded in a page and the results are displayed under the\
        \ input. Once the initial answer is displayed, the user can click on _Ask\
        \ more_ to access the full chat interface. Note: For the correct reading of\
        \ the results, the width of the widget container should not be less than 384px.\\\
        n\\n  Web components:\\n\\n  ```html\\n  <nuclia-search-bar></nuclia-search-bar>\\\
        n  <nuclia-search-results></nuclia-search-results>\\n  ```\\n\\n- **Chat mode**:\
        \ displays directly the full chat interface.\\n\\n  Web component:\\n\\n \
        \ ```html\\n  <nuclia-chat></nuclia-chat>\\n  ```\\n\\n- **Popup modal**:\
        \ the search inout and the results are displayed in a popup modal.\\n\\n \
        \ Web component:\\n\\n  ```html\\n  <nuclia-popup></nuclia-popup>\\n  ```\\\
        n\\n## The `features` parameter\\n\\nThe `features` parameter allows you to\
        \ customize the behavior of the widget. It is a comma-separated list of features\
        \ among the following:\\n\\n- `filter`: display a filter dropdown in the search\
        \ bar.\\n- `navigateToFile`: open the file in the browser when clicking on\
        \ the result (by default, the file is displayed in the viewer).\\n- `navigateToLink`:\
        \ open the link in the browser when clicking on the result (by default, the\
        \ link is displayed in the viewer).\\n- `permalink`: add the search query\
        \ and criteria to the URL, allowing the widget to re-render the same results\
        \ upon loading.\\n- `relations`: display an info card on the right side of\
        \ the widget listing all the relations of the entity mentioned in the user\
        \ query.\\n- `suggestions`: display a list of suggested resource titles matching\
        \ the user input.\\n- `suggestLabels`: display a list of suggestions based\
        \ on the labels when the user starts typing in the search bar.\\n- `autocompleteFromNERs`:\
        \ display a list of suggestions based on the NERs extracted from the user\
        \ query when the user starts typing in the search bar.\\n- `displayMetadata`:\
        \ display the metadata associated with the resource in the result rows.\\\
        n- `answers`: trigger the answer generation process when the user makes a\
        \ search.\\n- `hideResults`: hide the search results, only the generative\
        \ answer will be displayed.\\n- `hideThumbnails`: hide the thumbnails associated\
        \ with the resource in the result rows.\\n- `displayFieldList`: display a\
        \ section listing all the fields of the resource in the right sidebar of the\
        \ viewer. This section is only visible for resources containing multiple fields.\\\
        n- `citations`: include citations in the generative answer.\\n- `rephrase`:\
        \ rephrase the user question in order to optimize the quality of the search\
        \ results.\\n- `debug`: display extra buttons to download the last request\
        \ full log of the debug metadata returned by the API. It must not be used\
        \ in production.\\n- `preferMarkdown`: require the generative answer to be\
        \ formatted in Markdown.\\n- `openNewTab`: open the link in a new tab when\
        \ clicking on the result.\\n- `orFilterLogic`: use the OR logic for filters\
        \ instead of the default AND logic.\\n- `noChatHistory`: the previous questions\
        \ and answers in the chat mode will not be passed as context when generating\
        \ a new answer.\\n- `showHidden`: display hidden resources in the search results.\\\
        n- `showAttachedImages`: display images attached to the matching paragraphs\
        \ in the search results.\\n\\n### Other parameters\\n\\n- `backend`: the URL\
        \ of the backend to use. Useful if you use your own proxy to access the Agentic\
        \ RAG API.\\n- `zone`: the zone to use.\\n- `knowledgebox`: the Knowledge\
        \ Box id.\\n- `placeholder`: the text displayed in the search bar when it\
        \ is empty.\\n- `lang`: the language of the widget. Currently supported: `ca`,\
        \ `fr`, `en`, `es`. Default: `en`.\\n- `apikey`: the API key to use. It is\
        \ not recommended to use it in production (the API key is meant to be injected\
        \ by your proxy).\\n- `account`: the account id.\\n- `state`: the publication\
        \ state of the Knowledge Box.\\n- `standalone`: set to `true` when using a\
        \ standalone NucliaDB instance.\\n- `proxy`: set to `true` when using a proxy\
        \ to access the Agentic RAG API.\\n- `mode`: set to `dark` to display the\
        \ widget in dark mode.\\n- `filters`: define the filters offered to the user\
        \ in the search bar among `labels`, `entities`, `created` and `labelFamilies`.\\\
        n- `preselected_filters`: define filters that will be applied by default to\
        \ any query.\\n- `csspath`: the path to the CSS file to use to customize the\
        \ widget style.\\n- `prompt`: the prompt to use for the generative model.\
        \ It must use `{context}` and `{question}` variables.\\n- `system_prompt`:\
        \ the system prompt to use for the generative model.\\n- `rephrase_prompt`:\
        \ the prompt to use when optimizing the user query to get the best search\
        \ results.\\n- `generativemodel`: the generative model to use for the answer\
        \ generation.\\n- `rag_strategies`: the RAG strategies to apply to the retrieved\
        \ paragraphs.\\n- `rag_images_strategies`: the RAG strategies to apply to\
        \ the retrieved images.\\n- `not_enough_data_message`: the message to display\
        \ when there is not enough data to generate an answer.\\n- `ask_to_resource`:\
        \ the resource ID to use as context for the generative model.\\n- `max_tokens`:\
        \ the maximum number of input tokens to put in the final context (including\
        \ the prompt, the retrieved results and the user question).\\n- `max_output_tokens`:\
        \ the maximum number of tokens to generate.\\n- `max_paragraphs`: the maximum\
        \ number of paragraphs to pass in the context to the generative model (default:\
        \ 20).\\n- `query_prepend`: the hard-coded text to prepend to the user query.\\\
        n- `json_schema`: the JSON schema to use to get a JSON answer from the generative\
        \ model.\\n- `vectorset`: the embedding model to use for the semantic search.\\\
        n- `chat_placeholder`: the placeholder to display in the chat input.\\n- `audit_metadata`:\
        \ custom metatada to add in API calls for auditing purposes.\\n\",\"format\"\
