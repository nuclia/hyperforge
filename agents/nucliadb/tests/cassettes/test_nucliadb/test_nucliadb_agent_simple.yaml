      \n } \n } \n } \n \n \n Understanding Token Types \n Normalized Tokens (normalized_tokens):
      \n\n\n\nLink: https://docs.rag.progress.cloud/docs/rag/advanced/consumption\n",
      "4039d76b0fff4962900836ab3fdec9f7/t/page/5396-5615": " - input: Tokens used
