        \"X-Custom-Header\\\": \\\"value\\\"}\\n):\\n    if response.answer:\\n  \
        \      print(response.answer)\\n```\\n\\nPlease ensure that the 'Allowed Headers'\
        \ configuration in your MCP agent includes any custom headers you wish to\
        \ use.\\n\\n## Best Practices\\n\\n1. **Use Sessions for Context**: Create\
        \ sessions when you need multi-turn conversations with context retention\\\
