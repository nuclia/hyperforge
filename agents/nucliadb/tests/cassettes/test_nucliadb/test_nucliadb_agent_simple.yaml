        \\n ``` \\n Model Support for Reasoning Options: \\n\",\"id\":\"220eb37c167f4eb9bb8e9454e7ba8cf5/t/page/1790-2276\",\"labels\":[\"/k/text\"],\"position\":{\"page_number\":0,\"index\":6,\"start\":1790,\"end\":2276,\"start_seconds\":[],\"end_seconds\":[]},\"fuzzy_result\":false,\"page_with_visual\":false,\"reference\":null,\"is_a_table\":false,\"relevant_relations\":null}}}}},\"0c8acfaf951e48a6a31b52234305fa57\":{\"id\":\"0c8acfaf951e48a6a31b52234305fa57\",\"slug\":\"docs-develop-js-sdk-interfaces-Ask-MetadataAskResponseItem-md\",\"title\":\"docs
