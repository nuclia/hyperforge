        data\":{\"texts\":{\"page\":{\"value\":{\"body\":\"# Search and answer generation\\\
        n\\n## Search\\n\\nNuclia supports 2 different search endpoints:\\n\\n- `search`:\
        \ returns several result sets according the different search techniques (full-text,\
        \ fuzzy, semantic).\\n- `find`: returns a single result set where all different\
        \ results are merged into a hierarchical structure.\\n\\nBoth endpoints support\
        \ the same query parameters.\\n\\n- CLI:\\n\\n  ```bash\\n  nuclia kb search\
        \ search --query=\\\"My search\\\"\\n  nuclia kb search find --query=\\\"\
        My search\\\" --filters=\\\"['/icon/application/pdf','/classification.labels/region/Asia']\\\
        \"\\n  ```\\n\\n- SDK:\\n\\n  ```python\\n  from nuclia import sdk\\n  search\
        \ = sdk.NucliaSearch()\\n  search.search(query=\\\"My search\\\", filters=['/icon/application/pdf',\
        \ '/classification.labels/region/Asia'])\\n  search.find(query=\\\"My search\\\
        \")\\n  ```\\n\\nGet JSON output:\\n\\n```bash\\nnuclia kb search find --query=\\\
        \"My search\\\" --json\\n```\\n\\nGet YAML output:\\n\\n```bash\\nnuclia kb\
        \ search search --query=\\\"My search\\\" --yaml\\n```\\n\\n## Generative\
        \ answer\\n\\nBased on a `find` request, Nuclia uses a generative AI to answer\
        \ the question based on the context without hallucinations and with the find\
        \ result and relations.\\n\\n- CLI:\\n\\n  ```bash\\n  nuclia kb search ask\
        \ --query=\\\"My question\\\"\\n  ```\\n\\n- SDK:\\n\\n  ```python\\n  from\
        \ nuclia import sdk\\n  search = sdk.NucliaSearch()\\n  search.ask(query=\\\
        \"My question\\\")\\n  ```\\n\\n  You can also use the `AskRequest` item to\
        \ configure the request with all the parameters supported:\\n\\n  ```python\\\
        n  from nuclia import sdk\\n  from nucliadb_models.search import AskRequest\\\
        n\\n  search = sdk.NucliaSearch()\\n  query = AskRequest(query=\\\"My question\\\
        \", prefer_markdown=True, citations=True)\\n  search.ask(query=query)\\n \
        \ ```\\n\\n### Reasoning\\n\\nSome LLMs support reasoning. In some models,\
        \ reasoning is enabled by default, while in others it must be explicitly requested.\
        \ You can control this behavior using the reasoning parameter.\\n\\n- SDK:\\\
        n\\n  ```python\\n  from nuclia import sdk\\n  from nucliadb_models.search\
        \ import AskRequest, Reasoning\\n\\n  search = sdk.NucliaSearch()\\n  query\
        \ = AskRequest(\\n    query=\\\"My question with extra reasoning effort\\\"\
        ,\\n    max_tokens=5000,\\n    reasoning=Reasoning(\\n        display=True,\
        \      # Show reasoning in the response\\n        effort=\\\"low\\\",    \
        \  # Can be \\\"low\\\", \\\"medium\\\", or \\\"high\\\"\\n        budget_tokens=1024\
        \ # How many tokens reasoning can use\\n    ),\\n  )\\n  search.ask(query=query)\\\
        n  ```\\n\\nModel Support for Reasoning Options:\\n\\n* **OpenAI models**\
        \ \u2192 support `effort` only.\\n* **Google & Anthropic models** \u2192 support\
        \ `budget_tokens` only.\\n\\n:::tip\\nIf you send just one of these values\
        \ (`effort` or `budget_tokens`), Nuclia will automatically fill in the other\
        \ for you.\\n:::\\n\\n:::warning\\n* Enabling reasoning can use additional\
        \ tokens, which may increase your usage costs.\\n* You may need to increase\
        \ `max_tokens` to give the LLM enough room to reason and generate an answer.\\\
        n:::\\n\\n## Filtering\\n\\nAny endpoint that involves search (`search`, `find`\
        \ and `ask`) also support more advanced filtering expressions. Expressions\
        \ can have one of the following operators:\\n\\n- `all`: this is the default.\
        \ Will make search return results containing all specified filter labels.\\\
        n- `any`: returns results containing at least one of the labels.\\n- `none`:\
        \ returns results that do not contain any of the labels.\\n- `not_all`: returns\
        \ results that do not contain all specified labels.\\n\\nNote that multiple\
        \ expressions can be chained in the `filters` parameter and the conjunction\
        \ of all of them will be computed.\\n\\nHere are some examples:\\n\\n- CLI:\\\
        n\\n  ```bash\\n  nuclia kb search find --query=\\\"My search\\\" --filters=\\\
        \"[{'any':['/icon/application/pdf','/icon/image/mp4']}]\\\"\\n  ```\\n\\n-\
        \ SDK:\\n\\n  ```python\\n  from nuclia import sdk\\n  from nucliadb_models.search\
        \ import Filter\\n\\n  search = sdk.NucliaSearch()\\n  search.ask(\\n    query=\\\
        \"My question\\\",\\n    filters=[Filter(any=['/classification.labels/region/Europe','/classification.labels/region/Asia'])],\\\
        n  )\\n  ```\\n\\n## Using RAG strategies\\n\\nRAG strategies can be used\
        \ to improve the quality of the answers by extending the search results passed\
        \ to the LLM as context.\\n\\n- CLI:\\n\\n  ```bash\\n  nuclia kb search ask\
        \ --query=\\\"My question\\\" --rag_strategies='[{\\\"name\\\":\\\"hierarchy\\\
        \"}]'\\n  ```\\n\\n- SDK:\\n\\n  ```python\\n  from nuclia import sdk\\n \
        \ search = sdk.NucliaSearch()\\n  search.ask(query=\\\"My question\\\", rag_strategies=[{\\\
        \"name\\\": \\\"hierarchy\\\"}])\\n  ```\\n\\nSee the [RAG strategies documentation](https://docs.rag.progress.cloud/docs/rag/rag-strategy)\
        \ for more information.\\n\\n## Complex queries\\n\\nThe Python SDK allows\
        \ to use all the options supported by the `/find` and `/ask` endpoints,\\\
        nbut not all of the options can be passed as specific parameter.\\nIn these\
        \ cases, you can just pass your query as a dictionnary in the `query` parameter.\\\
        n\\n- CLI:\\n\\n  ```bash\\n  nuclia kb search find --query='{\\\"query\\\"\
        : \\\"My search\\\", \\\"filters\\\": [\\\"/icon/application/pdf\\\", \\\"\
        /classification.labels/region/Asia\\\"]}'\\n  nuclia kb search ask --query='{\\\
        \"query\\\": \\\"My search\\\",\\\"top_k\\\": 5}'\\n  ```\\n\\n- SDK:\\n\\\
        n  ```python\\n  from nuclia import sdk\\n  search = sdk.NucliaSearch()\\\
        n  search.find(query={\\\"query\\\": \\\"My search\\\", \\\"filters\\\": [\\\
        \"/icon/application/pdf\\\", \\\"/classification.labels/region/Asia\\\"]})\\\
        n  search.ask(query={\\\"query\\\": \\\"My search\\\",\\\"top_k\\\": 5})\\\
        n  ```\\n\\n## Graph queries\\n\\nThe Python SDK allows graph queries supported\
        \ by the `/graph` endpoint. Although\\na bit cumbersome, the knowledge graph\
        \ can be queried as in this example:\\n\\n- CLI:\\n\\n  ```bash\\n  nuclia\
        \ kb search graph --query='{\\\"query\\\": {\\\"prop\\\": \\\"path\\\", \\\
        \"source\\\": {\\\"value\\\": \\\"Rust\\\"}, \\\"destination\\\": {\\\"value\\\
        \": \\\"Python\\\"}}}'\\n  ```\\n\\n- SDK:\\n\\n  ```python\\n  from nuclia\
        \ import sdk\\n  search = sdk.NucliaSearch()\\n  search.graph(\\n      query={\\\
        n          \\\"query\\\": {\\n              \\\"prop\\\": \\\"path\\\",\\\
        n              \\\"source\\\": {\\\"value\\\": \\\"Rust\\\"},\\n         \
        \     \\\"destination\\\": {\\\"value\\\": \\\"Python\\\"}\\n          }\\\
        n      }\\n  )\\n  ```\\n\\nFor more information about graph querying, please\
        \ refer to [Nuclia's graph\\ndoc](https://docs.rag.progress.cloud/docs/rag/advanced/graph)\
        \ or the [API reference](https://docs.rag.progress.cloud/docs/api#tag/Search/operation/graph_search_knowledgebox_kb__kbid__graph_post)\\\
        n\",\"format\":\"MARKDOWN\",\"md5\":\"57ed2bd023399aee08015a57a948ebf2\",\"\
