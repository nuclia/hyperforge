- request:
    body: '{"question": "", "retrieval": true, "user_id": "rao_answer_summary-ask",
      "system": null, "chat_history": [], "context": [], "query_context": {}, "query_context_order":
      {}, "truncate": true, "user_prompt": {"prompt": "\nBased on the provided context
      and user question, perform the following tasks:\n\n1. Select only information
      directly relevant to the question.\n2. Break down compound sentences into simple,
      single-idea statements. Preserve original phrasing when possible.\n3. For any
      named entity with descriptive details, separate those details into distinct
      propositions.\n4. Ensure clarity by replacing pronouns (e.g., \"it\", \"he\",
      \"she\", \"they\", \"this\", \"that\") with the full names of the entities they
      reference, and add necessary modifiers to clarify meaning.\n5. The context may
      be delimited by tags such as <START OF CONTEXT> and <END OF CONTEXT>. Treat
      everything between these tags as context.\n6. Assess whether the context sufficiently
      answers the question. If it answers it partially, provide the answer; if it
      does not answer it fully, specify what information is missing to answer the
      question.\n7. If the context does not answer the question at all, just return
      the original question as the missing information.\n8. The `citations` field
      consists ONLY in a list of block IDs that are relevant to the answer, following
      these rules:\n  - Use the format: block-AB\n  - Just mention the block IDs,
      do NOT include any other text.\n  - Just mention the blocks actually relevant
