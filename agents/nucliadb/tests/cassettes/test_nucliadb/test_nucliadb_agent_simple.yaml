        \\n Methods \\n ask() \\n ask(query, context, features, options) \\n \\n ask(query,
        context?, features?, options?): Observable\\\\ \\n \\n Retrieves a generative
        answer for the given query. \\n The generative answer is a text that is generated
        chunk by chunk by the language model. \\n It is retrieved through a readable
        HTTP stream, so the chat() method returns an Observable \\n emitting a value
        each time a new chunk is available. \\n The incomplete attribute of the emitted
        value indicates if the asnwer is complete or not. \\n Example: \\n ts \\n
        nuclia.knowledgeBox \\n .ask('where does the Little Prince live') \\n .pipe(filter((answer)
        => !answer.incomplete)) \\n .subscribe((answer) => { \\n console.log(answer.text);
