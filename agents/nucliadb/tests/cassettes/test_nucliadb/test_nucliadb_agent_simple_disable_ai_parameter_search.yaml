        openai-api-compatible-models\\ntitle: Connect to any OpenAI API compatible
        LLM\\n---\\n\\n# Connect to any OpenAI API compatible LLM\\n\\nAgentic RAG
        allows you to connect to any OpenAI API compatible LLM. This means that you
        can use any LLM that has an API compatible with the OpenAI API which has become
        a standard in the industry.\\n\\nMany of the options for self-hosted LLMs,
        open-source LLMs hosted by cloud providers or commercial LLMs are compatible
        with the OpenAI API. This means that you can use them with Agentic RAG without
        any modifications.\\n\\n## Configuration\\n\\nTo modify your knowledge box
        configuration you can do so in three manners, through the API, the Nuclia
        CLI / SDK or the Agentic RAG dashboard.\\n\\nThe Agentic RAG dashboard offers
        the most user-friendly way to modify the configuration of your knowledge box
        and we will use it in this example.\\n\\nWe will be setting up a connection
        to the **Phi 4 Reasoning Plus** model, hosted by **OpenRouter** which offers
        a wide range of open-source and commercial models compatible with the OpenAI
        API. We can see more information about this specific model [here](https://openrouter.ai/microsoft/phi-4-reasoning-plus:free),
        the API parameters are located under the **API** tab.\\n\\n1. **Open the AI
        Models page**  \\n   In the left sidebar under **Advanced**, click **AI Models**.\\n2.
        **Select \u201COpenAI API Compatible Model\u201D**  \\n   From the models
        list, choose **OpenAI API Compatible Model**.\\n3. **Enable custom Key**  \\n
        \  Toggle the option for using you own `OpenAI API Compatible Key` if it is
        not already enabled.\\n4. **Fill in the configuration parameters**\\n\\n   -
        **API Key**:\\n     - Description: The API key for your LLM. This is the key
        that you would use as an authorization header in the API. You may leave this
        blank if the endpoint you are connecting to does not require an API key.\\n
        \    - Example: We will set this to our OpenRouter API key.\\n   - **API URL**:\\n
        \    - Description: The URL of the API endpoint for your LLM. This may be
        shared between multiple models.\\n     - Example: For OpenRouter, it is the
        same for all models: `https://openrouter.ai/api/v1`\\n   - **Model**:\\n     -
        Description: The name of the model you want to use, it needs to exactly match
        the name of the model in the API.\\n     - Example: For Phi 4 Reasoning Plus
        in the OpenRouter API, it is `microsoft/phi-4-reasoning-plus:free`.\\n   -
        **Maximum supported input tokens**:\\n     - Description: The maximum number
        of tokens that the model can accept as input. Be mindful that this takes into
        account the tokens used in the prompt, query and context. Also take note that
        some models may provide their context window as the total between input and
        output tokens, while others may provide it as the input tokens only.\\n     -
        Example: For Phi 4 Reasoning Plus, the total context size is `32768` tokens,
        as we want to leave room for the output, we will set the maximum supported
        input tokens as `32768 - 1024 = 31744`.\\n   - **Maximum supported output
        tokens**:\\n     - Description: The maximum number of tokens that the model
        can generate as output. Again, we should keep in mind that this value summed
        to the **Maximum supported input tokens** should not exceed the total context
        size supported by the model.\\n     - Example: For Phi 4 Reasoning Plus, the
        maximum output tokens is specified at `32768`, but we already reserved `31744`
        for the input tokens, so we will set this to `32768 - 31744 = 1024`.\\n   -
        **Model Features**:\\n     - Description: Under this section you will find
        multiple toggles related to features supported by the model, these vary from
        model to model, but most often the default values are well suited to most
        use cases. The most relevant toggle is for `Image Support` which allows you
        to use images as input for the model.\\n     - Example: Image input is not
        supported by Phi 4 Reasoning Plus, so we will leave it disabled.\\n\\n5. **Save**
        \ \\n   Click **Save changes**.\\n\\n6. **Test your model**  \\n   Run a sample
        query in Agentic RAG or via API/CLI. Adjust your prompt templates and token
        settings as needed.\\n\",\"format\":\"MARKDOWN\",\"md5\":\"37cd8aff748addd04a363fa50828d1fe\",\"extract_strategy\":\"\",\"split_strategy\":\"\"},\"extracted\":{\"text\":{\"text\":\"
        \\n id: openai-api-compatible-models \\n title: Connect to any OpenAI API
        compatible LLM \\n \\n Connect to any OpenAI API compatible LLM \\n Agentic
        RAG allows you to connect to any OpenAI API compatible LLM. This means that
        you can use any LLM that has an API compatible with the OpenAI API which has
        become a standard in the industry. \\n Many of the options for self-hosted
        LLMs, open-source LLMs hosted by cloud providers or commercial LLMs are compatible
        with the OpenAI API. This means that you can use them with Agentic RAG without
        any modifications. \\n Configuration \\n To modify your knowledge box configuration
        you can do so in three manners, through the API, the Nuclia CLI / SDK or the
        Agentic RAG dashboard. \\n The Agentic RAG dashboard offers the most user-friendly
        way to modify the configuration of your knowledge box and we will use it in
        this example. \\n We will be setting up a connection to the Phi 4 Reasoning
        Plus model, hosted by OpenRouter which offers a wide range of open-source
        and commercial models compatible with the OpenAI API. We can see more information
        about this specific model here, the API parameters are located under the API
        tab. \\n \\n Open the AI Models page \\n In the left sidebar under Advanced,
        click AI Models. \\n Select OpenAI API Compatible Model \\n From the models
        list, choose OpenAI API Compatible Model. \\n Enable custom Key \\n Toggle
        the option for using you own OpenAI API Compatible Key if it is not already
        enabled. \\n \\n Fill in the configuration parameters \\n \\n \\n API Key:
        \\n \\n Description: The API key for your LLM. This is the key that you would
        use as an authorization header in the API. You may leave this blank if the
        endpoint you are connecting to does not require an API key. \\n Example: We
        will set this to our OpenRouter API key. \\n \\n \\n API URL: \\n Description:
        The URL of the API endpoint for your LLM. This may be shared between multiple
        models. \\n Example: For OpenRouter, it is the same for all models: https://openrouter.ai/api/v1
        \\n \\n \\n Model: \\n Description: The name of the model you want to use,
        it needs to exactly match the name of the model in the API. \\n Example: For
        Phi 4 Reasoning Plus in the OpenRouter API, it is microsoft/phi-4-reasoning-plus:free.
        \\n \\n \\n Maximum supported input tokens: \\n Description: The maximum number
        of tokens that the model can accept as input. Be mindful that this takes into
        account the tokens used in the prompt, query and context. Also take note that
        some models may provide their context window as the total between input and
        output tokens, while others may provide it as the input tokens only. \\n Example:
        For Phi 4 Reasoning Plus, the total context size is 32768 tokens, as we want
        to leave room for the output, we will set the maximum supported input tokens
        as 32768 - 1024 = 31744. \\n \\n \\n Maximum supported output tokens: \\n
        Description: The maximum number of tokens that the model can generate as output.
        Again, we should keep in mind that this value summed to the Maximum supported
        input tokens should not exceed the total context size supported by the model.
        \\n Example: For Phi 4 Reasoning Plus, the maximum output tokens is specified
        at 32768, but we already reserved 31744 for the input tokens, so we will set
        this to 32768 - 31744 = 1024. \\n \\n \\n \\n Model Features: \\n \\n Description:
        Under this section you will find multiple toggles related to features supported
        by the model, these vary from model to model, but most often the default values
        are well suited to most use cases. The most relevant toggle is for Image Support
        which allows you to use images as input for the model. \\n Example: Image
        input is not supported by Phi 4 Reasoning Plus, so we will leave it disabled.
        \\n \\n \\n \\n Save \\n Click Save changes. \\n \\n \\n Test your model \\n
        Run a sample query in Agentic RAG or via API/CLI. Adjust your prompt templates
        and token settings as needed. \\n \\n \",\"split_text\":{},\"deleted_splits\":[]},\"metadata\":{\"metadata\":{\"links\":[\"https://openrouter.ai/api/v1\"],\"paragraphs\":[{\"start\":0,\"end\":330,\"start_seconds\":[],\"end_seconds\":[],\"kind\":\"TEXT\",\"classifications\":[],\"sentences\":[{\"start\":3,\"end\":201,\"key\":\"\"},{\"start\":201,\"end\":330,\"key\":\"\"}]},{\"start\":330,\"end\":549,\"start_seconds\":[],\"end_seconds\":[],\"kind\":\"TEXT\",\"classifications\":[],\"sentences\":[{\"start\":331,\"end\":471,\"key\":\"\"},{\"start\":471,\"end\":549,\"key\":\"\"}]},{\"start\":549,\"end\":858,\"start_seconds\":[],\"end_seconds\":[],\"kind\":\"TEXT\",\"classifications\":[],\"sentences\":[{\"start\":550,\"end\":711,\"key\":\"\"},{\"start\":711,\"end\":858,\"key\":\"\"}]},{\"start\":858,\"end\":1156,\"start_seconds\":[],\"end_seconds\":[],\"kind\":\"TEXT\",\"classifications\":[],\"sentences\":[{\"start\":859,\"end\":1045,\"key\":\"\"},{\"start\":1045,\"end\":1156,\"key\":\"\"}]},{\"start\":1156,\"end\":1450,\"start_seconds\":[],\"end_seconds\":[],\"kind\":\"TEXT\",\"classifications\":[],\"sentences\":[{\"start\":1159,\"end\":1240,\"key\":\"\"},{\"start\":1240,\"end\":1337,\"key\":\"\"},{\"start\":1337,\"end\":1450,\"key\":\"\"}]},{\"start\":1450,\"end\":1715,\"start_seconds\":[],\"end_seconds\":[],\"kind\":\"TEXT\",\"classifications\":[],\"sentences\":[{\"start\":1453,\"end\":1548,\"key\":\"\"},{\"start\":1548,\"end\":1622,\"key\":\"\"},{\"start\":1622,\"end\":1715,\"key\":\"\"}]},{\"start\":1715,\"end\":1977,\"start_seconds\":[],\"end_seconds\":[],\"kind\":\"TEXT\",\"classifications\":[],\"sentences\":[{\"start\":1716,\"end\":1775,\"key\":\"\"},{\"start\":1775,\"end\":1841,\"key\":\"\"},{\"start\":1841,\"end\":1887,\"key\":\"\"},{\"start\":1887,\"end\":1977,\"key\":\"\"}]},{\"start\":1977,\"end\":2202,\"start_seconds\":[],\"end_seconds\":[],\"kind\":\"TEXT\",\"classifications\":[],\"sentences\":[{\"start\":1978,\"end\":2101,\"key\":\"\"},{\"start\":210