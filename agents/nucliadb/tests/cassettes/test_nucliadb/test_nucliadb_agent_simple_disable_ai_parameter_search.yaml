        n\\n***\\n\\n### generate()\\n\\n> **generate**(`question`, `context`): `Observable`\\\
        \\<`object`\\\\>\\n\\nPerforms a question answering operation based on a given\
        \ context.\\n\\nExample:\\n ```ts\\n nuclia.knowledgeBox\\n   .generate('Who\
        \ is Eric from Toronto?', [\\n     'Eric is a taxi driver',\\n     'Eric was\
        \ born in France',\\n     'Eric lives in Toronto',\\n   ]))\\n   .subscribe(({\
        \ answer }) => {\\n     console.log('answer', answer);\\n   });\\n ```\\n\\\
        n#### Parameters\\n\\n\u2022 **question**: `string`\\n\\n\u2022 **context**:\
        \ `string`[] = `[]`\\n\\n#### Returns\\n\\n`Observable`\\\\<`object`\\\\>\\\
        n\\n##### answer\\n\\n> **answer**: `string`\\n\\n##### cannotAnswer\\n\\\
        n> **cannotAnswer**: `boolean`\\n\\n#### Inherited from\\n\\n[`IKnowledgeBox`](../interfaces/IKnowledgeBox.md).[`generate`](../interfaces/IKnowledgeBox.md#generate)\\\
        n\\n#### Defined in\\n\\n[libs/sdk-core/src/lib/db/kb/kb.ts:530](https://github.com/nuclia/frontend/blob/f1e43b7ed1446e3c0e98b96653673062f734a3f2/libs/sdk-core/src/lib/db/kb/kb.ts#L530)\\\
        n\\n***\\n\\n### generateJSON()\\n\\n> **generateJSON**(`question`, `json_schema`,\
        \ `context`): `Observable`\\\\<`object`\\\\>\\n\\nPerforms a question answering\
        \ operation using a JSON schema.\\n\\nExample:\\n ```ts\\n nuclia.knowledgeBox\\\
        n   .generateJSON(\\n     'Who is Eric from Toronto?',\\n     {\\n       name:\
        \ 'info',\\n       parameters: {\\n         properties: {\\n           location:\
        \ {\\n             title: 'Location',\\n             description: 'The location\
        \ of the person',\\n             type: 'string',\\n           },\\n      \
        \     name: {\\n             title: 'Name',\\n             description: 'The\
        \ name of the person',\\n             type: 'string',\\n           },\\n \
        \        },\\n         required: ['name', 'location'],\\n       },\\n    \
        \ },\\n     [\\n       'Eric is a taxi driver',\\n       'Eric was born in\
        \ France',\\n       'Eric lives in Toronto',\\n     ],\\n   )).subscribe((answer)\
        \ => {\\n     console.log('location', answer.answer.location);\\n   });\\\
        n ```\\n\\n#### Parameters\\n\\n\u2022 **question**: `string`\\n\\n\u2022\
        \ **json\\\\_schema**: `object`\\n\\n\u2022 **context**: `string`[] = `[]`\\\
