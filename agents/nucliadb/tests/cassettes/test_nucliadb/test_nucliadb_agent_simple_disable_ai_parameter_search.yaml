        n\\n***\\n\\n### find()\\n\\n> **find**(`query`, `features`, `options`?):\
        \ `Observable`\\\\<[`FindResults`](../namespaces/Search/interfaces/FindResults.md)\
        \ \\\\| [`IErrorResponse`](../interfaces/IErrorResponse.md)\\\\>\\n\\nPerforms\
        \ a find operation in the Knowledge Box, which is the recommended way to search\
        \ for results.\\n\\nExample:\\n ```ts\\n nuclia.knowledgeBox\\n   .find('where\
        \ does the Little Prince live')\\n   .subscribe((searchResult) => {\\n   \
        \  console.log('search result', searchResult);\\n   });\\n ```\\n\\n#### Parameters\\\
        n\\n\u2022 **query**: `string`\\n\\n\u2022 **features**: [`Features`](../namespaces/Search/enumerations/Features.md)[]\
        \ = `[]`\\n\\n\u2022 **options?**: [`SearchOptions`](../interfaces/SearchOptions.md)\\\
        n\\n#### Returns\\n\\n`Observable`\\\\<[`FindResults`](../namespaces/Search/interfaces/FindResults.md)\
