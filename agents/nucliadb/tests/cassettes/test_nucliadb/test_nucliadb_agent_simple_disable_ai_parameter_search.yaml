        n\\n***\\n\\n### getTempToken()\\n\\n> **getTempToken**(`payload`?, `ignoreExpiration`?):\
        \ `Observable`\\\\<`string`\\\\>\\n\\nReturns an ephemeral token.\\nRequires\
        \ account id and zone to be set in the Nuclia options (except when working\
        \ with a local NucliaDB instance).\\n\\nThis is useful when displaying a clickable\
        \ link to a file in a private Knowledge Box\\n(the token will authorize the\
        \ request even though there are no authentication headers).\\n\\nExample:\\\
        n ```ts\\n const downloadLink = `${nuclia.rest.getFullpath(filePath)}?eph-token=${nuclia.knowledgeBox.getTempToken()}`;\\\
        n ```\\n\\n#### Parameters\\n\\n\u2022 **payload?**: `any`\\n\\nOptional payload\
        \ to provide extra data for the token generation\\n\\n\u2022 **ignoreExpiration?**:\
        \ `boolean` = `false`\\n\\nOptional By default, a temp token is valid for\
        \ 5min and the same token returned if this method is called several times\
        \ during this time.\\nPassing ignoreExpiration flag to true will ignore this\
        \ expiration delay and will always return a new token.\\n\\n#### Returns\\\
        n\\n`Observable`\\\\<`string`\\\\>\\n\\n#### Inherited from\\n\\n[`IKnowledgeBox`](../interfaces/IKnowledgeBox.md).[`getTempToken`](../interfaces/IKnowledgeBox.md#gettemptoken)\\\
        n\\n#### Defined in\\n\\n[libs/sdk-core/src/lib/db/kb/kb.ts:707](https://github.com/nuclia/frontend/blob/f1e43b7ed1446e3c0e98b96653673062f734a3f2/libs/sdk-core/src/lib/db/kb/kb.ts#L707)\\\
