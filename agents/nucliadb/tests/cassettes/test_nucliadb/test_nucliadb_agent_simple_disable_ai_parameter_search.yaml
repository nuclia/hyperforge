        \ AskRequest( \\n query= My question with extra reasoning effort , \\n max_tokens=5000,\
        \ \\n reasoning=Reasoning( \\n display=True, # Show reasoning in the response\
        \ \\n effort= low , # Can be low , medium , or high \\n budget_tokens=1024\
        \ # How many tokens reasoning can use \\n ), \\n ) \\n search.ask(query=query)\
        \ \\n ``` \\n Model Support for Reasoning Options: \\n \\n OpenAI models \u2192\
        \ support effort only. \\n Google & Anthropic models \u2192 support budget_tokens\
        \ only. \\n \\n :::tip \\n If you send just one of these values (effort or\
        \ budget_tokens), Nuclia will automatically fill in the other for you. \\\
        n ::: \\n :::warning \\n Enabling reasoning can use additional tokens, which\
        \ may increase your usage costs. \\n You may need to increase max_tokens to\
        \ give the LLM enough room to reason and generate an answer. \\n ::: \\n Filtering\
        \ \\n Any endpoint that involves search (search, find and ask) also support\
        \ more advanced filtering expressions. Expressions can have one of the following\
        \ operators: \\n \\n all: this is the default. Will make search return results\
        \ containing all specified filter labels. \\n any: returns results containing\
        \ at least one of the labels. \\n none: returns results that do not contain\
        \ any of the labels. \\n not_all: returns results that do not contain all\
        \ specified labels. \\n \\n Note that multiple expressions can be chained\
        \ in the filters parameter and the conjunction of all of them will be computed.\
        \ \\n Here are some examples: \\n \\n CLI: \\n \\n bash \\n nuclia kb search\
        \ find --query= My search --filters= [{'any':['/icon/application/pdf','/icon/image/mp4']}]\
        \ \\n \\n SDK: \\n \\n ```python \\n from nuclia import sdk \\n from nucliadb_models.search\
        \ import Filter \\n search = sdk.NucliaSearch() \\n search.ask( \\n query=\
        \ My question , \\n filters=[Filter(any=['/classification.labels/region/Europe','/classification.labels/region/Asia'])],\
        \ \\n ) \\n ``` \\n Using RAG strategies \\n RAG strategies can be used to\
        \ improve the quality of the answers by extending the search results passed\
        \ to the LLM as context. \\n \\n CLI: \\n \\n bash \\n nuclia kb search ask\
        \ --query= My question --rag_strategies='[{ name : hierarchy }]' \\n \\n SDK:\
        \ \\n \\n python \\n from nuclia import sdk \\n search = sdk.NucliaSearch()\
        \ \\n search.ask(query= My question , rag_strategies=[{ name : hierarchy }])\
        \ \\n See the RAG strategies documentation for more information. \\n Complex\
        \ queries \\n The Python SDK allows to use all the options supported by the\
        \ /find and /ask endpoints, \\n but not all of the options can be passed as\
