        \u2022 **Docs**\\n\\n***\\n\\n[@nuclia/core](../globals.md) / PredictAnswerOptions\\n\\n#
        Interface: PredictAnswerOptions\\n\\n## Properties\\n\\n### chat\\\\_history?\\n\\n>
