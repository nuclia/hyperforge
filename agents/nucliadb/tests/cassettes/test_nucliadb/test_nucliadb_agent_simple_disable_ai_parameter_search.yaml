        \ => knowledgeBox.getResource('09a94719a6444c5a9689394f6ed9baf6')))\\n   .subscribe((resource)\
        \ => {\\n     console.log('resource', resource);\\n   });\\n ```\\n\\n####\
        \ Parameters\\n\\n\u2022 **uuid**: `string`\\n\\n\u2022 **show**: [`ResourceProperties`](../enumerations/ResourceProperties.md)[]\
        \ = `...`\\n\\n\u2022 **extracted**: [`ExtractedDataTypes`](../enumerations/ExtractedDataTypes.md)[]\
        \ = `[]`\\n\\n#### Returns\\n\\n`Observable`\\\\<[`Resource`](Resource.md)\\\
