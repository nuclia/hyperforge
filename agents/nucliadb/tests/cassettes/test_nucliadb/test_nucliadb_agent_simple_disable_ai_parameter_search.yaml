        \u2022 **Docs**\\n\\n***\\n\\n[@nuclia/core](../globals.md) / ModelConfig\\n\\n#
        Interface: ModelConfig\\n\\n## Properties\\n\\n### assume\\\\_role?\\n\\n>
        `optional` **assume\\\\_role**: `number`\\n\\n#### Defined in\\n\\n[libs/sdk-core/src/lib/db/kb/kb.models.ts:592](https://github.com/nuclia/frontend/blob/2cdf45f8f245a8f8cf7947d11ce3818648e814b9/libs/sdk-core/src/lib/db/kb/kb.models.ts#L592)\\n\\n***\\n\\n###
        driver?\\n\\n> `optional` **driver**: `string`\\n\\n#### Defined in\\n\\n[libs/sdk-core/src/lib/db/kb/kb.models.ts:590](https://github.com/nuclia/frontend/blob/2cdf45f8f245a8f8cf7947d11ce3818648e814b9/libs/sdk-core/src/lib/db/kb/kb.models.ts#L590)\\n\\n***\\n\\n###
