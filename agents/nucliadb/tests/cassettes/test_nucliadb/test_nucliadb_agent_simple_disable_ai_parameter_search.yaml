        n\\n***\\n\\n### listenToProcessingNotifications()\\n\\n> **listenToProcessingNotifications**():\
        \ `Observable`\\\\<[`ResourceBaseNotification`](../interfaces/ResourceBaseNotification.md)[]\\\
        \\>\\n\\nStart listening to the Knowledge Box notifications, and returns the\
        \ list of notifications for resources which have processing completed (either\
        \ successfully or not).\\nNotifications are sent anytime processing is completed,\
        \ and processing is done anytime the resource is created or modified (like\
