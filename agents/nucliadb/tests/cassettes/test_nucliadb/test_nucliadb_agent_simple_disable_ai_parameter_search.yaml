        Defined in\\n\\n[libs/sdk-core/src/lib/db/kb/kb.models.ts:587](https://github.com/nuclia/frontend/blob/2cdf45f8f245a8f8cf7947d11ce3818648e814b9/libs/sdk-core/src/lib/db/kb/kb.models.ts#L587)\\n\\n***\\n\\n###
        max\\\\_images?\\n\\n> `optional` **max\\\\_images**: `string`\\n\\n#### Defined
        in\\n\\n[libs/sdk-core/src/lib/db/kb/kb.models.ts:591](https://github.com/nuclia/frontend/blob/2cdf45f8f245a8f8cf7947d11ce3818648e814b9/libs/sdk-core/src/lib/db/kb/kb.models.ts#L591)\\n\\n***\\n\\n###
        output\\\\_tokens\\n\\n> **output\\\\_tokens**: `object`\\n\\n#### default\\\\_max?\\n\\n>
