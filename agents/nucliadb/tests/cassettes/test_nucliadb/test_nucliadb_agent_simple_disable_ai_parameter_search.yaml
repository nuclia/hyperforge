        data\":{\"texts\":{\"page\":{\"value\":{\"body\":\"---\\nid: consumption\\\
        ntitle: Token consumption\\n---\\n\\nimport Tabs from \\\"@theme/Tabs\\\"\
        ;\\nimport TabItem from \\\"@theme/TabItem\\\";\\n\\n# Token consumption\\\
        n\\nAgentic RAG is a license and consumption-based service. This means that\
        \ you pay for the computational resources you consume. The consumption is\
        \ measured in **Agentic RAG tokens**.\\nAll public 3rd-party LLMs base their\
        \ pricing on the number of tokens consumed. In the LLM world, a token is around\
        \ 4-5 characters on average, which might fit an entire word or be split into\
        \ parts. The number of tokens is proportional to the amount of text, measured\
        \ in chunks of 4-5 characters. It closely relates to words but not entirely.\
        \ The longer a sentence is, the more tokens it will consume to read or to\
        \ generate it.\\nSince all these 3rd-party LLMs have different pricing, Agentic\
        \ RAG tokens serve to normalize the cost across all of them.\\n\\n## How Tokens\
        \ Are Consumed in RAG\\n\\nWhen a user asks a question to your Knowledge Box,\
        \ the token consumption process follows these steps:\\n\\n1. **Question Processing**:\
        \ The system finds the most relevant paragraphs to answer the question\\n2.\
        \ **Context Assembly**: These paragraphs are used as context when calling\
        \ the LLM model\\n3. **Prompt Creation**: Agentic RAG assembles the **prompt**,\
        \ **context**, and **question** into a single string\\n4. **LLM Processing**:\
        \ This complete string is sent to the LLM, corresponding to a certain number\
        \ of **input tokens**\\n5. **Answer Generation**: The LLM generates the answer,\
        \ which corresponds to a certain number of **output tokens**\\n\\n**Total\
        \ consumption** = Input tokens + Output tokens + Image tokens\\n\\n### Factors\
        \ That Impact Token Consumption\\n\\nToken consumption is directly affected\
        \ by:\\n\\n- **Large context**: Results from using RAG strategies like \\\"\
        Full resource\\\" or \\\"Neighbouring paragraphs\\\", or from using the `extra_context`\
        \ parameter\\n- **Long questions**: More detailed or complex questions require\
        \ more input tokens\\n- **Long prompts**: Extensive system prompts increase\
        \ the input token count\\n- **Detailed answers**: Comprehensive responses\
        \ require more output tokens\\n- **Images in context**: When using multimodal\
        \ models, images included in the retrieved context significantly increase\
        \ token consumption\\n\\n## How to Limit and Control Token Consumption\\n\\\
        n### Strategy 1: Optimize Your Parameters\\n\\nThe first approach to reducing\
        \ token consumption is to fine-tune your request parameters:\\n\\n- **Optimize\
        \ prompts**: Ensure your prompts are concise and focused, avoiding unnecessary\
        \ verbosity\\n- **Control resource scope**: When using the \\\"Full resource\\\
        \" strategy, use the `count` attribute to limit the number of resources returned\\\
        n- **Tune neighboring context**: For the \\\"Neighbouring paragraphs\\\" strategy,\
        \ optimize the `before` and `after` attributes to balance context quality\
        \ with token efficiency\\n- **Manage summary length**: When using the \\\"\
        Hierarchical\\\" strategy, ensure that resource summaries are appropriately\
        \ sized\\n- **Choose efficient models**: Select LLMs that offer better token\
        \ efficiency (typically, ChatGPT 4o-mini is more cost-effective than ChatGPT\
        \ 4o)\\n\\n### Strategy 2: Set Hard Limits\\n\\nYou can implement safeguards\
        \ against excessive token consumption:\\n\\nUse the `max_tokens` parameter\
        \ on the [`/ask` endpoint](/docs/api#tag/Search/operation/ask_knowledgebox_endpoint_kb__kbid__ask_post)\
        \ to set hard limits on:\\n- **Context size**: Limits the amount of retrieved\
        \ information sent to the LLM\\n- **Answer length**: Limits the length of\
        \ the generated response\\n\\n#### Important Considerations\\n\\n**Context\
        \ Limitations**:\\n- Restricting context size may result in less relevant\
        \ answers since the LLM has less information to work with\\n- Balance between\
        \ cost control and answer quality\\n\\n**Answer Length Limitations**:\\n-\
        \ The LLM might not complete its response if it hits the token limit, potentially\
        \ cutting sentences mid-way\\n- **Recommended approach**: Include length requirements\
        \ in your prompt (e.g., \\\"Please answer in less than 200 words\\\") rather\
        \ than relying solely on hard limits\\n- This allows the LLM to naturally\
        \ conclude its response within the desired length\\n\\n## How to Monitor Token\
        \ Consumption\\n\\n### Understanding Token Consumption Data\\n\\nYou can receive\
        \ detailed token consumption information from the following endpoints that\
        \ utilize LLM models: `ask`, `chat`, `remi`, `query`, `sentence`, `summarize`,\
        \ `tokens`, and `rerank`.\\n\\n:::note\\nThe `rephrase` endpoint currently\
        \ does not support token consumption monitoring.\\n:::\\n\\nTo receive token\
        \ consumption data, you must include the following header in your request:\\\
        n```\\nX-SHOW-CONSUMPTION: true\\n```\\n\\nThe token consumption data is provided\
        \ in different formats depending on the response type:\\n- **Streaming responses**\
        \ (`application/x-ndjson`): Token consumption appears as a separate JSON chunk\
        \ with type \\\"consumption\\\"\\n- **Standard responses** (`application/json`):\
        \ Token consumption is included in a \\\"consumption\\\" field within the\
        \ main response\\n\\n### Token Consumption Response Format\\n\\n<Tabs groupId=\\\
        \"token-consumption\\\">\\n  <TabItem value=\\\"streaming json\\\" label=\\\
        \"Streaming (x-ndjson)\\\">\\n    ```json\\n    {\\n      \\\"item\\\": {\\\
        n        \\\"type\\\": \\\"consumption\\\",\\n        \\\"normalized_tokens\\\
        \": {\\n          \\\"input\\\": 13,\\n          \\\"output\\\": 34,\\n  \
        \        \\\"image\\\": 0.0\\n        },\\n        \\\"customer_key_tokens\\\
        \": {\\n          \\\"input\\\": 0.0,\\n          \\\"output\\\": 0.0,\\n\
        \          \\\"image\\\": 0.0\\n        }\\n      }\\n    }\\n    ```\\n \
        \ </TabItem>\\n  <TabItem value=\\\"json\\\" label=\\\"Standard (json)\\\"\
        >\\n    ```json\\n    {\\n      \\\"consumption\\\": {\\n        \\\"normalized_tokens\\\
        \": {\\n          \\\"input\\\": 13,\\n          \\\"output\\\": 34,\\n  \
        \        \\\"image\\\": 0.0\\n        },\\n        \\\"customer_key_tokens\\\
        \": {\\n          \\\"input\\\": 0.0,\\n          \\\"output\\\": 0.0,\\n\
        \          \\\"image\\\": 0.0\\n        }\\n      }\\n    }\\n    ```\\n \
        \ </TabItem>\\n</Tabs>\\n\\n### Understanding Token Types\\n\\n**Normalized\
        \ Tokens** (`normalized_tokens`):\\n- These represent the number of Agentic\
        \ RAG tokens consumed and that you will be billed for\\n- Values are normalized\
        \ across different LLM providers for consistent billing\\n- Include separate\
        \ counts for:\\n  - `input`: Tokens used for the prompt, context, and question\\\
        n  - `output`: Tokens used for the generated response\\n  - `image`: Tokens\
        \ used for image processing (when applicable)\\n\\n**Customer Key Tokens**\
        \ (`customer_key_tokens`):\\n- These represent tokens consumed when using\
        \ your own LLM API keys\\n- These tokens are **not billed** by Agentic RAG\
        \ since you're using your own API keys\\n- Values are also normalized for\
        \ comparison purposes across different providers\\n\",\"format\":\"MARKDOWN\"\
