        How to Use Tasks \\n Create a task \\n SDK Example \\n ```python \\n from
        nuclia import sdk \\n from nuclia_models.worker.tasks import TaskName, ApplyOptions,
        DataAugmentation \\n from nuclia_models.worker.proto import ApplyTo, Filter,
        LLMConfig, Operation \\n kb = sdk.NucliaKB() \\n kb.task.start( \\n task_name=TaskName.LABELER,
        \\n apply=ApplyOptions.EXISTING, \\n parameters=DataAugmentation( \\n name=
        test , \\n on=ApplyTo.FIELD, \\n filter=Filter(), \\n operations=[Operation()],
        \\n llm=LLMConfig(), \\n ), \\n ) \\n ``` \\n CLI Example \\n bash \\n nuclia
        kb task start --task_name=labeler --apply=existing --parameters='{ \\n name
        : test , \\n on : 1, \\n filter : {}, \\n operations : [ \\n {} \\n ], \\n
        llm : {} \\n }' \\n List all tasks \\n SDK Example \\n ```python \\n from
