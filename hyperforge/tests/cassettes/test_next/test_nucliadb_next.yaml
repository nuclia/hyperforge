        ```python \\n from nuclia import sdk \\n from nuclia_models.worker.tasks import
        TaskName, ApplyOptions, DataAugmentation \\n from nuclia_models.worker.proto
        import ( \\n ApplyTo, \\n Filter, \\n LLMConfig, \\n Operation, \\n QAOperation,
        \\n EntityDefinition, \\n ) \\n KNOWLEDGE_BOX_URL = ( \\n https://europe-1.rag.progress.cloud/api/v1/kb/
        \\n ) \\n sdk.NucliaAuth().kb(url=KNOWLEDGE_BOX_URL, token= ) \\n kb = sdk.NucliaKB()
        \\n output = kb.task.start( \\n task_name=TaskName.SYNTHETIC_QUESTIONS, \\n
        apply=ApplyOptions.NEW, \\n parameters=DataAugmentation( \\n name= my-q&a-task
