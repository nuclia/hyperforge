[build-system]
requires = ["uv_build>=0.11.19,<0.12"]
build-backend = "uv_build"

[project]
name = "hyperforge"
version = "1.0.0"
authors = [{ name = "AI Data Team", email = "learning@nuclia.com" }]
description = "Agentic Framework for Orchestrated Runtime, Governance, and Execution"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "Apache-2.0"
dependencies = [
    "alembic",
    "pydantic",
    "nuclia>=4.14.0",
    "nuclia-models>=0.59.0",
    "nucliadb-models>=6.13.1.post6414",
    "nucliadb-sdk>=6.13.1.post6414",
    "nucliadb-telemetry[otel]>=6.15.0",
    "hyperforge-restricted",
    "pydantic_settings",
    "mcp>=1.26.0",
    "prometheus_client",
    "mrflagly>=0.2.11",
    "aiodns",
    "httpx>=0.28.1,<0.29",
    "httpcore>=1.0.9,<1.1",
    "jinja2",
    "jsonschema",
    "RestrictedPython",
    "databases[asyncpg]",
    "sqlalchemy",
    "cryptography",
    "mmh3",
    "psycopg2-binary",
    "tenacity",
    "websockets",
    "redis[hiredis]>=6.4.0",
    "types-redis>=4.6.0.20241004",
    "ruff>=0.15.10",
    "lru-dict",
    "sentry_sdk",
    "fastapi",
    "starlette>1.0.0",
    "uvicorn>=0.30.0",
    "a2a-sdk[grpc,http-server]>=1.0,<2",
]


[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-mock",
    "pytest-benchmark",
    "pytest-docker-fixtures>=1.4.2",
    "pytest-lazy-fixtures",
    "httpx[http2]",
    "hyperforge_rephrase",
    "inline_snapshot",
    "sqlalchemy_utils",
]

[tool.uv.build-backend]
# Include additional non-Python asset files
source-include = [
    "alembic/**/*",
    "alembic.ini",
    "VERSION",
    "frontend/dist/**/*",
]
source-exclude = ["tests/**/*"]

[project.urls]
"Progress" = "https://progress.com"
"Github" = "https://github.com/nuclia/hyperforge"
"API Reference" = "https://docs.rag.progress.cloud"

[tool.pytest.ini_options]
asyncio_mode = "auto"


[project.scripts]
hyperforge-api = "hyperforge.api:commands.run"
hyperforge-server = "hyperforge.server:run.run"
hyperforge-a2a-grpc = "hyperforge.a2a.run:run"
hyperforge-sandbox = "hyperforge.server:sandbox.run"
hyperforge-extract-openapi = "hyperforge.api.commands:extract_openapi"
hyperforge-workflows-cleanup-cronjob = "hyperforge.agents.workflow_cleanup:run"
hyperforge-standalone = "hyperforge.standalone:run.run"

[tool.ruff]
extend = "../ruff.toml"
